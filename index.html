  function renderDistributionResult(proposal, incomeAmount, dateISO) {
    var box = $('#distResult');
    var assigned = proposal.items.reduce(function (s, it) { return s + it.amountCents; }, 0);
    box.innerHTML =
      (proposal.deficitCents > 0
        ? '<div class="banner"><span>⚠ No alcanza para cubrir todo: faltan <strong>' + fmt(proposal.deficitCents) + '</strong>. Ajusta gastos opcionales o revisa tus metas.</span></div>'
        : '') +
      '<div class="table-wrap"><table><thead><tr><th>Destino</th><th class="wrap">Por qué</th><th style="text-align:right">Monto</th><th></th></tr></thead><tbody>' +
      proposal.items.map(function (it, i) {
        return '<tr><td class="wrap">' + esc(it.label) + '</td><td class="wrap hint">' + esc(it.reason) + '</td>' +
          '<td class="amount" style="text-align:right"><input type="number" step="0.01" data-alloc-idx="' + i + '" value="' + (it.amountCents / 100).toFixed(2) + '" style="width:100px;text-align:right;"></td><td></td></tr>';
      }).join('') +
      '<tr><td colspan="2"><strong>Sin asignar</strong></td><td class="amount" style="text-align:right"><strong>' + fmt(proposal.unallocatedCents) + '</strong></td><td></td></tr>' +
      '</tbody></table></div>' +
      '<div class="modal-actions" style="margin-top:14px;"><button class="btn btn-primary" id="saveDistBtn">Guardar plan de esta semana</button></div>';

    $('#saveDistBtn').addEventListener('click', function () {
      var weekStartISO = D.startOfWeek(dateISO, STATE.settings.weekStartsOn);
      var plans = (STATE.weeklyPlans || []).filter(function (p) { return p.weekStartISO !== weekStartISO; });
      plans.push({ weekStartISO: weekStartISO, expectedIncomeCents: incomeAmount, receivedIncomeCents: incomeAmount, allocations: proposal.items, notes: 'Distribución guardada el ' + D.today() });
      persist(shallowStateWith('weeklyPlans', plans));
      toast('Plan de la semana guardado');
    });
  }

  // =========================================================================
  // METAS Y RESERVAS
  // =========================================================================

  function renderMetas() {
    var el = $('#screen-metas');
    var today = D.today();
    var reserves = window.App.calc.reserves.computeAllReserves(STATE, today);

    // Fecha de vencimiento usada para contar los cobros de cada factura:
    // mostrarla vuelve verificable el numero de "cobros restantes".
    function dueOf(expenseId) {
      var e = byId(STATE.recurringExpenses, expenseId);
      return e ? e.nextDueDateISO : null;
    }

    el.innerHTML =
      '<div class="topbar"><div><h1>Metas y reservas</h1><div class="topbar-sub">Progreso real de tus metas y cuánto separar para facturas próximas</div></div></div>' +

      '<div class="section">' +
      (STATE.goals.length
        ? '<div class="card-grid">' + STATE.goals.map(renderGoalCard).join('') + '</div>'
        : '<div class="card empty">Todavía no tienes metas. Agrega una en Configuración.</div>') +
      '</div>' +

      '<div class="card section">' +
      '<div class="section-head"><div><span class="section-eyebrow">Facturas recurrentes</span><h2>Reservas necesarias por cobro</h2></div></div>' +
      '<p class="hint" style="font-size:12px;">“Cobros restantes” = días distintos en que te entra dinero entre hoy y el vencimiento de cada factura.</p>' +
      (reserves.perExpense.length
        ? '<div class="table-wrap"><table><thead><tr><th>Gasto</th><th style="text-align:right">Falta reservar</th><th style="text-align:right">Por cobro</th><th>Cobros restantes</th><th></th></tr></thead><tbody>' +
          reserves.perExpense.map(function (r) {
            return '<tr><td class="wrap">' + esc(r.name) + '</td>' +
              '<td class="amount" style="text-align:right">' + fmt(r.remainingCents) + '</td>' +
              '<td class="amount" style="text-align:right">' + fmt(r.reserveCentsPerPaycheck) + '</td>' +
              '<td>' + r.occurrencesRemaining +
                (dueOf(r.expenseId) ? '<br><span class="hint" style="font-size:11px;">hasta ' + displayDateShort(dueOf(r.expenseId)) + '</span>' : '') +
              '</td>' +
              '<td><button class="btn btn-sm btn-primary" data-mark-reserved="' + r.expenseId + '" data-amount="' + r.reserveCentsPerPaycheck + '">Marcar como reservado</button></td></tr>' +
              (r.warning ? '<tr><td colspan="5" class="wrap hint" style="color:var(--negative);">⚠ ' + esc(r.warning) + '</td></tr>' : '');
          }).join('') + '</tbody></table></div>'
        : '<div class="empty">No tienes gastos recurrentes configurados.</div>') +
      '<p class="hint">Total a reservar este período: <strong class="num">' + fmt(reserves.totalReserveCentsThisPeriod) + '</strong></p>' +
      '</div>';

    el.querySelectorAll('[data-mark-reserved]').forEach(function (b) {
      b.addEventListener('click', function () {
        var amount = Number(b.dataset.amount);
        var list = STATE.recurringExpenses.map(function (exp) {
          if (exp.id === b.dataset.markReserved) {
            var newReserved = Math.min(exp.amountCents, (exp.reservedCents || 0) + amount);
            return Object.assign({}, exp, { reservedCents: newReserved });
          }
          return exp;
        });
        persist(shallowStateWith('recurringExpenses', list));
        toast('Reserva actualizada');
      });
    });

    el.querySelectorAll('[data-contribute]').forEach(function (b) {
      b.addEventListener('click', function () { openContributeModal(byId(STATE.goals, b.dataset.contribute)); });
    });
    el.querySelectorAll('[data-alternatives]').forEach(function (b) {
      b.addEventListener('click', function () { openAlternativesModal(byId(STATE.goals, b.dataset.alternatives)); });
    });

  function renderGoalCard(goal) {

  function openContributeModal(goal) {
    var body =
      '<form class="modal-form">' +
      '<div class="form-row">' +
      '<div class="field"><label>Monto a aportar</label><input type="number" step="0.01" name="amount" placeholder="0.00"></div>' +

      '</div>' +
      '<label style="display:flex;gap:8px;align-items:center;margin-top:10px;font-weight:500;"><input type="checkbox" name="alsoMove" style="width:auto;"> También mover dinero real entre cuentas</label>' +
      '<div class="form-row" id="moveFields" style="display:none;">' +
      '<div class="field"><label>Desde cuenta</label><select name="accountId">' + accountOptions().map(function (o) { return '<option value="' + o.value + '">' + esc(o.label) + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label>Hacia cuenta</label><select name="toAccountId">' + accountOptions().map(function (o) { return '<option value="' + o.value + '">' + esc(o.label) + '</option>'; }).join('') + '</select></div>' +
      '</div>' +
      '<p class="hint">Por defecto solo actualiza tu progreso de ahorro (una asignación lógica). Marca la casilla si el dinero también salió físicamente de una cuenta hacia otra.</p>' +
      '<div class="form-error" hidden></div>' +
      '<div class="modal-actions"><button type="button" class="btn btn-ghost" data-cancel>Cancelar</button><button type="submit" class="btn btn-primary">Registrar</button></div>' +
      '</form>';
    openModal('Aportar a "' + esc(goal.name) + '"', body);
    var form = $('#modalBody .modal-form');
    form.querySelector('[data-cancel]').addEventListener('click', closeModal);
    form.elements['alsoMove'].addEventListener('change', function (e) { $('#moveFields').style.display = e.target.checked ? '' : 'none'; });
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var amount = M.toCents(parseFloat(form.elements['amount'].value || '0') || 0);
      if (amount <= 0) { showFormError(form, 'Ingresa un monto mayor a cero.'); return; }
      var dateISO = form.elements['dateISO'].value || D.today();
      var goals = STATE.goals.map(function (g) { return g.id === goal.id ? Object.assign({}, g, { savedCents: g.savedCents + amount }) : g; });
      var newState = shallowStateWith('goals', goals);
      if (form.elements['alsoMove'].checked) {
        var accountId = form.elements['accountId'].value, toAccountId = form.elements['toAccountId'].value;
        if (accountId === toAccountId) { showFormError(form, 'Elige dos cuentas distintas para mover el dinero.'); return; }
        try {
          newState = window.App.calc.tx.applyTransaction(newState, { type: 'transferencia', amountCents: amount, dateISO: dateISO, accountId: accountId, toAccountId: toAccountId, linkedGoalId: goal.id, note: 'Aporte a meta: ' + goal.name, status: 'confirmado' });
        } catch (err) { showFormError(form, err.message || String(err)); return; }
      }
      closeModal();
      persist(newState);
      toast('Aporte registrado');
    });
  }

  function openAlternativesModal(goal) {

  // =========================================================================

  // ---------- Instalación y explicación de almacenamiento ----------

  var deferredInstall = null;   // evento beforeinstallprompt (Chrome/Edge/Android)
  var cloudAvailable = false;   // ¿responde el almacenamiento en la nube?

  function isStandalone() {
    return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
      window.navigator.standalone === true;
  }
  function isInsideFrame() {
    try { return window.self !== window.top; } catch (e) { return true; }
  }
  function isIOS() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }
  // Solo tiene sentido ofrecer la instalación en la copia propia de la app
  // (no dentro de un iframe) y si todavía no está instalada.
  function canInstall() {
    return !isInsideFrame() && !isStandalone() && (!!deferredInstall || isIOS());
  }

  function storageTitle() {
    return cloudAvailable ? 'Guardado local + copia en la nube' : 'Guardado en este dispositivo';
  }
  function storageExplainerHtml() {
    if (cloudAvailable) {
      return 'Cada cambio se guarda al instante en este navegador y se sincroniza con una copia en la nube ligada a la app, ' +
        'así que puedes abrirla desde otro dispositivo y encontrar lo mismo. Aun así, exporta un respaldo JSON de vez en cuando: ' +
        'es tu red de seguridad y tu forma de llevarte los datos a donde quieras.';
    }
    return 'Tus datos se guardan automáticamente en el almacenamiento de este navegador, en este dispositivo. ' +
      'No viajan a ningún servidor: nadie más los ve, pero tampoco se sincronizan solos con tu otro teléfono o computadora. ' +
      'Si borras los datos de navegación o reinstalas el navegador, se pierden. ' +
      '<strong>Exporta un respaldo JSON con regularidad</strong> y guárdalo en tu nube de confianza: con ese archivo restauras todo en cualquier dispositivo.';
  }

  function wireInstallButton() {
    var btn = $('#installBtn');
    if (!btn) return;
    btn.addEventListener('click', function () {
      if (deferredInstall) {
        deferredInstall.prompt();
        deferredInstall.userChoice.then(function (res) {
          if (res && res.outcome === 'accepted') toast('¡Listo! Búscala en tu pantalla de inicio');
          deferredInstall = null;
          renderDatos();
        });
        return;
      }
      // iOS no expone el diálogo de instalación: hay que explicarlo.
      confirmAction(
        'En iPhone o iPad: toca el botón Compartir (el cuadrado con la flecha hacia arriba) en la barra de Safari y elige "Añadir a pantalla de inicio". ' +
        'La app quedará como un ícono más, a pantalla completa.',
        function () {}, { title: 'Añadir a pantalla de inicio', confirmLabel: 'Entendido', danger: false }
      );
    });
  }

      '</div>' +

      '<div class="card section">' +
      '<div class="section-head"><div><span class="section-eyebrow">Zona de riesgo</span><h2>Borrar todo</h2></div></div>' +
      '<button class="btn btn-danger" id="wipeBtn">Borrar todos mis datos</button>' +
      '</div>';

    wireInstallButton();

    $('#exportCsvBtn').addEventListener('click', function () { downloadFile('transacciones.csv', window.App.state.exportCSV(STATE)); });

      var reader = new FileReader();

        var res = window.App.state.importBackupJSON(String(reader.result), STATE, mode);

    var startRealBtn = $('#startRealBtn');
    if (startRealBtn) startRealBtn.addEventListener('click', function () {
      confirmAction('Esto reemplaza los datos de ejemplo por un estado vacío. ¿Continuar?', function () {
        persist(window.App.state.createEmptyState());

    if (viewDemoBtn) viewDemoBtn.addEventListener('click', function () {
      confirmAction('Esto reemplaza TEMPORALMENTE la vista con datos de ejemplo. Tus datos reales no se borran del almacenamiento hasta que guardes algo nuevo.', function () {
        STATE = window.App.state.createDemoState();
        document.body.dataset.demo = 'true';
        RENDERERS[currentScreen]();
        toast('Viendo datos de ejemplo (sin guardar)');
      }, { title: 'Ver datos de ejemplo', confirmLabel: 'Ver ejemplo', danger: false });
    });

    $('#wipeBtn').addEventListener('click', function () {
      confirmAction('Esto borra PERMANENTEMENTE todos tus datos guardados. Esta acción no se puede deshacer.', function () {
        persist(window.App.state.createEmptyState());
        toast('Todos los datos fueron borrados');
      }, { title: 'Borrar todos mis datos', confirmLabel: 'Borrar todo' });
    });
  }

  // La app corre en dos sitios: dentro de Claude (donde las descargas pasan
  // por el capability "downloads") y como app instalada/web propia (donde
  // se descarga con un Blob normal). Se intenta el capability y, si no
  // existe, se usa la ruta estándar del navegador.
  function downloadFile(filename, content) {
    if (downloadsApi) {
      downloadsApi.save({ filename: filename, data: content }).then(function () {
        toast('Descarga lista: ' + filename);
      }).catch(function (err) {
        if (err && err.code === 'declined') return;
        if (!downloadViaBlob(filename, content)) {
          toast('No se pudo descargar: ' + (err && err.message ? err.message : 'error desconocido'));
        }
      });
      return;
    }
    if (!downloadViaBlob(filename, content)) {
      toast('Tu navegador bloqueó la descarga. Prueba de nuevo o usa otro navegador.');
    }
  }

  function downloadViaBlob(filename, content) {
    try {
      var mime = /\.csv$/i.test(filename) ? 'text/csv;charset=utf-8' : 'application/json;charset=utf-8';
      var url = URL.createObjectURL(new Blob([content], { type: mime }));
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      // Se revoca con retraso: revocar de inmediato cancela la descarga en
      // algunos navegadores móviles.
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 4000);
      toast('Descarga lista: ' + filename);
      return true;
    } catch (e) {
      return false;
    }
  }

  // =========================================================================
  // Init
  // =========================================================================

  var RENDERERS = {
    panel: renderPanel,
    transacciones: renderTransacciones,
    semana: renderSemana,
    metas: renderMetas,
    config: renderConfig,
    datos: renderDatos
  };

  // =========================================================================
  // Arranque como app instalable
  // =========================================================================

  function bootPWA() {
    // `viewport-fit=cover` deja que la app pinte bajo la muesca y la barra
    // inferior del teléfono; los safe-area-inset del CSS hacen el resto.
    // Se ajusta el meta existente en vez de añadir otro duplicado.
    var vp = document.querySelector('meta[name="viewport"]');
    if (vp && vp.content.indexOf('viewport-fit') === -1) {
      vp.setAttribute('content', vp.content + ', viewport-fit=cover');
    }

    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferredInstall = e;
      if (currentScreen === 'datos') renderDatos();
    });
    window.addEventListener('appinstalled', function () {
      deferredInstall = null;
      toast('Cuentas Claras quedó instalada en este dispositivo');
    });

    // El service worker (modo sin conexión) solo aplica a la copia propia
    // servida por HTTPS. Dentro del iframe de un artifact el registro no
    // está permitido, así que se omite en silencio.
    if (!('serviceWorker' in navigator) || isInsideFrame()) return;
    var local = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    if (location.protocol !== 'https:' && !local) return;
    window.addEventListener('load', function () {
      try {
        navigator.serviceWorker.register('sw.js').catch(function () { /* sin modo offline */ });
      } catch (e) { /* sin modo offline */ }
    });
  }

  // Los accesos directos del manifiesto abren la app en una pantalla
  // concreta (./?pantalla=semana). Si el valor no existe, se ignora.
  function initialScreen() {
    try {
      var p = new URLSearchParams(window.location.search).get('pantalla');
      if (p && Object.prototype.hasOwnProperty.call(RENDERERS, p)) return p;
    } catch (e) { /* navegador sin URLSearchParams: se abre el panel */ }
    return 'panel';
  }

  function init() {
    M = window.App.money;
    D = window.App.date;

    // Cada pantalla se repinta entera; el etiquetado de tablas para móvil
    // se engancha una sola vez aquí en lugar de al final de cada render.
    Object.keys(RENDERERS).forEach(function (key) {
      var original = RENDERERS[key];
      RENDERERS[key] = function () {
        original();
        labelTableCells(document.getElementById('screen-' + key));
      };
    });

    var loaded = window.App.state.load();
    var hasRealLocal = !!(loaded && loaded.demoMode !== true);

    STATE = loaded || window.App.state.createDemoState();
    STATE = window.App.state.generateUpcomingOccurrences(STATE, D.today(), 30);

    // Solo se persiste lo REAL. El estado de ejemplo vive en memoria.
    if (hasRealLocal) {
      if (!STATE.lastModifiedISO) STATE.lastModifiedISO = new Date().toISOString();
      window.App.state.save(STATE);
    }
    document.body.dataset.demo = STATE.demoMode ? 'true' : 'false';

    wireNav();
    wireModal();
    wireTheme();
    bootPWA();

    var fab = $('#quickAddFab');
    if (fab) fab.addEventListener('click', openQuickAddModal);

    if (typeof window.claude !== 'undefined' && typeof window.claude.use === 'function') {
      window.claude.use('downloads').then(function (d) { downloadsApi = d; }).catch(function () { downloadsApi = null; });
    }

    switchScreen(initialScreen());

    // Sin datos reales locales, la nube es la unica fuente: se muestra
    // "buscando" en vez de dejar creer que el ejemplo es lo guardado.
    if (!hasRealLocal) showSyncingBanner();

    if (window.App.dbSync) {
      var syncUnavailable = false;
      window.App.dbSync.init({
        onRemoteState: function (remoteState) { applyRemoteState(remoteState); },
        getLocalState: function () { return STATE; },
        onFirstSnapshot: function (hadRemote) {
          // "sin-nube" tiene prioridad: saber que no hay sincronizacion
          // importa mas que saber que aun no hay datos.
          if (syncUnavailable) { clearSyncingBanner('sin-nube'); return; }
          cloudAvailable = true;
          if (currentScreen === 'datos') RENDERERS.datos();
          clearSyncingBanner((hadRemote || hasRealLocal) ? null : 'sin-datos');
        },
        onUnavailable: function () { syncUnavailable = true; cloudAvailable = false; clearSyncingBanner('sin-nube'); }
      });
    } else {
      clearSyncingBanner('sin-nube');
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

</script>

</body></html>
