        errors.push('toAccountId es requerido cuando type="transferencia".');
      } else if (!accountExists(appState, tx.toAccountId)) {
        errors.push('toAccountId no corresponde a ninguna cuenta existente.');
      } else if (isNonEmptyString(tx.accountId) && tx.toAccountId === tx.accountId) {
        errors.push('toAccountId debe ser distinto de accountId en una transferencia.');
      }
    }

    if (tx.type === 'reembolso') {
      if (!isNonEmptyString(tx.reversesTxId)) {
        errors.push('reversesTxId es requerido cuando type="reembolso".');
      } else {
        var original = findTransactionById(appState, tx.reversesTxId);
        if (!original) {
          errors.push('reversesTxId debe apuntar a una transacción existente.');
        } else if (original.type !== 'gasto') {
          errors.push('reversesTxId debe apuntar a una transacción de type="gasto".');
        }
      }
    }

    return { valid: errors.length === 0, errors: errors };
  };

  /**
   * applyTransaction(appState, tx) -> nuevo AppState con la transacción agregada.
   * No recalcula balances: solo agrega el registro (completando id/createdAt/
   * updatedAt/status si faltan). Lanza Error si la transacción no es válida
   * según validateTransaction, para no dejar el estado en un registro corrupto.
   */
  txApi.applyTransaction = function (appState, tx) {
    var validation = txApi.validateTransaction(appState, tx);
    if (!validation.valid) {
      throw new Error('No se puede aplicar la transacción: ' + validation.errors.join(' | '));
    }

    var newState = cloneState(appState);
    var ts = nowISOTimestamp();
    var newTx = shallowCopy(tx);

    if (!isNonEmptyString(newTx.id)) newTx.id = generateId('tx');
    if (!isNonEmptyString(newTx.createdAt)) newTx.createdAt = ts;
    newTx.updatedAt = ts;
    if (newTx.status === undefined) newTx.status = 'confirmado';

    newState.transactions = Array.isArray(newState.transactions) ? newState.transactions.concat([newTx]) : [newTx];
    return newState;
  };

  /**
   * recomputeAccountBalances(appState, uptoDateISO) -> { [accountId]: balanceCents }
   * Recorre TODAS las transacciones confirmado en orden cronológico hasta
   * uptoDateISO inclusive, aplicando las 8 reglas contables. creditLimitCents
   * nunca se lee (Regla 5).
   */
  txApi.recomputeAccountBalances = function (appState, uptoDateISO) {
    var upto = isNonEmptyString(uptoDateISO) ? uptoDateISO : '9999-12-31';
    var balances = {};
    var accounts = (appState && appState.accounts) || [];
    accounts.forEach(function (acc) {
      balances[acc.id] = typeof acc.initialBalanceCents === 'number' ? acc.initialBalanceCents : 0;
    });

    var allTx = (appState && appState.transactions) || [];
    var ordered = sortedConfirmedUpTo(allTx, upto);

    ordered.forEach(function (tx) {
      switch (tx.type) {
        case 'ingreso':
          if (Object.prototype.hasOwnProperty.call(balances, tx.accountId)) {
            balances[tx.accountId] += tx.amountCents;
          }
          break;

        case 'gasto':
          // Regla 4/5: si la cuenta es tarjeta_credito, restar aquí ya
          // representa "aumentar la deuda" (el balance se vuelve más
          // negativo). creditLimitCents nunca interviene.
          if (Object.prototype.hasOwnProperty.call(balances, tx.accountId)) {
            balances[tx.accountId] -= tx.amountCents;
          }
          break;

        case 'transferencia':
          // Regla 1/2/4: mueve balance entre cuentas propias; nunca es
          // ingreso/gasto. Pagar una tarjeta de crédito es exactamente este
          // caso (accountId=cuenta líquida, toAccountId=tarjeta), por lo que
          // reduce efectivo y reduce deuda sin duplicar el gasto original.
          if (Object.prototype.hasOwnProperty.call(balances, tx.accountId)) {
            balances[tx.accountId] -= tx.amountCents;
          }
          if (Object.prototype.hasOwnProperty.call(balances, tx.toAccountId)) {
            balances[tx.toAccountId] += tx.amountCents;
          }
          break;

        case 'reembolso': {
          // Regla 6: revierte el efecto del gasto original en la MISMA
          // cuenta de ese gasto, cuando sea posible encontrarlo.
          var original = null;
          for (var i = 0; i < allTx.length; i++) {
            if (allTx[i].id === tx.reversesTxId) {
              original = allTx[i];
              break;
            }
          }
          var targetAccountId = original ? original.accountId : tx.accountId;
          if (Object.prototype.hasOwnProperty.call(balances, targetAccountId)) {
            balances[targetAccountId] += tx.amountCents;
          }
          break;
        }

        default:
          break;
      }
      // Regla 3: linkedGoalId nunca se lee aquí — asignar a una meta no mueve
      // ningún balance por sí solo, solo el `type` de arriba mueve dinero.
    });

    return balances;
  };

  /**
   * periodTotals(appState, startISO, endISO) -> { incomeCents, expenseCents }
   * Solo ingresos y gastos reales y confirmados dentro del rango [startISO, endISO]:
   * - Excluye 'transferencia' (Regla 1).
   * - Excluye asignaciones a metas que no mueven dinero real (Regla 3: linkedGoalId
   *   nunca se lee para sumar/restar).
   * - Excluye initialBalanceCents de las cuentas (Regla 7: nunca se lee `accounts`).
   * - Un 'reembolso' resta de expenseCents (neto de gasto real del periodo),
   *   ya que revierte parcial o totalmente un gasto contado previamente.
   */
  txApi.periodTotals = function (appState, startISO, endISO) {
    var incomeCents = 0;
    var expenseCents = 0;
    var transactions = (appState && appState.transactions) || [];

    transactions.forEach(function (tx) {
      if (tx.status !== 'confirmado') return; // solo movimientos reales ya confirmados
      if (!isNonEmptyString(tx.dateISO) || tx.dateISO < startISO || tx.dateISO > endISO) return;

      if (tx.type === 'ingreso') {
        incomeCents += tx.amountCents;
      } else if (tx.type === 'gasto') {
        expenseCents += tx.amountCents;
      } else if (tx.type === 'reembolso') {
        expenseCents -= tx.amountCents;
      }
      // 'transferencia' queda excluida a propósito (Regla 1).
    });

    return { incomeCents: incomeCents, expenseCents: expenseCents };
  };

  /**
   * editTransaction(appState, txId, patch) -> nuevo AppState con la transacción
   * actualizada (createdAt e id se preservan; updatedAt se refresca). No toca
   * balances: recomputeAccountBalances siempre recalcula todo desde cero
   * (Regla 8), así que basta con reemplazar el registro para que cualquier
   * llamada posterior a recomputeAccountBalances quede correcta en cadena.
   */
  txApi.editTransaction = function (appState, txId, patch) {
    var transactions = (appState && appState.transactions) || [];
    var idx = -1;
    for (var i = 0; i < transactions.length; i++) {
      if (transactions[i].id === txId) {
        idx = i;
        break;
      }
    }
    if (idx === -1) {
      throw new Error('No existe una transacción con id="' + txId + '".');
    }

    var original = transactions[idx];
    var merged = shallowCopy(original);
    var patchObj = patch || {};
    for (var key in patchObj) {
      if (Object.prototype.hasOwnProperty.call(patchObj, key)) merged[key] = patchObj[key];
    }
    // id y createdAt nunca cambian vía patch; updatedAt siempre se refresca.
    merged.id = original.id;
    merged.createdAt = original.createdAt;
    merged.updatedAt = nowISOTimestamp();

    var validation = txApi.validateTransaction(appState, merged);
    if (!validation.valid) {
      throw new Error('No se puede editar la transacción: ' + validation.errors.join(' | '));
    }

    var newState = cloneState(appState);
    newState.transactions = newState.transactions.map(function (t, i) {
      return i === idx ? merged : t;
    });
    return newState;
  };

  // ---------------------------------------------------------------------
  // Mini test runner casero
  // ---------------------------------------------------------------------

  txApi.__runTests = function () {
    var results = [];

    function assert(name, cond, details) {
      results.push({ name: name, passed: !!cond, details: details || '' });
    }

    function baseState() {
      return {
        schemaVersion: 1,
        demoMode: false,
        settings: { currency: 'USD', locale: 'es-US', weekStartsOn: 0, cushionCents: 0 },
        accounts: [
          { id: 'acc_banco', name: 'Banco', kind: 'banco', initialBalanceCents: 100000, creditLimitCents: 0, archived: false },
          { id: 'acc_ahorro', name: 'Ahorro', kind: 'banco', initialBalanceCents: 50000, creditLimitCents: 0, archived: false },
          { id: 'acc_tc', name: 'Tarjeta', kind: 'tarjeta_credito', initialBalanceCents: 0, creditLimitCents: 500000, archived: false }
        ],
        categories: [],
        incomeSources: [],
        recurringExpenses: [],
        debts: [],
        goals: [
          { id: 'goal_1', name: 'Vacaciones', kind: 'ahorro', targetCents: 200000, savedCents: 0, targetDateISO: '2026-12-31', contributionFrequency: 'mensual' }
        ],
        transactions: [],
        weeklyPlans: []
      };
    }

    // Escenario 1: transferencia entre cuentas propias.
    (function () {
      var state = baseState();
      state = txApi.applyTransaction(state, {
        type: 'transferencia',
        amountCents: 20000,
        dateISO: '2026-09-01',
        accountId: 'acc_banco',
        toAccountId: 'acc_ahorro',
        status: 'confirmado',
        note: 'Ahorro mensual'
      });
      var totals = txApi.periodTotals(state, '2026-09-01', '2026-09-30');
      var balances = txApi.recomputeAccountBalances(state, '2026-09-30');
      assert(
        'Transferencia entre cuentas propias no cuenta como ingreso/gasto del periodo',
        totals.incomeCents === 0 && totals.expenseCents === 0,
        'incomeCents=' + totals.incomeCents + ' expenseCents=' + totals.expenseCents
      );
      assert(
        'Transferencia mueve el balance de banco a ahorro correctamente',
        balances.acc_banco === 80000 && balances.acc_ahorro === 70000,
        'acc_banco=' + balances.acc_banco + ' acc_ahorro=' + balances.acc_ahorro
      );
    })();

    // Escenario 2: compra con tarjeta de crédito seguida de pago de esa tarjeta.
    (function () {
      var state = baseState();
      state = txApi.applyTransaction(state, {
        id: 'tx_compra_tc',
        type: 'gasto',
        amountCents: 15000,
        dateISO: '2026-09-02',
        accountId: 'acc_tc',
        categoryId: null,
        merchant: 'Tienda',
        status: 'confirmado'
      });
      var afterCompra = txApi.recomputeAccountBalances(state, '2026-09-02');
      var totalsAfterCompra = txApi.periodTotals(state, '2026-09-01', '2026-09-30');

      state = txApi.applyTransaction(state, {
        type: 'transferencia',
        amountCents: 15000,
        dateISO: '2026-09-10',
        accountId: 'acc_banco',
        toAccountId: 'acc_tc',
        status: 'confirmado',
        note: 'Pago tarjeta'
      });
      var afterPago = txApi.recomputeAccountBalances(state, '2026-09-10');
      var totalsAfterPago = txApi.periodTotals(state, '2026-09-01', '2026-09-30');

      assert(
        'Compra con tarjeta de crédito aumenta la deuda (balance TC negativo)',
        afterCompra.acc_tc === -15000,
        'acc_tc=' + afterCompra.acc_tc
      );
      assert(
        'El gasto con tarjeta se cuenta una sola vez en expenseCents, antes y después del pago',
        totalsAfterCompra.expenseCents === 15000 && totalsAfterPago.expenseCents === 15000,
        'expenseCents_antes=' + totalsAfterCompra.expenseCents + ' expenseCents_despues=' + totalsAfterPago.expenseCents
      );
      assert(
        'Pagar la tarjeta reduce efectivo del banco y salda la deuda sin duplicar el gasto',
        afterPago.acc_banco === 85000 && afterPago.acc_tc === 0,
        'acc_banco=' + afterPago.acc_banco + ' acc_tc=' + afterPago.acc_tc
      );
    })();

    // Escenario 3: reembolso que revierte un gasto.
    (function () {
      var state = baseState();
      state = txApi.applyTransaction(state, {
        id: 'tx_gasto_original',
        type: 'gasto',
        amountCents: 8000,
        dateISO: '2026-09-03',
        accountId: 'acc_banco',
        status: 'confirmado'
      });
      var trasGasto = txApi.recomputeAccountBalances(state, '2026-09-03');

      state = txApi.applyTransaction(state, {
        type: 'reembolso',
        amountCents: 8000,
        dateISO: '2026-09-05',
        accountId: 'acc_banco',
        reversesTxId: 'tx_gasto_original',
        status: 'confirmado'
      });
      var trasReembolso = txApi.recomputeAccountBalances(state, '2026-09-05');

      assert(
        'El reembolso regresa el balance de la cuenta al estado previo al gasto original',
        trasGasto.acc_banco === 92000 && trasReembolso.acc_banco === 100000,
        'tras_gasto=' + trasGasto.acc_banco + ' tras_reembolso=' + trasReembolso.acc_banco
      );
    })();

    // Escenario 4: editar una transacción de una semana anterior recalcula
    // TODOS los balances posteriores, no solo el balance final.
    (function () {
      var state = baseState();
      state = txApi.applyTransaction(state, { id: 'tx_a', type: 'ingreso', amountCents: 10000, dateISO: '2026-08-25', accountId: 'acc_banco', status: 'confirmado' });
      state = txApi.applyTransaction(state, { id: 'tx_b', type: 'gasto', amountCents: 3000, dateISO: '2026-08-27', accountId: 'acc_banco', status: 'confirmado' });
      state = txApi.applyTransaction(state, { id: 'tx_c', type: 'gasto', amountCents: 2000, dateISO: '2026-09-05', accountId: 'acc_banco', status: 'confirmado' });

      var antesEditar_b = txApi.recomputeAccountBalances(state, '2026-08-27');
      var antesEditar_c = txApi.recomputeAccountBalances(state, '2026-09-05');

      state = txApi.editTransaction(state, 'tx_a', { amountCents: 25000 });

      var despuesEditar_b = txApi.recomputeAccountBalances(state, '2026-08-27');
      var despuesEditar_c = txApi.recomputeAccountBalances(state, '2026-09-05');

      assert(
        'Balance intermedio (hasta tx_b) antes de editar es correcto',
        antesEditar_b.acc_banco === 107000,
        'valor=' + antesEditar_b.acc_banco
      );
      assert(
        'Balance posterior (hasta tx_c) antes de editar es correcto',
        antesEditar_c.acc_banco === 105000,
        'valor=' + antesEditar_c.acc_banco
      );
      assert(
        'Al editar tx_a (semana anterior), el balance intermedio hasta tx_b se recalcula bien',
        despuesEditar_b.acc_banco === 122000,
        'valor=' + despuesEditar_b.acc_banco
      );
      assert(
        'Al editar tx_a, el balance posterior hasta tx_c también se recalcula bien (no solo el final)',
        despuesEditar_c.acc_banco === 120000,
        'valor=' + despuesEditar_c.acc_banco
      );
    })();

    // Escenario 5: un balance inicial de cuenta no aparece como ingreso en periodTotals.
    (function () {
      var state = baseState(); // acc_banco initialBalanceCents=100000, sin transacciones
      var totals = txApi.periodTotals(state, '2026-01-01', '2026-12-31');
      assert(
        'El balance inicial de una cuenta no se cuenta como ingreso en periodTotals',
        totals.incomeCents === 0 && totals.expenseCents === 0,
        'incomeCents=' + totals.incomeCents + ' expenseCents=' + totals.expenseCents
      );
    })();

    // Bonus: asignar a una meta (linkedGoalId) sin transferencia real no mueve balances.
    (function () {
      var state = baseState();
      var goalsAntes = JSON.stringify(state.goals);
      var balancesAntes = txApi.recomputeAccountBalances(state, '2026-09-30');
      // No se aplica ninguna transacción de ingreso/gasto/transferencia: la
      // "asignación" a la meta sería solo un metadato lógico (por ejemplo,
      // goals.savedCents gestionado por otro módulo), nunca mueve cuentas.
      var balancesDespues = txApi.recomputeAccountBalances(state, '2026-09-30');
      assert(
        'Asignar dinero a una meta sin transferencia real no altera ningún balance de cuenta',
        balancesAntes.acc_banco === balancesDespues.acc_banco && goalsAntes === JSON.stringify(state.goals),
        'ok'
      );
    })();

    // Bonus: validateTransaction detecta campos faltantes/referencias inválidas.
    (function () {
      var state = baseState();
      var v1 = txApi.validateTransaction(state, { type: 'transferencia', amountCents: 100, dateISO: '2026-09-01', accountId: 'acc_banco' });
      var v2 = txApi.validateTransaction(state, { type: 'reembolso', amountCents: 100, dateISO: '2026-09-01', accountId: 'acc_banco', reversesTxId: 'no_existe' });
      var v3 = txApi.validateTransaction(state, { type: 'gasto', amountCents: -5, dateISO: '2026-09-01', accountId: 'acc_banco' });
      assert('validateTransaction exige toAccountId en una transferencia', v1.valid === false && v1.errors.length > 0, JSON.stringify(v1));
      assert('validateTransaction exige que reversesTxId apunte a un gasto existente', v2.valid === false, JSON.stringify(v2));
      assert('validateTransaction exige amountCents entero positivo', v3.valid === false, JSON.stringify(v3));
    })();

    var passed = results.filter(function (r) {
      return r.passed;
    }).length;
    var failed = results.filter(function (r) {
      return !r.passed;
    });

    var summary = { total: results.length, passed: passed, failed: failed.length, results: results };

    if (typeof console !== 'undefined' && console.log) {
      console.log('[App.calc.tx.__runTests] ' + passed + '/' + results.length + ' pruebas pasaron.');
      failed.forEach(function (f) {
        console.log('  FALLÓ: ' + f.name + ' — ' + f.details);
      });
    }

    return summary;
  };

  window.App = window.App || {};
  window.App.calc = window.App.calc || {};
  window.App.calc.tx = txApi;
})();

</script>
<script>
/* ===== modules/ahorro.js ===== */
/**
 * ahorro.js
 *
 * PLAN DE AHORRO SEMANAL y METAS.
 * Modulo JS plano (sin build step, sin import/export ES6). Se carga via
 * <script> tag. No toca el DOM ni localStorage. Todas las funciones son
 * puras: nunca mutan el AppState recibido ni ningun objeto `goal` recibido.
 *
 * Depende de window.App.money y window.App.date (contrato exacto descrito
 * en el enunciado del proyecto), que otro modulo hermano ya define. Este
 * archivo NUNCA reimplementa esa aritmetica: toda suma/resta/multiplicacion
 * de centavos pasa por App.money, y todo conteo de ocurrencias/fechas pasa
 * por App.date.occurrencesBetween / App.date.nextOccurrence (nunca una
 * division ingenua de dias).
 *
 * ---------------------------------------------------------------------
 * DECISIONES DE DISENIO QUE NO ESTAN 100% fijadas por el esquema de datos
 * (documentadas aqui para que el resto del equipo las conozca):
 *
 * 1) `goals` en el esquema compartido NO trae una fecha de inicio de plan
 *    (`startDateISO`/`createdAt`). Para calcular "el ahorro esperado a
 *    hoy" (prorrateo lineal desde el inicio del plan) hace falta ese
 *    punto de partida. Si el objeto `goal` trae opcionalmente
 *    `startDateISO` (o `createdAt`), se usa. Si NO trae ninguno, se asume
 *    conservadoramente que el plan arranca HOY (`todayISO`): así nunca se
 *    inventa que el usuario "debería llevar" cierto ahorro sin una fecha
 *    de inicio real que lo respalde. Con ese fallback, el estado inicial
 *    de una meta recien creada es siempre 'al_dia' (avance esperado ==
 *    avance real == lo que ya tiene ahorrado), lo cual es razonable.
 *
 * 2) Tanto `goal.targetDateISO` (para metas) como `recurringExpenses[].
 *    nextDueDateISO` / `incomeSources[].nextDateISO` (para el planner) se
 *    usan como el ANCLA de fase de App.date.occurrencesBetween/
 *    nextOccurrence (el dia de la semana/mes en que cae la recurrencia),
 *    no como un limite rigido que deba coincidir con la fecha real mas
 *    proxima. Esto es exactamente el mismo patron usado en date.js para
 *    anclar frecuencias mensuales en un fin de mes, aplicado aqui a metas
 *    y obligaciones.
 *
 * 3) Las deudas (`debts`) solo traen `dueDay` (numero de dia del mes) +
 *    `frequency`, sin una fecha ancla completa. Se reconstruye una fecha
 *    ancla valida tomando el mes de referencia y clampeando `dueDay` al
 *    ultimo dia de ese mes (ver `debtAnchorISO`), y de ahi en adelante se
 *    usa la misma maquinaria de App.date que para cualquier otra
 *    recurrencia.
 *
 * 4) `proposeIncomeDistribution` necesita saber "cada cuanto entra dinero"
 *    para prorratear reservas de facturas futuras y aportaciones a metas
 *    que tienen su propia frecuencia distinta a la del ingreso. Se infiere
 *    de `incomeSources` (el ciclo de ingreso mas frecuente conocido); si
 *    no hay ninguna fuente de ingreso con frecuencia valida, se usa 14
 *    dias (quincenal) como referencia estructural de calculo — esto NO es
 *    un porcentaje de asignacion inventado, es solo la unidad de tiempo
 *    usada para prorratear montos que si vienen 100% de los datos reales.
 * ---------------------------------------------------------------------
 */

window.App = window.App || {};

(function () {
  'use strict';

  // ---------------------------------------------------------------------
  // Helpers internos compartidos (no se exportan)
  // ---------------------------------------------------------------------

  var VALID_FREQUENCIES = ['semanal', 'quincenal', 'mensual', 'trimestral', 'anual'];

  // Duracion aproximada en dias de cada frecuencia. Solo se usa como
  // unidad de prorrateo (nunca reemplaza a App.date.occurrencesBetween
  // para contar ocurrencias reales calendario-a-calendario).
  var FREQ_DAYS = { semanal: 7, quincenal: 14, mensual: 30, trimestral: 91, anual: 365 };

  function isValidFrequency(f) {
    return VALID_FREQUENCIES.indexOf(f) !== -1;
  }

  function isNonEmptyString(v) {
    return typeof v === 'string' && v.trim().length > 0;
  }

  function numOr0(v) {
    return typeof v === 'number' && isFinite(v) ? v : 0;
  }

  function arr(v) {
    return Array.isArray(v) ? v : [];
  }

  function money() {
    return window.App.money;
  }

  function date() {
    return window.App.date;
  }

  // Mini test runner casero (mismo formato que App.calc.tx.__runTests, para
  // consistencia entre modulos hermanos).
  function makeRunner() {
    var results = [];
    function assert(name, cond, details) {
      results.push({ name: name, passed: !!cond, details: details || '' });
    }
    function summarize(logLabel) {
      var passed = results.filter(function (r) { return r.passed; }).length;
      var failed = results.filter(function (r) { return !r.passed; });
      var summary = { total: results.length, passed: passed, failed: failed.length, results: results };
      if (typeof console !== 'undefined' && console.log) {
        console.log('[' + logLabel + '] ' + passed + '/' + results.length + ' pruebas pasaron.');
        failed.forEach(function (f) {
          console.log('  FALLO: ' + f.name + ' - ' + f.details);
        });
      }
      return summary;
    }
    return { assert: assert, summarize: summarize };
  }

  // Reconstruye una fecha ancla ISO valida para una deuda a partir de
  // `dueDay` (numero de dia del mes) usando el mes de `referenceISO`,
  // clampeando al ultimo dia de ese mes cuando dueDay lo excede (ej.
  // dueDay=31 en febrero). App.date.nextOccurrence/occurrencesBetween se
  // encargan de propagar esa fase hacia adelante/atras segun `frequency`.
  function debtAnchorISO(debt, referenceISO) {
    var D = date();
    var ref = D.parseISO(referenceISO);
    var y = ref.getUTCFullYear();
    var m = ref.getUTCMonth(); // 0-indexado
    var lastDay = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
    var dueDay = debt && typeof debt.dueDay === 'number' && debt.dueDay > 0 ? Math.floor(debt.dueDay) : 1;
    var day = Math.min(dueDay, lastDay);
    return D.toISO(new Date(Date.UTC(y, m, day, 12, 0, 0)));
  }

  function debtFrequency(debt) {
    return isValidFrequency(debt && debt.frequency) ? debt.frequency : 'mensual';
  }

  // Determina el punto de partida del plan de ahorro de una meta (ver nota
  // de disenio #1 en la cabecera del archivo).
  function resolvePlanStartISO(goal, todayISO) {
    if (isNonEmptyString(goal.startDateISO)) return goal.startDateISO;
    if (isNonEmptyString(goal.createdAt)) return goal.createdAt.slice(0, 10);
    return todayISO;
  }

  function deriveStatusFromExpected(savedCents, expectedCents) {
    if (savedCents > expectedCents) return 'adelantada';
    if (savedCents === expectedCents) return 'al_dia';
    return 'atrasada';
  }

  function completedProgressResult(targetCents) {
    return {
      remainingCents: 0,
      contributionPerPeriodCents: 0,
      occurrencesRemaining: 0,
      status: 'completada',
      warning: null,
      expectedSavedByNowCents: targetCents
    };
  }

  // ---------------------------------------------------------------------
  // window.App.calc.savings
  // ---------------------------------------------------------------------

  /**
   * computeGoalProgress(goal, todayISO) ->
   *   { remainingCents, contributionPerPeriodCents, occurrencesRemaining,
   *     status, warning, expectedSavedByNowCents }
   *
   * Reglas (ver enunciado del producto):
   *  - remainingCents = max(0, targetCents - savedCents)
   *  - contributionPerPeriodCents = remainingCents / oportunidades reales
   *    de aportacion restantes (App.date.occurrencesBetween, NUNCA una
   *    division ingenua de dias/periodo)
   *  - Si la fecha objetivo ya paso, o no quedan oportunidades de
   *    aportacion antes de ella, se devuelve una advertencia clara en vez
   *    de un numero indefinido (nunca Infinity/NaN silencioso)
   *  - status compara el ahorro esperado a hoy (prorrateo lineal desde el
   *    inicio del plan hasta la fecha objetivo) contra el ahorro real
   */
  function computeGoalProgress(goal, todayISO) {
    var M = money();
    var D = date();
    goal = goal || {};

    var targetCents = numOr0(goal.targetCents);
    var savedCents = numOr0(goal.savedCents);
    var remainingCents = Math.max(0, M.sub(targetCents, savedCents));

    if (savedCents >= targetCents) {
      return completedProgressResult(targetCents);
    }

    var planStartISO = resolvePlanStartISO(goal, todayISO);

    function expectedByNow(targetDateISO) {
      if (!isNonEmptyString(targetDateISO)) return savedCents;
      var totalPlanDays = D.diffDays(planStartISO, targetDateISO);
      if (totalPlanDays <= 0) return targetCents;
      var elapsedDays = D.diffDays(planStartISO, todayISO);
      var clampedElapsed = Math.max(0, Math.min(elapsedDays, totalPlanDays));
      return M.mul(targetCents, clampedElapsed / totalPlanDays);
    }

    var hasTargetDate = isNonEmptyString(goal.targetDateISO);

    if (!hasTargetDate) {
      return {
        remainingCents: remainingCents,
        contributionPerPeriodCents: 0,
        occurrencesRemaining: 0,
        status: 'al_dia',
        warning:
          'La meta no tiene fecha objetivo (targetDateISO) definida; no se puede calcular ' +
          'una aportación periódica ni el estado de avance respecto al tiempo.',
        expectedSavedByNowCents: savedCents
      };
    }

    var expectedSavedByNowCents = expectedByNow(goal.targetDateISO);
    var daysUntilTarget = D.diffDays(todayISO, goal.targetDateISO); // targetDateISO - todayISO
    var isPastDue = daysUntilTarget < 0;

    if (isPastDue) {
      return {
        remainingCents: remainingCents,
        contributionPerPeriodCents: 0,
        occurrencesRemaining: 0,
        status: 'vencida',
        warning:
          'La fecha objetivo (' + goal.targetDateISO + ') ya paso y aun faltan ' +
          M.format(remainingCents) + ' para completar la meta.',
        expectedSavedByNowCents: expectedSavedByNowCents
      };
    }

    if (!isValidFrequency(goal.contributionFrequency)) {
      return {
        remainingCents: remainingCents,
        contributionPerPeriodCents: 0,
        occurrencesRemaining: 0,
        status: deriveStatusFromExpected(savedCents, expectedSavedByNowCents),
        warning:
          'La meta tiene una frecuencia de aportación no reconocida ("' +
          goal.contributionFrequency + '"); no se puede calcular una aportación periódica sugerida.',
        expectedSavedByNowCents: expectedSavedByNowCents
      };
    }

    // Oportunidades reales de aportacion entre hoy y la fecha objetivo,
    // usando targetDateISO como ancla de fase de la frecuencia elegida.
    var occurrencesRemaining = D.occurrencesBetween(todayISO, goal.targetDateISO, goal.contributionFrequency, goal.targetDateISO);

    if (occurrencesRemaining <= 0) {
      return {
        remainingCents: remainingCents,
        contributionPerPeriodCents: 0,
        occurrencesRemaining: 0,
        status: 'atrasada',
        warning:
          'No quedan oportunidades de aportación (frecuencia "' + goal.contributionFrequency +
          '") antes de la fecha objetivo (' + goal.targetDateISO +
          '). Considera extender la fecha, cambiar la frecuencia de aportación, o aportar de inmediato.',
        expectedSavedByNowCents: expectedSavedByNowCents
      };
    }

    var contributionPerPeriodCents = M.div(remainingCents, occurrencesRemaining);

    return {
      remainingCents: remainingCents,
      contributionPerPeriodCents: contributionPerPeriodCents,
      occurrencesRemaining: occurrencesRemaining,
      status: deriveStatusFromExpected(savedCents, expectedSavedByNowCents),
      warning: null,
      expectedSavedByNowCents: expectedSavedByNowCents
    };
  }

  // Avanza `n` ocurrencias de `frequency` (ancladas en `anchorISO`) a
  // partir de `fromISO` (estrictamente despues de fromISO). Usada solo
  // para PROYECTAR una fecha objetivo alternativa en suggestAlternatives;
  // nunca se usa para el calculo oficial de aportacion por periodo.
  function advanceOccurrences(fromISO, frequency, anchorISO, n) {
    var D = date();
    var freq = isValidFrequency(frequency) ? frequency : 'mensual';
    var anchor = isNonEmptyString(anchorISO) ? anchorISO : fromISO;
    var cursor = fromISO;
    var result = fromISO;
    var steps = Math.max(1, Math.min(Math.floor(n) || 1, 20000));
    for (var i = 0; i < steps; i++) {
      result = D.nextOccurrence(D.addDays(cursor, 1), freq, anchor);
      cursor = result;
    }
    return result;
  }

  /**
   * suggestAlternatives(goal, todayISO, maxAffordableContributionCents) ->
   *   [{ type, description, newTargetDateISO, newTargetCents, requiredCutCents }]
   *
   * Nunca modifica la meta del usuario: solo genera alternativas como
   * DATOS, cada una con su calculo mostrado en `description`. Genera al
   * menos 2 alternativas cuando lo que el usuario puede aportar no
   * alcanza para cumplir la meta como esta planteada (o cuando la meta no
   * tiene un plan de aportacion valido: vencida, sin fecha, sin
   * oportunidades, frecuencia invalida).
   */
  function suggestAlternatives(goal, todayISO, maxAffordableContributionCents) {
    var M = money();
    goal = goal || {};

    var affordable =
      typeof maxAffordableContributionCents === 'number' && isFinite(maxAffordableContributionCents) && maxAffordableContributionCents > 0
        ? Math.floor(maxAffordableContributionCents)
        : 0;

    var progress = computeGoalProgress(goal, todayISO);
    var alternatives = [];

    if (progress.status === 'completada' || progress.remainingCents <= 0) {
      return alternatives; // nada que sugerir, la meta ya se cumplio
    }

    var required = progress.contributionPerPeriodCents; // 0 si no hay agenda valida (vencida/sin fecha/sin oportunidades)
    var needsAlternatives = required <= 0 || affordable < required;
    if (!needsAlternatives) {
      return alternatives; // con lo que puede aportar, la meta tal cual esta planteada se cumple
    }

    var frequency = goal.contributionFrequency;
    var hasTargetDate = isNonEmptyString(goal.targetDateISO);

    // Alternativa 1: extender la fecha objetivo para que, aportando lo que
    // el usuario SI puede pagar por periodo, alcance a cubrir remainingCents.
    if (affordable > 0) {
      var periodsNeeded = Math.max(1, Math.ceil(M.fromCents(progress.remainingCents) / M.fromCents(affordable)));
      var newTargetDateISO = advanceOccurrences(todayISO, frequency, hasTargetDate ? goal.targetDateISO : todayISO, periodsNeeded);
      alternatives.push({
        type: 'extender_fecha',
        description:
          'Aportando ' + M.format(affordable) + ' por periodo (' + (frequency || 'sin frecuencia definida') +
          '), la meta se alcanzaría extendiendo la fecha objetivo a ' + newTargetDateISO + ' (' + periodsNeeded +
          ' aportaciones de ' + M.format(affordable) + ' para cubrir ' + M.format(progress.remainingCents) + ' pendientes).',
        newTargetDateISO: newTargetDateISO,
        newTargetCents: goal.targetCents,
        requiredCutCents: 0
      });
    } else {
      alternatives.push({
        type: 'extender_fecha',
        description: 'No hay un monto de aportación disponible (maxAffordableContributionCents=0); no se puede estimar una nueva fecha objetivo sin definir al menos una aportación mayor a cero.',
        newTargetDateISO: null,
        newTargetCents: goal.targetCents,
        requiredCutCents: 0
      });
    }

    // Alternativa 2: reducir el monto objetivo para que, con lo que el
    // usuario puede aportar por periodo, la meta se cumpla en la fecha
    // original (mismas oportunidades de aportacion ya calculadas).
    var achievableCents = M.mul(affordable, Math.max(0, progress.occurrencesRemaining));
    var newTargetCents = M.add(numOr0(goal.savedCents), achievableCents);
    alternatives.push({
      type: 'reducir_meta',
      description: hasTargetDate
        ? 'Reduciendo el objetivo a ' + M.format(newTargetCents) + ', la meta se cumpliría en la fecha original (' +
          goal.targetDateISO + ') aportando ' + M.format(affordable) + ' por periodo durante ' +
          progress.occurrencesRemaining + ' oportunidad(es) restante(s).'
        : 'Sin fecha objetivo definida, lo máximo que se puede garantizar de inmediato con este ritmo de aportación es ' +
          M.format(newTargetCents) + '.',
      newTargetDateISO: hasTargetDate ? goal.targetDateISO : null,
      newTargetCents: newTargetCents,
      requiredCutCents: 0
    });

    // Alternativa 3: recortar gasto opcional para poder aportar lo
    // requerido y cumplir la meta tal cual esta planteada (monto y fecha
    // originales). Solo aplica cuando SI existe una aportacion requerida
    // valida que cubrir.
    if (required > 0) {
      var shortfall = Math.max(0, M.sub(required, affordable));
      if (shortfall > 0) {
        alternatives.push({
          type: 'ajustar_gasto',
          description:
            'Recortando ' + M.format(shortfall) + ' de gasto opcional por periodo (' + frequency +
            '), se podría cubrir la aportación de ' + M.format(required) +
            ' necesaria para cumplir la meta en el monto y la fecha originales.',
          newTargetDateISO: goal.targetDateISO,
          newTargetCents: goal.targetCents,
          requiredCutCents: shortfall
        });
      }
    }

    return alternatives;
  }

  function savingsRunTests() {
    var runner = makeRunner();
    var assert = runner.assert;
    var M = money();
    var D = date();

    // 1) Meta con fecha objetivo YA VENCIDA -> status 'vencida' con warning claro.
    (function () {
      var goal = {
        id: 'g_vencida', name: 'Vieja', kind: 'otro',
        targetCents: 100000, savedCents: 20000,
        targetDateISO: '2020-01-01', contributionFrequency: 'mensual'
      };
      var p = computeGoalProgress(goal, '2026-09-13');
      assert(
        'Meta vencida -> status="vencida" con warning y remainingCents correcto',
        p.status === 'vencida' && typeof p.warning === 'string' && p.warning.length > 0 &&
          p.remainingCents === 80000 && p.contributionPerPeriodCents === 0 && p.occurrencesRemaining === 0,
        JSON.stringify(p)
      );
    })();

    // 2) Meta ya completada (savedCents >= targetCents) -> status 'completada', remainingCents=0.
    (function () {
      var goal = {
        id: 'g_completa', name: 'Lista', kind: 'otro',
        targetCents: 50000, savedCents: 60000,
        targetDateISO: '2030-01-01', contributionFrequency: 'mensual'
      };
      var p = computeGoalProgress(goal, '2026-09-13');
      assert(
        'Meta completada -> status="completada", remainingCents=0, sin warning',
        p.status === 'completada' && p.remainingCents === 0 && p.warning === null && p.contributionPerPeriodCents === 0,
        JSON.stringify(p)
      );
    })();

    // 3) Un mes con 5 oportunidades de aportacion semanal vs 4 -> la
    //    aportacion por periodo es MENOR con 5 oportunidades que con 4,
    //    para la misma cantidad pendiente. computeGoalProgress ancla
    //    occurrencesBetween en el propio targetDateISO (un lunes), asi que
    //    se eligen dos fechas objetivo (ambas lunes) a 35 y 28 dias de la
    //    misma fecha de hoy (2023-05-01, tambien lunes): a 35 dias caben 5
    //    lunes en la ventana [hoy, objetivo), a 28 dias caben 4.
    (function () {
      var baseGoal = {
        id: 'g_cadencia', name: 'Cadencia', kind: 'otro',
        targetCents: 100000, savedCents: 0,
        contributionFrequency: 'semanal'
      };
      var today = '2023-05-01'; // lunes
      var goal5 = Object.assign({}, baseGoal, { targetDateISO: '2023-06-05' }); // lunes, hoy+35 dias
      var goal4 = Object.assign({}, baseGoal, { targetDateISO: '2023-05-29' }); // lunes, hoy+28 dias

      var p5 = computeGoalProgress(goal5, today);
      var p4 = computeGoalProgress(goal4, today);

      // Verificacion independiente de las ocurrencias reales con
      // App.date directamente (mismo ancla que usa computeGoalProgress:
      // el propio targetDateISO), para no depender de una cifra
      // hardcodeada fragil.
      var occ5 = D.occurrencesBetween(today, '2023-06-05', 'semanal', '2023-06-05');
      var occ4 = D.occurrencesBetween(today, '2023-05-29', 'semanal', '2023-05-29');

      assert(
        'Escenario de 5 oportunidades semanales realmente cuenta 5',
        p5.occurrencesRemaining === occ5 && occ5 === 5,
        'p5.occurrencesRemaining=' + p5.occurrencesRemaining + ' occ5=' + occ5
      );
      assert(
        'Escenario de 4 oportunidades semanales realmente cuenta 4',
        p4.occurrencesRemaining === occ4 && occ4 === 4,
        'p4.occurrencesRemaining=' + p4.occurrencesRemaining + ' occ4=' + occ4
      );
      assert(
        'contributionPerPeriodCents con 5 oportunidades es MENOR que con 4, para la misma cantidad pendiente',
        p5.remainingCents === p4.remainingCents && p5.contributionPerPeriodCents < p4.contributionPerPeriodCents,
        'p5=' + JSON.stringify(p5) + ' p4=' + JSON.stringify(p4)
      );
      assert(
        'contributionPerPeriodCents coincide con remainingCents/occurrences via App.money.div',
        p5.contributionPerPeriodCents === M.div(p5.remainingCents, occ5) &&
          p4.contributionPerPeriodCents === M.div(p4.remainingCents, occ4),
        'p5=' + p5.contributionPerPeriodCents + ' p4=' + p4.contributionPerPeriodCents
      );
    })();

    // 4) Meta sin fecha objetivo -> nunca Infinity/NaN, warning claro.
    (function () {
      var goal = { id: 'g_sinfecha', name: 'Sin fecha', kind: 'otro', targetCents: 10000, savedCents: 1000, contributionFrequency: 'mensual' };
      var p = computeGoalProgress(goal, '2026-09-13');
      assert(
        'Meta sin targetDateISO no produce Infinity/NaN y trae warning',
        p.contributionPerPeriodCents === 0 && !isNaN(p.expectedSavedByNowCents) && isFinite(p.expectedSavedByNowCents) &&
          typeof p.warning === 'string' && p.warning.length > 0,
        JSON.stringify(p)
      );
    })();

    // 5) Estado 'adelantada' cuando el ahorro real supera al esperado por
    //    prorrateo lineal desde startDateISO.
    (function () {
      var goal = {
        id: 'g_adelantada', name: 'Adelantada', kind: 'otro',
        targetCents: 120000, savedCents: 100000,
        startDateISO: '2026-01-01', targetDateISO: '2027-01-01',
        contributionFrequency: 'mensual'
      };
      // A mitad de camino (~2026-07-02) se esperaria ~60000 ahorrados; con
      // 100000 reales, la meta deberia verse claramente adelantada.
      var p = computeGoalProgress(goal, '2026-07-02');
      assert(
        'Ahorro real muy por encima del esperado -> status "adelantada"',
        p.status === 'adelantada' && p.expectedSavedByNowCents < 100000,
        JSON.stringify(p)
      );
    })();

    // 6) suggestAlternatives genera al menos 2 alternativas cuando lo
    //    disponible no alcanza para la aportacion requerida.
    (function () {
      var goal = {
        id: 'g_dificil', name: 'Dificil', kind: 'carro',
        targetCents: 600000, savedCents: 0,
        targetDateISO: '2026-12-13', contributionFrequency: 'mensual'
      };
      var progress = computeGoalProgress(goal, '2026-09-13');
      var alts = suggestAlternatives(goal, '2026-09-13', Math.floor(progress.contributionPerPeriodCents / 3));
      assert(
        'suggestAlternatives produce al menos 2 alternativas cuando el aporte disponible no alcanza',
        Array.isArray(alts) && alts.length >= 2,
        JSON.stringify(alts)
      );
      var types = alts.map(function (a) { return a.type; });
      assert(
        'suggestAlternatives incluye extender_fecha y reducir_meta',
        types.indexOf('extender_fecha') !== -1 && types.indexOf('reducir_meta') !== -1,
        JSON.stringify(types)
      );
      alts.forEach(function (a) {
        assert(
          'Alternativa "' + a.type + '" trae su calculo mostrado en description',
          typeof a.description === 'string' && a.description.length > 10,
          JSON.stringify(a)
        );
      });
    })();

    // 7) suggestAlternatives NO genera alternativas si lo disponible ya alcanza.
    (function () {
      var goal = {
        id: 'g_facil', name: 'Facil', kind: 'otro',
        targetCents: 12000, savedCents: 0,
        targetDateISO: '2026-12-13', contributionFrequency: 'mensual'
      };
      var progress = computeGoalProgress(goal, '2026-09-13');
      var alts = suggestAlternatives(goal, '2026-09-13', progress.contributionPerPeriodCents);
      assert(
        'Si el aporte disponible alcanza exactamente lo requerido, no se generan alternativas',
        Array.isArray(alts) && alts.length === 0,
        JSON.stringify(alts)
      );
    })();

    // 8) suggestAlternatives sobre una meta ya completada no sugiere nada.
    (function () {
      var goal = { id: 'g_ok', targetCents: 1000, savedCents: 1000, targetDateISO: '2026-12-13', contributionFrequency: 'mensual' };
      var alts = suggestAlternatives(goal, '2026-09-13', 0);
      assert('Meta completada no genera alternativas', Array.isArray(alts) && alts.length === 0, JSON.stringify(alts));
    })();

    // 9) Pureza: computeGoalProgress no muta el objeto goal recibido.
    (function () {
      var goal = { id: 'g_puro', targetCents: 5000, savedCents: 1000, targetDateISO: '2026-12-13', contributionFrequency: 'mensual' };
      var before = JSON.stringify(goal);
      computeGoalProgress(goal, '2026-09-13');
      assert('computeGoalProgress no muta el goal recibido', JSON.stringify(goal) === before, 'antes=' + before + ' despues=' + JSON.stringify(goal));
    })();

    return runner.summarize('App.calc.savings.__runTests');
  }

  window.App.calc = window.App.calc || {};
  window.App.calc.savings = {
    computeGoalProgress: computeGoalProgress,
    suggestAlternatives: suggestAlternatives,
    __runTests: savingsRunTests
  };

  // ---------------------------------------------------------------------
  // window.App.planner
  // ---------------------------------------------------------------------

  /**
   * computeWeeklyRow(appState, weekStartISO) -> fila de la tabla semanal.
   *
   * Distingue SIEMPRE ingresos ESPERADOS (proyectados desde incomeSources)
   * de ingresos RECIBIDOS (transacciones confirmadas type='ingreso' en la
   * semana): los esperados nunca se suman a availableToSpendCents.
   */
  function computeWeeklyRow(appState, weekStartISO) {
    var M = money();
    var D = date();
    appState = appState || {};

    var weekEndExclusiveISO = D.addDays(weekStartISO, 7);
    var weekEndISO = D.addDays(weekStartISO, 6); // ultimo dia de la semana, inclusive

    var incomeSources = arr(appState.incomeSources);
    var recurringExpenses = arr(appState.recurringExpenses);
    var debts = arr(appState.debts);
    var goals = arr(appState.goals);
    var transactions = arr(appState.transactions);

    // Ingresos ESPERADOS: solo fuentes con expectedAmountCents definido y
    // positivo. Un ingreso variable sin monto fijo NUNCA se inventa: si no
    // trae expectedAmountCents, simplemente no aporta a la proyeccion.
    var expectedIncomeCents = 0;
    incomeSources.forEach(function (src) {
      if (!src || !isNonEmptyString(src.nextDateISO) || !isValidFrequency(src.frequency)) return;
      if (typeof src.expectedAmountCents !== 'number' || src.expectedAmountCents <= 0) return;
      var occ = D.occurrencesBetween(weekStartISO, weekEndExclusiveISO, src.frequency, src.nextDateISO);
      if (occ > 0) expectedIncomeCents = M.add(expectedIncomeCents, M.mul(src.expectedAmountCents, occ));
    });

    // Ingresos RECIBIDOS: unicamente transacciones reales y confirmadas.
    var receivedIncomeCents = 0;
    transactions.forEach(function (tx) {
      if (!tx || tx.type !== 'ingreso' || tx.status !== 'confirmado') return;
      if (!isNonEmptyString(tx.dateISO) || tx.dateISO < weekStartISO || tx.dateISO >= weekEndExclusiveISO) return;
      receivedIncomeCents = M.add(receivedIncomeCents, numOr0(tx.amountCents));
    });

    // Gastos planeados: recurringExpenses + pagos minimos de deudas que
    // vencen dentro de esta semana.
    var plannedExpensesCents = 0;
    recurringExpenses.forEach(function (exp) {
      if (!exp || !isNonEmptyString(exp.nextDueDateISO) || !isValidFrequency(exp.frequency)) return;
      var occ = D.occurrencesBetween(weekStartISO, weekEndExclusiveISO, exp.frequency, exp.nextDueDateISO);
      if (occ > 0) plannedExpensesCents = M.add(plannedExpensesCents, M.mul(numOr0(exp.amountCents), occ));
    });
    debts.forEach(function (debt) {
      if (!debt) return;
      var freq = debtFrequency(debt);
      var anchor = debtAnchorISO(debt, weekStartISO);
      var occ = D.occurrencesBetween(weekStartISO, weekEndExclusiveISO, freq, anchor);
      if (occ > 0) plannedExpensesCents = M.add(plannedExpensesCents, M.mul(numOr0(debt.minPaymentCents), occ));
    });

    // Reservas pendientes: dinero ya apartado para gastos recurrentes
    // futuros (reservedCents), independiente de si vencen esta semana.
    var pendingReservesCents = 0;
    recurringExpenses.forEach(function (exp) {
      if (exp && typeof exp.reservedCents === 'number') {
        pendingReservesCents = M.add(pendingReservesCents, exp.reservedCents);
      }
    });

    // Ahorro planeado: aportacion sugerida (computeGoalProgress) para las
    // metas activas cuyo ciclo de aportacion cae dentro de esta semana.
    var plannedSavingsCents = 0;
    goals.forEach(function (goal) {
      if (!goal) return;
      var progress = computeGoalProgress(goal, weekStartISO);
      if (progress.status === 'completada' || progress.contributionPerPeriodCents <= 0) return;
      if (!isValidFrequency(goal.contributionFrequency) || !isNonEmptyString(goal.targetDateISO)) return;
      var occ = D.occurrencesBetween(weekStartISO, weekEndExclusiveISO, goal.contributionFrequency, goal.targetDateISO);
      if (occ > 0) plannedSavingsCents = M.add(plannedSavingsCents, M.mul(progress.contributionPerPeriodCents, occ));
    });

    // Ahorro real: transacciones confirmadas ligadas a una meta (linkedGoalId).
    var actualSavingsCents = 0;
    transactions.forEach(function (tx) {
      if (!tx || !tx.linkedGoalId || tx.status !== 'confirmado') return;
      if (!isNonEmptyString(tx.dateISO) || tx.dateISO < weekStartISO || tx.dateISO >= weekEndExclusiveISO) return;
      actualSavingsCents = M.add(actualSavingsCents, numOr0(tx.amountCents));
    });

    // Disponible para gastar: dinero REAL recibido esta semana, menos
    // obligaciones que vencen esta semana, menos reservas comprometidas,
    // menos lo que el plan de ahorro pide apartar. Los ingresos ESPERADOS
    // (proyectados) NUNCA se suman aqui.
    var availableToSpendCents = M.sub(
      M.sub(M.sub(receivedIncomeCents, plannedExpensesCents), pendingReservesCents),
      plannedSavingsCents
    );

    return {
      weekStartISO: weekStartISO,
      weekEndISO: weekEndISO,
      expectedIncomeCents: expectedIncomeCents,
      receivedIncomeCents: receivedIncomeCents,
      plannedExpensesCents: plannedExpensesCents,
      pendingReservesCents: pendingReservesCents,
      plannedSavingsCents: plannedSavingsCents,
      actualSavingsCents: actualSavingsCents,
      availableToSpendCents: availableToSpendCents
    };
  }

  /**
   * buildWeeklyTable(appState, todayISO, weeksBack, weeksForward) ->
   *   filas computeWeeklyRow para semanas pasadas (isHistorical:true), la
   *   semana actual, y weeksForward semanas futuras (isProjection:true).
   */
  function buildWeeklyTable(appState, todayISO, weeksBack, weeksForward) {
    var D = date();
    appState = appState || {};
    var weekStartsOn =
      appState.settings && typeof appState.settings.weekStartsOn === 'number' ? appState.settings.weekStartsOn : 0;
    var back = Math.max(0, Math.floor(weeksBack) || 0);
    var forward = Math.max(0, Math.floor(weeksForward) || 0);
    var currentWeekStartISO = D.startOfWeek(todayISO, weekStartsOn);

    var rows = [];
    for (var i = -back; i <= forward; i++) {
      var weekStartISO = D.addDays(currentWeekStartISO, i * 7);
      var row = computeWeeklyRow(appState, weekStartISO);
      row.isHistorical = i < 0;
      row.isProjection = i > 0;
      rows.push(row);
    }
    return rows;
  }

  // Infiere "cada cuanto entra dinero" a partir de incomeSources (el ciclo
  // conocido mas frecuente). Ver nota de disenio #4 en la cabecera.
  function inferPayPeriodDays(appState) {
    var candidates = arr(appState.incomeSources)
      .filter(function (s) { return s && isValidFrequency(s.frequency); })
      .map(function (s) { return FREQ_DAYS[s.frequency]; });
    if (candidates.length === 0) return 14;
    return Math.min.apply(null, candidates);
  }

  /**
   * proposeIncomeDistribution(appState, incomeAmountCents, dateISO) ->
   *   { items: [{label, amountCents, reason}], unallocatedCents,
   *     deficitCents, deficitDetail }
   *
   * Propuesta EDITABLE, solo datos: nunca modifica appState. Reparte
   * incomeAmountCents por prioridad (obligaciones proximas > reservas
   * futuras > metas > gastos personales); si no alcanza, el faltante se
   * reporta en deficitCents/deficitDetail en vez de ocultarse.
   */
  function proposeIncomeDistribution(appState, incomeAmountCents, dateISO) {
    var M = money();
    var D = date();
    appState = appState || {};

    var NEAR_HORIZON_DAYS = 14;
    var FAR_HORIZON_DAYS = 90;
    var DISCRETIONARY_WINDOW_DAYS = 60;

    var totalIncome = Math.max(0, Math.round(numOr0(incomeAmountCents)));
    var remaining = totalIncome;
    var totalNeeded = 0;
    var items = [];
    var deficitDetail = [];

    function allocate(label, neededCentsRaw, reason) {
      var neededCents = Math.max(0, Math.round(numOr0(neededCentsRaw)));
      if (neededCents <= 0) return;
      totalNeeded += neededCents;
      var given = Math.min(remaining, neededCents);
      items.push({ label: label, amountCents: given, reason: reason });
      remaining = M.sub(remaining, given);
      if (given < neededCents) {
        deficitDetail.push({
          label: label,
          neededCents: neededCents,
          coveredCents: given,
          shortfallCents: neededCents - given
        });
      }
    }

    var payPeriodDays = inferPayPeriodDays(appState);

    // 1) Necesidades y obligaciones proximas (dentro de NEAR_HORIZON_DAYS).
    arr(appState.recurringExpenses).forEach(function (exp) {
      if (!exp || !isNonEmptyString(exp.nextDueDateISO) || !isValidFrequency(exp.frequency)) return;
      var nextDue = D.nextOccurrence(dateISO, exp.frequency, exp.nextDueDateISO);
      var daysAway = D.diffDays(dateISO, nextDue);
      var neededNow = Math.max(0, numOr0(exp.amountCents) - numOr0(exp.reservedCents));
      if (daysAway <= NEAR_HORIZON_DAYS && neededNow > 0) {
        allocate(
          'Obligación próxima: ' + (exp.name || exp.id),
          neededNow,
          'Vence el ' + nextDue + ' (' + daysAway + ' día(s)); monto ' + M.format(numOr0(exp.amountCents)) +
            ' menos ' + M.format(numOr0(exp.reservedCents)) + ' ya reservado.'
        );
      }
    });
    arr(appState.debts).forEach(function (debt) {
      if (!debt) return;
      var freq = debtFrequency(debt);
      var anchor = debtAnchorISO(debt, dateISO);
      var nextDue = D.nextOccurrence(dateISO, freq, anchor);
      var daysAway = D.diffDays(dateISO, nextDue);
      if (daysAway <= NEAR_HORIZON_DAYS && numOr0(debt.minPaymentCents) > 0) {
        allocate(
          'Pago mínimo de deuda: ' + (debt.name || debt.id),
          debt.minPaymentCents,
          'Vence el ' + nextDue + ' (' + daysAway + ' día(s)); pago mínimo ' + M.format(numOr0(debt.minPaymentCents)) + '.'
        );
      }
    });

    // 2) Reservas para facturas futuras (entre NEAR_HORIZON_DAYS y
    //    FAR_HORIZON_DAYS): se aparta la porcion de tiempo que representa
    //    ESTE ingreso (payPeriodDays) frente a lo que falta para vencer.
    //    Nunca un porcentaje fijo: siempre derivado de fechas reales.
    arr(appState.recurringExpenses).forEach(function (exp) {
      if (!exp || !isNonEmptyString(exp.nextDueDateISO) || !isValidFrequency(exp.frequency)) return;
      var nextDue = D.nextOccurrence(dateISO, exp.frequency, exp.nextDueDateISO);
      var daysAway = D.diffDays(dateISO, nextDue);
      var neededTotal = Math.max(0, numOr0(exp.amountCents) - numOr0(exp.reservedCents));
      if (daysAway > NEAR_HORIZON_DAYS && daysAway <= FAR_HORIZON_DAYS && neededTotal > 0) {
        var shareFraction = Math.min(1, payPeriodDays / daysAway);
        var shareCents = M.mul(neededTotal, shareFraction);
        if (shareCents > 0) {
          allocate(
            'Reserva para: ' + (exp.name || exp.id),
            shareCents,
            'Vence el ' + nextDue + ' (' + daysAway + ' dias); se reserva ' + payPeriodDays + '/' + daysAway +
              ' partes de ' + M.format(neededTotal) + ' pendientes.'
          );
        }
      }
    });

    // 3) Fondo de emergencia y otras metas activas: aportacion por
    //    periodo ya calculada (computeGoalProgress), prorrateada del
    //    periodo propio de la meta al periodo de ESTE ingreso.
    arr(appState.goals).forEach(function (goal) {
      if (!goal) return;
      var progress = computeGoalProgress(goal, dateISO);
      if (progress.status === 'completada' || progress.contributionPerPeriodCents <= 0) return;
      var goalPeriodDays = isValidFrequency(goal.contributionFrequency) ? FREQ_DAYS[goal.contributionFrequency] : payPeriodDays;
      var shareCents = M.mul(progress.contributionPerPeriodCents, payPeriodDays / goalPeriodDays);
      if (shareCents > 0) {
        var label = goal.kind === 'emergencia' ? 'Fondo de emergencia: ' + (goal.name || goal.id) : 'Meta: ' + (goal.name || goal.id);
        allocate(
          label,
          shareCents,
          'Aportacion calculada de ' + M.format(progress.contributionPerPeriodCents) + ' cada ' + goal.contributionFrequency +
            ', prorrateada a este ingreso (ciclo de ' + payPeriodDays + ' dias).'
        );
      }
    });

    // 4) Gastos personales: promedio de gasto discrecional REAL (no
    //    ligado a una obligacion, deuda o meta) en los ultimos
    //    DISCRETIONARY_WINDOW_DAYS dias, proyectado al ciclo de este
    //    ingreso. Nunca se inventa un porcentaje fijo; si no hay
    //    historial, no se genera este item.
    var windowStartISO = D.addDays(dateISO, -DISCRETIONARY_WINDOW_DAYS);
    var discretionaryTotal = 0;
    arr(appState.transactions).forEach(function (tx) {
      if (!tx || tx.type !== 'gasto' || tx.status !== 'confirmado') return;
      if (tx.linkedRecurringId || tx.linkedDebtId || tx.linkedGoalId) return;
      if (!isNonEmptyString(tx.dateISO) || tx.dateISO < windowStartISO || tx.dateISO >= dateISO) return;
      discretionaryTotal = M.add(discretionaryTotal, numOr0(tx.amountCents));
    });
    if (discretionaryTotal > 0) {
      var dailyAvgCents = discretionaryTotal / DISCRETIONARY_WINDOW_DAYS;
      var personalShareCents = Math.round(dailyAvgCents * payPeriodDays);
      allocate(
        'Gastos personales',
        personalShareCents,
        'Promedio de gasto discrecional de los ultimos ' + DISCRETIONARY_WINDOW_DAYS + ' dias (' +
          M.format(discretionaryTotal) + ' en total, ' + M.format(Math.round(dailyAvgCents)) + '/dia), proyectado a ' +
          payPeriodDays + ' dias.'
      );
    }

    var deficitCents = Math.max(0, totalNeeded - totalIncome);
    var unallocatedCents = deficitCents > 0 ? 0 : Math.max(0, remaining);

    return {
      items: items,
      unallocatedCents: unallocatedCents,
      deficitCents: deficitCents,
      deficitDetail: deficitDetail
    };
  }

  function plannerRunTests() {
    var runner = makeRunner();
    var assert = runner.assert;

    function baseState() {
      return {
        schemaVersion: 1,
        demoMode: false,
        settings: { currency: 'USD', locale: 'es-US', weekStartsOn: 0, cushionCents: 0 },
        accounts: [{ id: 'acc_1', name: 'Banco', kind: 'banco', initialBalanceCents: 0, creditLimitCents: 0, archived: false }],
        categories: [],
        incomeSources: [],
        recurringExpenses: [],
        debts: [],
        goals: [],
        transactions: [],
        weeklyPlans: []
      };
    }

    // 1) Semana SIN NINGUN ingreso (ni esperado ni recibido) no falla y
    //    muestra 0s coherentes.
    (function () {
      var state = baseState();
      var row = window.App.planner.computeWeeklyRow(state, '2026-09-14'); // lunes
      assert(
        'Semana sin ingresos: expectedIncomeCents=0, receivedIncomeCents=0, sin NaN',
        row.expectedIncomeCents === 0 && row.receivedIncomeCents === 0 &&
          !isNaN(row.availableToSpendCents) && isFinite(row.availableToSpendCents) &&
          row.plannedExpensesCents === 0 && row.pendingReservesCents === 0 &&
          row.plannedSavingsCents === 0 && row.actualSavingsCents === 0 && row.availableToSpendCents === 0,
        JSON.stringify(row)
      );
    })();

    // 2) Ingreso variable (kind='variable' sin expectedAmountCents fijo)
    //    se maneja sin inventar un monto.
    (function () {
      var state = baseState();
      state.incomeSources = [
        { id: 'inc_var', name: 'Freelance', kind: 'variable', frequency: 'semanal', nextDateISO: '2026-09-14', accountId: 'acc_1' }
        // sin expectedAmountCents: monto desconocido de antemano
      ];
      var row = window.App.planner.computeWeeklyRow(state, '2026-09-14');
      assert(
        'Ingreso variable sin expectedAmountCents no se inventa (expectedIncomeCents=0) y no lanza error',
        row.expectedIncomeCents === 0,
        JSON.stringify(row)
      );

      // Si SI trae expectedAmountCents (estimacion propia del usuario), se
      // proyecta igual que cualquier otra fuente.
      state.incomeSources[0].expectedAmountCents = 50000;
      var row2 = window.App.planner.computeWeeklyRow(state, '2026-09-14');
      assert(
        'Ingreso variable CON expectedAmountCents explicito si se proyecta',
        row2.expectedIncomeCents === 50000,
        JSON.stringify(row2)
      );
    })();

    // 3) Distingue ingresos esperados de recibidos: los esperados nunca
    //    inflan availableToSpendCents.
    (function () {
      var state = baseState();
      state.incomeSources = [{ id: 'inc_fijo', name: 'Salario', kind: 'fijo', expectedAmountCents: 200000, frequency: 'semanal', nextDateISO: '2026-09-14', accountId: 'acc_1' }];
      state.transactions = [
        { id: 'tx1', type: 'ingreso', amountCents: 150000, dateISO: '2026-09-15', accountId: 'acc_1', status: 'confirmado', createdAt: '2026-09-15T00:00:00.000Z', updatedAt: '2026-09-15T00:00:00.000Z' }
      ];
      var row = window.App.planner.computeWeeklyRow(state, '2026-09-14');
      assert(
        'expectedIncomeCents y receivedIncomeCents se calculan por separado',
        row.expectedIncomeCents === 200000 && row.receivedIncomeCents === 150000,
        JSON.stringify(row)
      );
      assert(
        'availableToSpendCents usa receivedIncomeCents (real), nunca expectedIncomeCents',
        row.availableToSpendCents === 150000,
        JSON.stringify(row)
      );
    })();

    // 4) buildWeeklyTable marca correctamente pasado/futuro y devuelve el
    //    numero de filas esperado.
    (function () {
      var state = baseState();
      var rows = window.App.planner.buildWeeklyTable(state, '2026-09-13', 2, 3);
      assert('buildWeeklyTable devuelve weeksBack+weeksForward+1 filas', rows.length === 6, 'length=' + rows.length);
      var historicalCount = rows.filter(function (r) { return r.isHistorical; }).length;
      var projectionCount = rows.filter(function (r) { return r.isProjection; }).length;
      var currentCount = rows.filter(function (r) { return !r.isHistorical && !r.isProjection; }).length;
      assert(
        'buildWeeklyTable marca isHistorical/isProjection/actual correctamente',
        historicalCount === 2 && projectionCount === 3 && currentCount === 1,
        'historical=' + historicalCount + ' projection=' + projectionCount + ' current=' + currentCount
      );
    })();

    // 5) proposeIncomeDistribution con dinero insuficiente -> deficitCents > 0, no se oculta.
    (function () {
      var state = baseState();
      state.recurringExpenses = [
        { id: 'exp_renta', name: 'Renta', amountCents: 500000, frequency: 'mensual', nextDueDateISO: '2026-09-20', accountId: 'acc_1', categoryId: null, reservedCents: 0 }
      ];
      state.debts = [{ id: 'debt_1', name: 'Prestamo', minPaymentCents: 100000, dueDay: 25, accountId: 'acc_1', frequency: 'mensual' }];
      var result = window.App.planner.proposeIncomeDistribution(state, 200000, '2026-09-13');
      assert(
        'Dinero insuficiente: deficitCents > 0 y deficitDetail no esta vacio',
        result.deficitCents > 0 && Array.isArray(result.deficitDetail) && result.deficitDetail.length > 0,
        JSON.stringify(result)
      );
      var totalAsignado = result.items.reduce(function (sum, it) { return sum + it.amountCents; }, 0);
      assert(
        'La suma de items asignados nunca excede el ingreso disponible',
        totalAsignado <= 200000,
        'totalAsignado=' + totalAsignado
      );
    })();

    // 6) proposeIncomeDistribution con dinero suficiente -> sin deficit, resto queda pendiente de asignar.
    (function () {
      var state = baseState();
      state.recurringExpenses = [
        { id: 'exp_luz', name: 'Luz', amountCents: 10000, frequency: 'mensual', nextDueDateISO: '2026-09-18', accountId: 'acc_1', categoryId: null, reservedCents: 0 }
      ];
      var result = window.App.planner.proposeIncomeDistribution(state, 100000, '2026-09-13');
      assert(
        'Dinero suficiente: deficitCents=0 y sobra dinero sin asignar',
        result.deficitCents === 0 && result.unallocatedCents > 0,
        JSON.stringify(result)
      );
    })();

    // 7) proposeIncomeDistribution nunca usa un porcentaje fijo: sin
    //    ninguna obligacion/meta/historial, todo el ingreso queda
    //    pendiente de asignar (no se inventa un reparto).
    (function () {
      var state = baseState();
      var result = window.App.planner.proposeIncomeDistribution(state, 100000, '2026-09-13');
      assert(
        'Sin datos de obligaciones/metas/historial, no se inventa ningun item y todo queda sin asignar',
        result.items.length === 0 && result.unallocatedCents === 100000 && result.deficitCents === 0,
        JSON.stringify(result)
      );
    })();

    // 8) Pureza: ninguna funcion del planner muta el appState recibido.
    (function () {
      var state = baseState();
      state.recurringExpenses = [{ id: 'exp_x', name: 'X', amountCents: 5000, frequency: 'mensual', nextDueDateISO: '2026-09-20', accountId: 'acc_1', reservedCents: 0 }];
      var before = JSON.stringify(state);
      window.App.planner.computeWeeklyRow(state, '2026-09-14');
      window.App.planner.buildWeeklyTable(state, '2026-09-13', 1, 1);
      window.App.planner.proposeIncomeDistribution(state, 50000, '2026-09-13');
      var after = JSON.stringify(state);
      assert('Ninguna funcion del planner muta appState', after === before, after === before ? 'ok, sin cambios' : 'appState cambio: antes=' + before + ' despues=' + after);
    })();

    return runner.summarize('App.planner.__runTests');
  }

  window.App.planner = {
    computeWeeklyRow: computeWeeklyRow,
    buildWeeklyTable: buildWeeklyTable,
    proposeIncomeDistribution: proposeIncomeDistribution,
    __runTests: plannerRunTests
  };
})();

</script>
<script>
/* ===== modules/estado.js ===== */
/**
 * estado.js
 *
 * Modulo de ESTADO, PERSISTENCIA y EXPORTACION/IMPORTACION para la app de
 * finanzas personales. JS plano, sin dependencias externas, pensado para
 * cargarse via <script> tag (sin build step, sin import/export ES6).
 *
 * Este es el UNICO modulo autorizado a tocar localStorage y a generar
 * datos de demostracion.
 *
 * Depende de (deben cargarse ANTES que este archivo):
 *   - window.App.money  (add/sub/mul/div, format, parse, toCents, fromCents)
