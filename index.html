<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cuentas Claras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<meta name="theme-color" content="#F4F6F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10150F" media="(prefers-color-scheme: dark)">
<meta name="description" content="Cuentas Claras — control de finanzas personales: disponible real para gastar, reservas para facturas, metas de ahorro y plan semanal.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cuentas Claras">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="shortcut icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  /* =====================================================================
     Cuentas Claras — sistema visual
     Mobile-first real: el telefono manda, el escritorio se ensancha.
     ===================================================================== */

  /* ---------- Design tokens ---------- */
  :root {
    --bg: #F4F6F2;
    --surface: #FFFFFF;
    --surface-alt: #E9EDE6;
    --surface-sunken: #EAEEE7;
    --surface-glass: rgba(255,255,255,0.82);
    --ink: #1B2A22;
    --ink-soft: #51604F;
    --ink-faint: #8A9587;
    --border: #D7DED2;
    --border-strong: #BEC9B7;
    --accent: #A8781F;
    --accent-strong: #7E5A16;
    --accent-soft: #F2E6CC;
    --accent-ink: #FFF8EA;
    --positive: #2F7A4F;
    --positive-soft: #E3F0E5;
    --negative: #B23B3B;
    --negative-soft: #F6E5E3;
    --warning: #C97A2B;
    --warning-soft: #F7E9D6;
    --focus: #3D6FE0;
    --shadow-1: 0 1px 2px rgba(27,42,34,0.05);
    --shadow-2: 0 1px 2px rgba(27,42,34,0.06), 0 4px 14px rgba(27,42,34,0.05);
    --shadow-3: 0 10px 30px rgba(27,42,34,0.14), 0 2px 8px rgba(27,42,34,0.08);
    --shadow: var(--shadow-2);
    --radius-s: 8px;
    --radius-m: 12px;
    --radius-l: 18px;
    --radius-xl: 24px;
    --tap: 44px;
    --gutter: 16px;
    --ease: cubic-bezier(.32,.72,0,1);
    --font-display: "Fraunces", Georgia, "Times New Roman", serif;
    --font-body: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10150F;
      --surface: #171D15;
      --surface-alt: #1E251C;
      --surface-sunken: #141910;
      --surface-glass: rgba(23,29,21,0.86);
      --ink: #E9EEE5;
      --ink-soft: #AAB6A5;
      --ink-faint: #6E7A69;
      --border: #2B332A;
      --border-strong: #3A4438;
      --accent: #D9A64E;
      --accent-strong: #EFC77A;
      --accent-soft: #3A2E14;
      --accent-ink: #1B1405;
      --positive: #63BC85;
      --positive-soft: #16281E;
      --negative: #E58080;
      --negative-soft: #2E1918;
      --warning: #E2A354;
      --warning-soft: #2E2314;
      --focus: #7FA2F5;
      --shadow-1: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-2: 0 1px 2px rgba(0,0,0,0.3), 0 4px 18px rgba(0,0,0,0.35);
      --shadow-3: 0 12px 34px rgba(0,0,0,0.55), 0 2px 8px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #10150F;
    --surface: #171D15;
    --surface-alt: #1E251C;
    --surface-sunken: #141910;
    --surface-glass: rgba(23,29,21,0.86);
    --ink: #E9EEE5;
    --ink-soft: #AAB6A5;
    --ink-faint: #6E7A69;
    --border: #2B332A;
    --border-strong: #3A4438;
    --accent: #D9A64E;
    --accent-strong: #EFC77A;
    --accent-soft: #3A2E14;
    --accent-ink: #1B1405;
    --positive: #63BC85;
    --positive-soft: #16281E;
    --negative: #E58080;
    --negative-soft: #2E1918;
    --warning: #E2A354;
    --warning-soft: #2E2314;
    --focus: #7FA2F5;
    --shadow-1: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-2: 0 1px 2px rgba(0,0,0,0.3), 0 4px 18px rgba(0,0,0,0.35);
    --shadow-3: 0 12px 34px rgba(0,0,0,0.55), 0 2px 8px rgba(0,0,0,0.4);
  }

  :root[data-theme="dark"] { color-scheme: dark; }
  :root[data-theme="light"] { color-scheme: light; }

  * { box-sizing: border-box; }
  html {
    color-scheme: light dark;
    -webkit-text-size-adjust: 100%;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }
  h1, h2, h3 { font-family: var(--font-display); font-weight: 600; text-wrap: balance; margin: 0; color: var(--ink); }
  .num, .amount, .amount-in, .amount-out { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  a { color: inherit; }
  button { font-family: inherit; }
  ::selection { background: var(--accent-soft); }

  /* ---------- Estructura ---------- */
  #app { display: flex; min-height: 100vh; min-height: 100dvh; }

  .sidebar {
    width: 244px;
    flex: none;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 20px 14px calc(16px + env(safe-area-inset-bottom));
    gap: 2px;
    position: sticky;
    top: 0;
    height: 100vh;
    height: 100dvh;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 10px 20px;
  }
  .brand-mark {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 17px;
    color: var(--accent-ink);
    background: var(--accent);
    width: 32px; height: 32px;
    border-radius: 10px;
    display: grid; place-items: center;
    flex: none;
  }
  .brand-name { font-family: var(--font-display); font-weight: 600; font-size: 17px; letter-spacing: -0.01em; }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 11px 12px;
    min-height: var(--tap);
    border-radius: var(--radius-m);
    color: var(--ink-soft);
    font-weight: 500;
    font-size: 14px;
    cursor: pointer;
    border: none;
    background: none;
    text-align: left;
    width: 100%;
    transition: background .16s var(--ease), color .16s var(--ease);
  }
  .nav-item:hover { background: var(--surface-alt); color: var(--ink); }
  .nav-item:active { background: var(--surface-sunken); }
  .nav-item[aria-current="page"] { background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; }
  .nav-icon {
    width: 20px; height: 20px; flex: none;
    fill: none; stroke: currentColor;
    stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
  }

  .sidebar-foot {
    margin-top: auto;
    padding: 14px 10px 0;
    font-size: 12px;
    color: var(--ink-faint);
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .demo-pill {
    display: none;
    align-items: center;
    gap: 6px;
    background: var(--warning-soft);
    color: var(--warning);
    border: 1px solid var(--warning);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 600;
    width: fit-content;
  }
  body[data-demo="true"] .demo-pill { display: flex; }

  /* Selector de tema (claro / auto / oscuro) */
  .theme-switch {
    display: flex;
    background: var(--surface-sunken);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }
  .theme-switch button {
    flex: 1;
    min-width: 0;
    border: none;
    background: none;
    color: var(--ink-faint);
    font-size: 11.5px;
    font-weight: 600;
    padding: 6px 4px;
    border-radius: 999px;
    cursor: pointer;
    transition: background .16s var(--ease), color .16s var(--ease);
  }
  .theme-switch button:hover { color: var(--ink); }
  .theme-switch button[aria-pressed="true"] {
    background: var(--surface);
    color: var(--ink);
    box-shadow: var(--shadow-1);
  }

  main {
    flex: 1;
    min-width: 0;
    padding: 28px 32px 96px;
    max-width: 1220px;
  }

  /* Cabecera movil (solo < 860px) */
  .app-header { display: none; }

  .topbar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }
  .topbar h1 { font-size: 27px; letter-spacing: -0.02em; }
  .topbar-sub { color: var(--ink-soft); font-size: 13.5px; margin-top: 3px; }
  .topbar-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .screen { display: none; }
  .screen.active { display: block; }

  /* ---------- Piezas reutilizables ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-l);
    padding: 18px 20px;
    box-shadow: var(--shadow-1);
  }
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(224px, 1fr));
    gap: 14px;
    margin-bottom: 20px;
  }
  .stat-card {
    display: flex; flex-direction: column; gap: 6px;
    transition: transform .18s var(--ease), box-shadow .18s var(--ease);
  }
  @media (hover: hover) {
    .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); }
  }
  .stat-label {
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .stat-value {
    font-family: var(--font-mono);
    font-size: clamp(22px, 2.4vw, 27px);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }
  .stat-value.positive { color: var(--positive); }
  .stat-value.negative { color: var(--negative); }
  .stat-detail { font-size: 12.5px; color: var(--ink-soft); }

  /* La tarjeta principal del panel manda visualmente */
  .stats-grid > .stat-card:first-child {
    background: linear-gradient(140deg, var(--accent-soft), var(--surface) 62%);
    border-color: var(--border-strong);
  }

  .section { margin-bottom: 26px; }
  .section-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .section-head h2 { font-size: 18px; letter-spacing: -0.01em; }
  .section-eyebrow {
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--accent);
    display: block;
    margin-bottom: 3px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border-radius: var(--radius-m);
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--ink);
    padding: 9px 15px;
    min-height: 40px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background .16s var(--ease), border-color .16s var(--ease), transform .12s var(--ease);
  }
  .btn:hover { background: var(--surface-alt); }
  .btn:active { transform: scale(0.97); }
  .btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
  .btn-danger { color: var(--negative); border-color: var(--negative); background: transparent; }
  .btn-danger:hover { background: var(--negative-soft); }
  .btn-ghost { border-color: transparent; background: transparent; }
  .btn-ghost:hover { background: var(--surface-alt); }
  .btn-sm { padding: 6px 11px; min-height: 34px; font-size: 12.5px; }

  /* ---------- Tablas ---------- */
  table { width: 100%; border-collapse: collapse; }
  .table-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border: 1px solid var(--border);
    border-radius: var(--radius-l);
    background: var(--surface);
  }
  th {
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-faint);
    padding: 11px 14px;
    border-bottom: 1px solid var(--border-strong);
    white-space: nowrap;
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 1;
  }
  td {
    padding: 11px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 13.5px;
    white-space: nowrap;
  }
  tbody tr { transition: background .14s var(--ease); }
  @media (hover: hover) {
    tbody tr:hover { background: var(--surface-alt); }
  }
  tr:last-child td { border-bottom: none; }
  td.wrap { white-space: normal; }
  .amount-in { color: var(--positive); }
  .amount-out { color: var(--negative); }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 600;
    white-space: nowrap;
  }
  .pill-dot { width: 7px; height: 7px; border-radius: 999px; flex: none; }
  .pill-ok { background: var(--positive-soft); color: var(--positive); }
  .pill-warn { background: var(--warning-soft); color: var(--warning); }
  .pill-bad { background: var(--negative-soft); color: var(--negative); }
  .pill-neutral { background: var(--surface-alt); color: var(--ink-soft); }

  .progress {
    height: 9px;
    border-radius: 999px;
    background: var(--surface-sunken);
    overflow: hidden;
  }
  .progress > span {
    display: block; height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent-strong));
    transition: width .5s var(--ease);
  }

  /* ---------- Formularios ---------- */
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  label { font-size: 12px; font-weight: 600; color: var(--ink-soft); }
  input, select, textarea {
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-s);
    padding: 10px 11px;
    min-height: 42px;
    width: 100%;
    max-width: 100%;
    transition: border-color .16s var(--ease), box-shadow .16s var(--ease);
  }
  input:hover, select:hover, textarea:hover { border-color: var(--ink-faint); }
  input:focus, select:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  input[type="number"] { font-family: var(--font-mono); }
  input[type="color"] { padding: 4px; min-height: 42px; cursor: pointer; }
  input[type="file"] { padding: 9px 11px; font-size: 13px; }
  input[type="checkbox"] { min-height: 0; width: 18px; height: 18px; accent-color: var(--accent); }
  select {
    appearance: none;
    -webkit-appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    padding-right: 32px;
  }
  .form-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    align-items: end;
  }

  .banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    background: var(--warning-soft);
    border: 1px solid var(--warning);
    color: var(--ink);
    border-radius: var(--radius-m);
    padding: 13px 16px;
    font-size: 13.5px;
    line-height: 1.55;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .banner strong { color: var(--warning); }

  .empty {
    padding: 34px 20px;
    text-align: center;
    color: var(--ink-faint);
    font-size: 13.5px;
  }

  /* ---------- Modal / hoja inferior ---------- */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(16,20,15,0.45);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
    display: none; align-items: flex-start; justify-content: center;
    padding: 6vh 16px; z-index: 50; overflow-y: auto;
    overscroll-behavior: contain;
  }
  .modal-backdrop.open { display: flex; animation: fade-in .18s var(--ease); }
  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-xl); box-shadow: var(--shadow-3);
    width: 100%; max-width: 520px; padding: 24px;
  }
  .modal h3 { margin-bottom: 16px; font-size: 19px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
  .modal-actions .btn { min-height: var(--tap); }

  .form-error { color: var(--negative); font-size: 12.5px; margin-top: 10px; font-weight: 500; }
  .hint { color: var(--ink-faint); font-size: 12.5px; margin-top: 6px; line-height: 1.6; }

  .toast {
    position: fixed;
    bottom: calc(18px + env(safe-area-inset-bottom));
    left: 50%; transform: translateX(-50%) translateY(8px);
    background: var(--ink); color: var(--bg);
    padding: 11px 18px;
    border-radius: 999px; font-size: 13px; font-weight: 500;
    z-index: 60; box-shadow: var(--shadow-3);
    opacity: 0; pointer-events: none;
    transition: opacity .2s var(--ease), transform .2s var(--ease);
    max-width: calc(100vw - 32px);
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .goal-card { display: flex; flex-direction: column; gap: 11px; }
  .goal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
  .goal-meta { display: flex; gap: 8px 18px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-soft); }
  .goal-meta b { color: var(--ink); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .row-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .cat-dot { display: inline-block; width: 9px; height: 9px; border-radius: 999px; margin-right: 6px; flex: none; }
  .legend-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12.5px; padding: 5px 0; }
  .two-col { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 14px; align-items: start; }

  /* Boton flotante de accion rapida (solo movil) */
  .fab { display: none; }
  .only-mobile { display: none; }
  .topbar-actions .btn-ghost { border-color: var(--border); }

  /* Seis indicadores en dos filas limpias de tres, sin huecos sueltos */
  @media (min-width: 861px) {
    .stats-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }

  /* ---------- Tablet / escritorio estrecho ---------- */
  @media (max-width: 1100px) {
    main { padding: 26px 24px 96px; }
  }
  @media (max-width: 960px) {
    .two-col { grid-template-columns: 1fr; }
  }

  /* =====================================================================
     MOVIL  (< 860px): sin barra lateral, navegacion inferior fija
     ===================================================================== */
  .mobile-tabbar { display: none; }

  @media (max-width: 860px) {
    .sidebar { display: none; }
    #app { min-height: 0; }

    main {
      padding: 12px var(--gutter) calc(96px + env(safe-area-inset-bottom));
      max-width: 100%;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 30;
      padding: calc(10px + env(safe-area-inset-top)) var(--gutter) 10px;
      background: var(--surface-glass);
      -webkit-backdrop-filter: saturate(180%) blur(14px);
      backdrop-filter: saturate(180%) blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .app-header .brand { padding: 0; min-width: 0; flex: 1 1 auto; }

<script>
/* ===== modules/money.js ===== */
/**
 * money.js
 *
 * Modulo base de matematica monetaria y fechas para la app de finanzas
 * personales. JS plano, sin dependencias, pensado para cargarse via
 * <script> tag (sin build step, sin import/export ES6).
 *
 * Todas las cantidades de dinero se representan como ENTEROS en centavos
 * (nunca floats) para evitar errores de redondeo de punto flotante.
 *
 * Todas las fechas se representan como strings ISO 'YYYY-MM-DD' (sin hora).
 * Toda la logica de fechas ancla el parseo a mediodia UTC (o trabaja
 * directamente con componentes ano/mes/dia) para evitar bugs de zona
 * horaria — nunca se usa `new Date(isoString)` seguido de getters locales.
 *
 * No toca el DOM ni localStorage.
 */

window.App = window.App || {};

(function () {
  'use strict';

  // ---------------------------------------------------------------------
  // Helpers internos compartidos (no se exportan)
  // ---------------------------------------------------------------------

  /**
   * Redondea al entero mas cercano, con los .5 hacia afuera de cero
   * ("round half away from zero" / redondeo "half up" financiero
   * estandar, equivalente a ROUND_HALF_UP de Python's decimal).
   * Incluye una correccion epsilon minima para compensar errores de
   * representacion de punto flotante (ej. 2.5 almacenado como
   * 2.4999999999999996).
   */
  function roundHalfUp(n) {
    if (n >= 0) {
      return Math.floor(n + 0.5 + 1e-9);
    }
    return -Math.floor(-n + 0.5 + 1e-9);
  }

  function pad2(n) {
    return String(n).padStart(2, '0');
  }

  function pad4(n) {
    return String(n).padStart(4, '0');
  }

  // Mini test runner casero, compartido por money.__runTests y date.__runTests.
  function createRunner() {
    var results = { pass: 0, fail: 0, failures: [] };
    function check(name, actual, expected) {
      var ok;
      try {
        ok = JSON.stringify(actual) === JSON.stringify(expected);
      } catch (e) {
        ok = actual === expected;
      }
      if (ok) {
        results.pass++;
      } else {
        results.fail++;
        results.failures.push({ name: name, expected: expected, actual: actual });
      }
    }
    function checkThrows(name, fn) {
      var threw = false;
      try {
        fn();
      } catch (e) {
        threw = true;
      }
      if (threw) {
        results.pass++;
      } else {
        results.fail++;
        results.failures.push({ name: name, expected: 'throws Error', actual: 'no throw' });
      }
    }
    function checkClose(name, actual, expected, tolerance) {
      var ok = typeof actual === 'number' && typeof expected === 'number' &&
        Math.abs(actual - expected) <= (tolerance || 1e-9);
      if (ok) {
        results.pass++;
      } else {
        results.fail++;
        results.failures.push({ name: name, expected: expected, actual: actual });
      }
    }
    return { results: results, check: check, checkThrows: checkThrows, checkClose: checkClose };
  }

  // ---------------------------------------------------------------------
  // window.App.money
  // ---------------------------------------------------------------------

  function add(a, b) {
    return a + b;
  }

  function sub(a, b) {
    return a - b;
  }

  function mul(cents, factor) {
    return roundHalfUp(cents * factor);
  }

  function div(cents, divisor) {
    if (!(divisor > 0)) {
      throw new Error('div: el divisor debe ser un entero positivo, recibido: ' + divisor);
    }
    return roundHalfUp(cents / divisor);
  }

  function addThousandsSeparators(digitsStr) {
    return digitsStr.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  function format(cents) {
    var negative = cents < 0;
    var abs = Math.abs(cents);
    var dollars = Math.floor(abs / 100);
    var remainder = abs % 100;
    var dollarsStr = addThousandsSeparators(String(dollars));
    var centsStr = pad2(remainder);
    return (negative ? '-$' : '$') + dollarsStr + '.' + centsStr;
  }

  function parse(input) {
    if (input === null || input === undefined) {
      return 0;
    }
    var s = String(input).trim();
    if (s === '') {
      return 0;
    }
    // Quita simbolo de moneda y separadores de miles.
    s = s.replace(/\$/g, '').replace(/,/g, '').trim();
    if (s === '') {
      return 0;
    }
    // Soporta formato contable de negativos entre parentesis: (45.00)
    var negativeParens = false;
    if (/^\(.*\)$/.test(s)) {
      negativeParens = true;
      s = s.slice(1, -1).trim();
    }
    if (s === '') {
      return 0;
    }
    var num = Number(s);
    if (!isFinite(num) || isNaN(num)) {
      return 0;
    }
    var cents = roundHalfUp(num * 100);
    if (negativeParens) {
      cents = -Math.abs(cents);
    }
    return cents;
  }

  function toCents(dollarsFloat) {
    return roundHalfUp(dollarsFloat * 100);
  }

  function fromCents(cents) {
    return cents / 100;
  }

  function moneyRunTests() {
    var r = createRunner();
    var check = r.check;
    var checkThrows = r.checkThrows;

    // add / sub basicos
    check('add(100, 250)', add(100, 250), 350);
    check('sub(500, 150)', sub(500, 150), 350);
    check('sub(negativo)', sub(100, 500), -400);

    // Caso clasico "0.1 + 0.2" resuelto via centavos enteros (sin bug de float)
    check('toCents(0.1)', toCents(0.1), 10);
    check('toCents(0.2)', toCents(0.2), 20);
    check('add(toCents(0.1), toCents(0.2)) === toCents(0.3)', add(toCents(0.1), toCents(0.2)), toCents(0.3));
    check('format(add(toCents(0.1), toCents(0.2)))', format(add(toCents(0.1), toCents(0.2))), '$0.30');

    // mul: redondeo half-up y casos donde el float "crudo" seria impreciso
    check('mul(300, 1/3)', mul(300, 1 / 3), 100); // 300 * 0.3333... = 99.999999999999... -> 100
    check('mul(1050, 1.1)', mul(1050, 1.1), 1155); // 1050*1.1 = 1155.0000000000002 en float
    check('mul(5, 2.5) half up', mul(5, 2.5), 13); // 12.5 -> 13 (half away de cero)
    check('mul(-250, 0.5)', mul(-250, 0.5), -125);

    // div: redondeo half-up, incluye casos .5 exactos y negativos
    check('div(10, 4) === 3 (2.5 half up)', div(10, 4), 3);
    check('div(-10, 4) === -3 (-2.5 half up)', div(-10, 4), -3);
    check('div(100, 3)', div(100, 3), 33);
    check('div(200, 3)', div(200, 3), 67);
    checkThrows('div(100, 0) lanza Error', function () { div(100, 0); });
    checkThrows('div(100, -5) lanza Error', function () { div(100, -5); });

    // format
    check('format(123456)', format(123456), '$1,234.56');
    check('format(-4500)', format(-4500), '-$45.00');
    check('format(0)', format(0), '$0.00');
    check('format(100000000)', format(100000000), '$1,000,000.00');

    // parse
    check('parse("$1,234.56")', parse('$1,234.56'), 123456);
    check('parse("")', parse(''), 0);
    check('parse("1234.5")', parse('1234.5'), 123450);
    check('parse("1,200")', parse('1,200'), 120000);
    check('parse("abc")', parse('abc'), 0);
    check('parse(undefined)', parse(undefined), 0);
    check('parse("-45.00")', parse('-45.00'), -4500);
    check('parse("(45.00)")', parse('(45.00)'), -4500);
    check('parse(format(123456)) round-trip', parse(format(123456)), 123456);

    // toCents / fromCents
    check('toCents(19.99)', toCents(19.99), 1999);
    r.checkClose('fromCents(1999) ~= 19.99', fromCents(1999), 19.99);
    r.checkClose('fromCents(-4500) ~= -45', fromCents(-4500), -45);

    return r.results;
  }

  window.App.money = {
    add: add,
    sub: sub,
    mul: mul,
    div: div,
    format: format,
    parse: parse,
    toCents: toCents,
    fromCents: fromCents,
    __runTests: moneyRunTests
  };

  // ---------------------------------------------------------------------
  // window.App.date
  // ---------------------------------------------------------------------

  // Frecuencias de paso fijo en dias (no dependen de duracion de mes).
  var WEEKLY_STEP_DAYS = {
    semanal: 7,
    quincenal: 14
  };

  // Frecuencias de paso en meses (requieren logica calendario, con
  // ajuste de fin de mes).
  var MONTHLY_STEP_MONTHS = {
    mensual: 1,
    trimestral: 3,
    anual: 12
  };

  function today() {
    var d = new Date();
    return pad4(d.getFullYear()) + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  /**
   * Parsea un ISO 'YYYY-MM-DD' a un objeto Date anclado a mediodia UTC.
   * Anclar a mediodia UTC evita que un `new Date(isoString)` seguido de
   * operaciones en zona horaria local desplace el dia (bug clasico de
   * "se corre un dia" cerca de medianoche o con UTC negativo).
   */
  function parseISO(iso) {
    var parts = String(iso).split('-');
    var y = Number(parts[0]);
    var m = Number(parts[1]);
    var d = Number(parts[2]);
    return new Date(Date.UTC(y, m - 1, d, 12, 0, 0));
  }

  /**
   * Convierte un objeto Date (se asume anclado consistentemente, p.ej.
   * via parseISO) a un string ISO 'YYYY-MM-DD', leyendo SIEMPRE los
   * componentes UTC (nunca los locales) para mantener el mismo anclaje.
   */
  function toISO(date) {
    return pad4(date.getUTCFullYear()) + '-' + pad2(date.getUTCMonth() + 1) + '-' + pad2(date.getUTCDate());
  }

  function addDays(iso, n) {
    var d = parseISO(iso);
    d.setUTCDate(d.getUTCDate() + n);
    return toISO(d);
  }

  function daysInMonth(y, mZeroIndexed) {
    // Dia 0 del mes siguiente == ultimo dia del mes actual.
    return new Date(Date.UTC(y, mZeroIndexed + 1, 0)).getUTCDate();
  }

  function addMonths(iso, n) {
    var parts = String(iso).split('-');
    var y = Number(parts[0]);
    var m = Number(parts[1]); // 1-12
    var day = Number(parts[2]);

    var totalMonths = (y * 12 + (m - 1)) + n;
    var newY = Math.floor(totalMonths / 12);
    var newM0 = totalMonths - newY * 12; // 0-11
    var maxDay = daysInMonth(newY, newM0);
    var newDay = Math.min(day, maxDay);

    return pad4(newY) + '-' + pad2(newM0 + 1) + '-' + pad2(newDay);
  }

  function startOfWeek(iso, weekStartsOn) {
    var dow = parseISO(iso).getUTCDay(); // 0=domingo .. 6=sabado
    var diff = (dow - weekStartsOn + 7) % 7;
    return addDays(iso, -diff);
  }

  function diffDays(isoA, isoB) {
    var a = parseISO(isoA).getTime();
    var b = parseISO(isoB).getTime();
    return Math.round((b - a) / 86400000);
  }

  /**
   * Encuentra el entero k mas pequeno tal que
   * addMonths(anchorISO, k * stepMonths) >= onOrAfterISO.
   * Usado internamente por nextOccurrence/occurrencesBetween para
   * frecuencias mensual/trimestral/anual.
   */
  function findFirstMonthlyK(onOrAfterISO, stepMonths, anchorISO) {
    var anchorParts = String(anchorISO).split('-');
    var onParts = String(onOrAfterISO).split('-');
    var anchorTotalMonths = Number(anchorParts[0]) * 12 + (Number(anchorParts[1]) - 1);
    var onTotalMonths = Number(onParts[0]) * 12 + (Number(onParts[1]) - 1);
    var deltaMonths = onTotalMonths - anchorTotalMonths;

    // Punto de partida con un paso extra de margen hacia atras, para
    // absorber cualquier corrimiento causado por el "clamp" de fin de mes.
    var k = Math.floor(deltaMonths / stepMonths) - 1;
    var candidate = addMonths(anchorISO, k * stepMonths);
    while (candidate < onOrAfterISO) {
      k++;
      candidate = addMonths(anchorISO, k * stepMonths);
    }
    return k;
  }

  function nextOccurrence(onOrAfterISO, frequency, anchorISO) {
    var stepDays = WEEKLY_STEP_DAYS[frequency];
    if (stepDays) {
      var diff = diffDays(anchorISO, onOrAfterISO); // onOrAfter - anchor, en dias
      var k = Math.ceil(diff / stepDays);
      return addDays(anchorISO, k * stepDays);
    }

    var stepMonths = MONTHLY_STEP_MONTHS[frequency];
    if (stepMonths) {
      var km = findFirstMonthlyK(onOrAfterISO, stepMonths, anchorISO);
      return addMonths(anchorISO, km * stepMonths);
    }

    throw new Error('nextOccurrence: frecuencia no soportada: ' + frequency);
  }

  /**
   * Cuenta las ocurrencias reales (calendario a calendario, NUNCA una
   * division ingenua de dias totales) de un evento recurrente en
   * [startISOInclusive, endISOExclusive), anclado en anchorISO.
   */
  function occurrencesBetween(startISOInclusive, endISOExclusive, frequency, anchorISO) {
    var stepDays = WEEKLY_STEP_DAYS[frequency];
    if (stepDays) {
      // Las ocurrencias son exactamente anchor + k*stepDays para todo k
      // entero. Se cuenta cuantos k satisfacen:
      //   start <= anchor + k*step < end
      //   <=>  diffStart <= k*step < diffEnd
      var diffStart = diffDays(anchorISO, startISOInclusive);
      var diffEnd = diffDays(anchorISO, endISOExclusive);
      var kMin = Math.ceil(diffStart / stepDays);
      var kMax = Math.ceil(diffEnd / stepDays) - 1;
      return Math.max(0, kMax - kMin + 1);
    }

    var stepMonths = MONTHLY_STEP_MONTHS[frequency];
    if (stepMonths) {
      var k = findFirstMonthlyK(startISOInclusive, stepMonths, anchorISO);
      var count = 0;
      var candidate = addMonths(anchorISO, k * stepMonths);
      while (candidate < endISOExclusive) {
        count++;
        k++;
        candidate = addMonths(anchorISO, k * stepMonths);
      }
      return count;
    }

    throw new Error('occurrencesBetween: frecuencia no soportada: ' + frequency);
  }

  function dateRunTests() {
    var r = createRunner();
    var check = r.check;

    // addDays
    check('addDays("2026-01-01", 1)', addDays('2026-01-01', 1), '2026-01-02');
    check('addDays("2026-01-01", -1)', addDays('2026-01-01', -1), '2025-12-31');
    check('addDays("2026-02-28", 1) (2026 no bisiesto)', addDays('2026-02-28', 1), '2026-03-01');
    check('addDays("2024-02-28", 1) (2024 bisiesto)', addDays('2024-02-28', 1), '2024-02-29');

    // toISO / parseISO round-trip
    check('toISO(parseISO(iso)) round-trip', toISO(parseISO('2026-09-13')), '2026-09-13');

    // addMonths: 31 de enero + 1 mes = 28 o 29 de febrero (NUNCA 3 de marzo)
    check('addMonths("2023-01-31", 1) -> Feb no bisiesto', addMonths('2023-01-31', 1), '2023-02-28');
    check('addMonths("2024-01-31", 1) -> Feb bisiesto', addMonths('2024-01-31', 1), '2024-02-29');
    check('addMonths("2023-01-31", -1) -> Dic anterior', addMonths('2023-01-31', -1), '2022-12-31');
    check('addMonths("2023-03-31", 1) -> Abril tiene 30 dias', addMonths('2023-03-31', 1), '2023-04-30');
    check('addMonths("2023-05-15", 3)', addMonths('2023-05-15', 3), '2023-08-15');
    check('addMonths("2023-05-15", 12)', addMonths('2023-05-15', 12), '2024-05-15');

    // diffDays
    check('diffDays("2026-01-01","2026-01-11")', diffDays('2026-01-01', '2026-01-11'), 10);
    check('diffDays("2026-01-11","2026-01-01") (negativo)', diffDays('2026-01-11', '2026-01-01'), -10);

    // startOfWeek: 2023-01-01 es domingo (dato conocido/verificable).
    check('startOfWeek("2023-01-01", 0) (domingo, ya es inicio)', startOfWeek('2023-01-01', 0), '2023-01-01');
    check('startOfWeek("2023-01-01", 1) (inicio lunes -> 2022-12-26)', startOfWeek('2023-01-01', 1), '2022-12-26');
    check(
      'startOfWeek weekStartsOn=0 vs 1 difieren para la misma fecha',
      startOfWeek('2023-01-01', 0) !== startOfWeek('2023-01-01', 1),
      true
    );

    // occurrencesBetween: mayo 2023 tiene 5 lunes (1,8,15,22,29) -- el
    // ancla es un lunes (2023-05-01). Verifica conteo calendario real,
    // no una division ingenua de dias/7 (que daria 4 en un mes de 31 dias).
    check(
      'occurrencesBetween semanal: mayo 2023 tiene 5 lunes',
      occurrencesBetween('2023-05-01', '2023-06-01', 'semanal', '2023-05-01'),
      5
    );
    // abril 2023 (30 dias, mismo ancla lunes) tiene solo 4 lunes: 3,10,17,24.
    check(
      'occurrencesBetween semanal: abril 2023 tiene 4 lunes',
      occurrencesBetween('2023-04-03', '2023-05-01', 'semanal', '2023-05-01'),
      4
    );

    // quincenal: del 2023-05-01 al 2023-07-01 (61 dias), ancla 2023-05-01
    // ocurrencias: 05-01, 05-15, 05-29, 06-12, 06-26 = 5
    check(
      'occurrencesBetween quincenal',
      occurrencesBetween('2023-05-01', '2023-07-01', 'quincenal', '2023-05-01'),
      5
    );

    // mensual: ancla en fin de mes (31 de enero), enero-mayo 2023
    // ocurrencias esperadas: ene31, feb28, mar31, abr30 = 4 (mayo31 no incluido, exclusivo)
    check(
      'occurrencesBetween mensual con ancla en fin de mes',
      occurrencesBetween('2023-01-31', '2023-05-31', 'mensual', '2023-01-31'),
      4
    );

    // trimestral: un anio completo con ancla trimestral = 4 ocurrencias
    check(
      'occurrencesBetween trimestral en un anio',
      occurrencesBetween('2023-01-15', '2024-01-15', 'trimestral', '2023-01-15'),
      4
    );

    // anual: 5 anios consecutivos = 5 ocurrencias
    check(
      'occurrencesBetween anual en 5 anios',
      occurrencesBetween('2023-06-01', '2028-06-01', 'anual', '2023-06-01'),
      5
    );

    // nextOccurrence semanal
    check(
      'nextOccurrence semanal desde miercoles -> siguiente lunes',
      nextOccurrence('2023-05-03', 'semanal', '2023-05-01'),
      '2023-05-08'
    );
    check(
      'nextOccurrence semanal onOrAfter == ancla (inclusive)',
      nextOccurrence('2023-05-01', 'semanal', '2023-05-01'),
      '2023-05-01'
    );

    // nextOccurrence mensual con ajuste de fin de mes
    check(
      'nextOccurrence mensual desde fin de enero',
      nextOccurrence('2023-02-01', 'mensual', '2023-01-31'),
      '2023-02-28'
    );

    return r.results;
  }

  window.App.date = {
    today: today,
    parseISO: parseISO,
    toISO: toISO,
    addDays: addDays,
    addMonths: addMonths,
    startOfWeek: startOfWeek,
    diffDays: diffDays,
    occurrencesBetween: occurrencesBetween,
    nextOccurrence: nextOccurrence,
    __runTests: dateRunTests
  };
})();

</script>
<script>
/* ===== modules/reservas.js ===== */
/**
 * reservas.js
 *
 * Modulo de "reservas para facturas" y "disponible para gastar" de la app
 * de finanzas personales. JS plano, sin dependencias, pensado para
 * cargarse via <script> tag (sin build step, sin import/export ES6).
 *
 * Depende de window.App.money y window.App.date (definidos en otro
 * archivo cargado antes que este). Nunca se reimplementan ni redefinen
 * aqui: solo se llaman.
 *
 * Todas las funciones son PURAS: reciben AppState como argumento y jamas
 * lo mutan, ni tocan el DOM ni localStorage. Solo retornan resultados de
 * calculo.
 *
 * Todas las cantidades de dinero son enteros en centavos. Todas las
 * fechas son strings ISO 'YYYY-MM-DD'.
 */

window.App = window.App || {};
window.App.calc = window.App.calc || {};

(function () {
  'use strict';

  // -----------------------------------------------------------------------
  // Mini test runner casero (local a este archivo, sin librerias externas).
  // Mismo formato de resultado {pass, fail, failures} que usan money.js /
  // date.js, para que un futuro panel de pruebas pueda tratarlos igual.
  // -----------------------------------------------------------------------

  function createRunner() {
    var results = { pass: 0, fail: 0, failures: [] };
    function check(name, actual, expected) {
      var ok;
      try {
        ok = JSON.stringify(actual) === JSON.stringify(expected);
      } catch (e) {
        ok = actual === expected;
      }
      if (ok) {
        results.pass++;
      } else {
        results.fail++;
        results.failures.push({ name: name, expected: expected, actual: actual });
      }
    }
    function checkTrue(name, condition, details) {
      if (condition) {
        results.pass++;
      } else {
        results.fail++;
        results.failures.push({ name: name, expected: 'condicion verdadera', actual: details });
      }
    }
    return { results: results, check: check, checkTrue: checkTrue };
  }

  // -----------------------------------------------------------------------
  // Helpers internos compartidos (no se exportan).
  // -----------------------------------------------------------------------

  /**
   * Cuenta el total de ocurrencias reales de ingreso (sumando TODAS las
   * incomeSources del usuario, cada una con su propia frecuencia/ancla)
   * en la ventana [startISOInclusive, endISOExclusive). Si el usuario
   * tiene mas de una fuente de ingreso, cada deposito cuenta por separado
   * (dos fuentes que caen el mismo dia son dos cobros distintos, no uno).
   *
   * Delega el conteo calendario real a App.date.occurrencesBetween —
   * nunca se hace una division ingenua de dias.
   */
  function countIncomeOccurrences(appState, startISOInclusive, endISOExclusive) {
    var date = window.App.date;
    var sources = (appState && appState.incomeSources) || [];
    // Se cuentan FECHAS DE COBRO DISTINTAS, no depositos. Dos fuentes que
    // caen el mismo dia son UNA sola oportunidad de reservar, no dos: si
    // se sumaran, tener dos ingresos (o una fuente duplicada por error)
    // inflaria el conteo al doble y partiria la reserva a la mitad.
    var dates = {};
    var SAFETY_LIMIT = 500;
    for (var i = 0; i < sources.length; i++) {
      var src = sources[i];
      if (!src || !src.frequency || !src.nextDateISO) {
        continue;
      }
      var cursor = startISOInclusive;
      var guard = 0;
      while (guard++ < SAFETY_LIMIT) {
        var occ;
        try {
          occ = date.nextOccurrence(cursor, src.frequency, src.nextDateISO);
        } catch (e) {
          // Frecuencia irregular o no soportada: no se puede programar,
          // se omite esta fuente en vez de tumbar toda la pantalla.
          break;
        }
        if (!occ || occ >= endISOExclusive) break;
        dates[occ] = true;
        var next = date.addDays(occ, 1);
        if (next <= cursor) break; // sin avance: evita un bucle infinito
        cursor = next;
      }
    }
    return Object.keys(dates).length;
  }

  /**
   * Fecha ISO del proximo cobro conocido, on-or-after refISO, considerando
   * todas las incomeSources (se toma la mas cercana). Retorna null si no
   * hay ninguna fuente de ingreso configurada.
   */
  function nextIncomeISO(appState, refISO) {
    var date = window.App.date;
    var sources = (appState && appState.incomeSources) || [];
    var best = null;
    for (var i = 0; i < sources.length; i++) {
      var src = sources[i];
      if (!src || !src.frequency || !src.nextDateISO) {
        continue;
      }
      var occ = null;
      try {
        occ = date.nextOccurrence(refISO, src.frequency, src.nextDateISO);
      } catch (e) {
        continue; // frecuencia irregular: no se puede predecir el cobro
      }
      if (occ && (best === null || occ < best)) {
        best = occ;
      }
    }
    return best;
  }

  function pad2(n) {
    return (n < 10 ? '0' : '') + n;
  }

  /**
   * Calcula la proxima fecha de vencimiento (ISO) de una deuda a partir de
   * su `dueDay` (dia del mes), on-or-after refISO. Este calculo NO forma
   * parte del contrato de App.date (que solo trabaja con anclas ISO +
   * frecuencia), asi que se resuelve aqui con aritmetica de calendario
   * pura (via Date.UTC, solo para normalizar desbordes de mes/anio -- no
   * es una reimplementacion de la logica de negocio de App.date).
   */
  function nextDebtDueISO(debt, refISO) {
    if (!debt || !debt.dueDay) {
      return null;
    }
    var parts = String(refISO).split('-');
    var year = Number(parts[0]);
    var month = Number(parts[1]); // 1-12

    function buildISO(y, mOneIndexed, day) {
      var d = new Date(Date.UTC(y, mOneIndexed - 1, day));
      return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate());
    }

    var candidate = buildISO(year, month, debt.dueDay);
    if (candidate < refISO) {
      candidate = buildISO(year, month + 1, debt.dueDay);
    }
    return candidate;
  }

  /**
   * Saldo liquido actual: suma de cuentas tipo 'banco' y 'efectivo'
   * (initialBalanceCents) mas transacciones CONFIRMADAS con dateISO <=
   * asOfISO que las afectan. Las tarjetas de credito (y su limite) NUNCA
   * se incluyen aqui.
   */
  function computeLiquidBalance(appState, asOfISO) {
    var money = window.App.money;
    var accounts = (appState && appState.accounts) || [];
    var liquidIds = {};
    var total = 0;

    for (var i = 0; i < accounts.length; i++) {
      var acc = accounts[i];
      if (!acc || acc.archived) {
        continue;
      }
      if (acc.kind === 'banco' || acc.kind === 'efectivo') {
        liquidIds[acc.id] = true;
        total = money.add(total, acc.initialBalanceCents || 0);
      }
    }

    var txs = (appState && appState.transactions) || [];
    for (var j = 0; j < txs.length; j++) {
      var tx = txs[j];
      if (!tx || tx.status !== 'confirmado') {
        continue;
      }
      if (!tx.dateISO || tx.dateISO > asOfISO) {
        continue;
      }

      var amt = tx.amountCents || 0;

      if (tx.type === 'ingreso' || tx.type === 'reembolso') {
        if (liquidIds[tx.accountId]) {
          total = money.add(total, amt);
        }
      } else if (tx.type === 'gasto') {
        if (liquidIds[tx.accountId]) {
          total = money.sub(total, amt);
        }
      } else if (tx.type === 'transferencia') {
        if (liquidIds[tx.accountId]) {
          total = money.sub(total, amt);
        }
        if (liquidIds[tx.toAccountId]) {
          total = money.add(total, amt);
        }
      }
    }

    return total;
  }

  /**
   * Dinero de metas que sigue fisicamente en cuentas liquidas pero esta
   * comprometido (savedCents de cada goal). Se suma tal cual: el schema
   * no asocia cada goal a una cuenta especifica, asi que se asume que el
   * ahorro acumulado de todas las metas vive dentro del saldo liquido
   * general y debe protegerse de gastarse.
   */
  function computeProtectedGoalsCents(appState) {
    var money = window.App.money;
    var goals = (appState && appState.goals) || [];
    var total = 0;
    for (var i = 0; i < goals.length; i++) {
      var g = goals[i];
      if (!g) {
        continue;
      }
      total = money.add(total, g.savedCents || 0);
    }
    return total;
  }

  /**
   * Compromisos aun no cubiertos hasta el siguiente cobro, SOLO de deudas
   * (pagos minimos). Los recurringExpenses con vencimiento antes del
   * proximo ingreso ya quedan reflejados por completo dentro de
   * pendingReservesCents (computeReserveForExpense fuerza
   * reserveCentsPerPaycheck = remainingCents cuando occurrencesRemaining
   * es 0), asi que NO se vuelven a sumar aqui para evitar el doble conteo
   * que pide evitar el enunciado.
   */
  function computeUncoveredDebtCommitments(appState, todayISO) {
    var money = window.App.money;
    var nextInc = nextIncomeISO(appState, todayISO);
    if (!nextInc) {
      // Sin ninguna fuente de ingreso conocida no hay forma de acotar la
      // ventana "hasta el proximo cobro"; no se estima un compromiso sin
      // base real.
      return 0;
    }

    var debts = (appState && appState.debts) || [];
    var total = 0;
    for (var i = 0; i < debts.length; i++) {
      var debt = debts[i];
      if (!debt || !debt.dueDay) {
        continue;
      }
      var dueISO = nextDebtDueISO(debt, todayISO);
      if (dueISO && dueISO < nextInc) {
        total = money.add(total, debt.minPaymentCents || 0);
      }
    }
    return total;
  }

  // -----------------------------------------------------------------------
  // 1. computeReserveForExpense
  // -----------------------------------------------------------------------

  function computeReserveForExpense(recurringExpense, todayISO, appState) {
    var money = window.App.money;
    var date = window.App.date;

    if (!recurringExpense) {
      return {
        reserveCentsPerPaycheck: 0,
        warning: 'Gasto recurrente invalido o ausente.',
        remainingCents: 0,
        occurrencesRemaining: 0
      };
    }

    var name = recurringExpense.name || 'este gasto';
    var amountCents = recurringExpense.amountCents || 0;
    var reservedCents = recurringExpense.reservedCents || 0;
    var dueDateISO = recurringExpense.nextDueDateISO;

    var rawRemaining = money.sub(amountCents, reservedCents);
    var remainingCents = rawRemaining > 0 ? rawRemaining : 0;

    // Ya esta completamente cubierto por lo reservado: nada que hacer.
    if (remainingCents === 0) {
      return { reserveCentsPerPaycheck: 0, warning: null, remainingCents: 0, occurrencesRemaining: 0 };
    }

    if (!dueDateISO) {
      return {
        reserveCentsPerPaycheck: remainingCents,
        warning: 'El gasto "' + name + '" no tiene fecha de vencimiento definida; no se puede prorratear entre cobros.',
        remainingCents: remainingCents,
        occurrencesRemaining: 0
      };
    }

    // Si el vencimiento es hoy o ya paso, no hay margen para prorratear.
    var daysToDue = date.diffDays(todayISO, dueDateISO); // dueDateISO - todayISO
    if (daysToDue <= 0) {
      return {
        reserveCentsPerPaycheck: remainingCents,
        warning: 'El gasto "' + name + '" vence el ' + dueDateISO + ' (hoy o ya vencido). ' +
          'Debes cubrir ' + money.format(remainingCents) + ' YA; no se puede prorratear entre cobros futuros.',
        remainingCents: remainingCents,
        occurrencesRemaining: 0
      };
    }

    var occurrencesRemaining = countIncomeOccurrences(appState, todayISO, dueDateISO);

    // Un gasto mensual cuyo vencimiento esta a varios meses casi siempre
    // significa una fecha mal capturada. Sin este aviso el conteo de
    // cobros se dispara y la reserva por cobro sale demasiado baja.
    var PERIOD_DAYS = { semanal: 7, quincenal: 14, mensual: 31, anual: 366 };
    var expected = PERIOD_DAYS[recurringExpense.frequency];
    var farOffWarning = null;
    if (expected && daysToDue > expected * 1.6) {
      farOffWarning = 'El gasto "' + name + '" es ' + recurringExpense.frequency +
        ' pero su próximo vencimiento es el ' + dueDateISO + ', a ' + daysToDue +
        ' días. Revisa esa fecha: si está equivocada, los cobros restantes salen inflados y la reserva por cobro demasiado baja.';
    }

    if (occurrencesRemaining <= 0) {
      return {
        reserveCentsPerPaycheck: remainingCents,
        warning: 'El gasto "' + name + '" vence el ' + dueDateISO + ', antes de tu próximo cobro disponible. ' +
          'Debes cubrir ' + money.format(remainingCents) + ' YA; no se puede prorratear.',
        remainingCents: remainingCents,
        occurrencesRemaining: 0
      };
    }

    var reserveCentsPerPaycheck = money.div(remainingCents, occurrencesRemaining);

    return {
      reserveCentsPerPaycheck: reserveCentsPerPaycheck,
      warning: farOffWarning,
      remainingCents: remainingCents,
      occurrencesRemaining: occurrencesRemaining
    };
  }

  // -----------------------------------------------------------------------
  // 2. computeAllReserves
  // -----------------------------------------------------------------------

  function computeAllReserves(appState, todayISO) {
    var money = window.App.money;
    var expenses = (appState && appState.recurringExpenses) || [];
    var perExpense = [];
    var totalReserveCentsThisPeriod = 0;

    for (var i = 0; i < expenses.length; i++) {
      var exp = expenses[i];
      if (!exp) {
        continue;
      }
      var result = computeReserveForExpense(exp, todayISO, appState);
      perExpense.push({
        expenseId: exp.id,
        name: exp.name,
        reserveCentsPerPaycheck: result.reserveCentsPerPaycheck,
        warning: result.warning,
        remainingCents: result.remainingCents,
        occurrencesRemaining: result.occurrencesRemaining
      });
      totalReserveCentsThisPeriod = money.add(totalReserveCentsThisPeriod, result.reserveCentsPerPaycheck);
    }

    return {
      perExpense: perExpense,
      totalReserveCentsThisPeriod: totalReserveCentsThisPeriod
    };
  }

  // -----------------------------------------------------------------------
  // Tests de window.App.calc.reserves
  // -----------------------------------------------------------------------

  function reservesRunTests() {
    var r = createRunner();
    var money = window.App.money;

    // ---- Caso exacto del producto -----------------------------------
    // Factura $120.00, $40.00 ya reservados, quedan 2 cobros antes del
    // vencimiento -> reservar exactamente $40.00 por cobro.
    (function () {
      // today = 2026-01-02 (no 01) para no coincidir exactamente con una
      // ocurrencia del ancla quincenal (2026-01-15 - 14d = 2026-01-01),
      // lo que inflaria el conteo real de cobros restantes.
      var today = '2026-01-02';
      var appState = {
        incomeSources: [
          { id: 'inc1', name: 'Salario', kind: 'fijo', expectedAmountCents: 100000, frequency: 'quincenal', nextDateISO: '2026-01-15', accountId: 'acc1' }
        ]
      };
      var expense = {
        id: 'exp1', name: 'Factura de luz', amountCents: 12000, frequency: 'mensual',
        nextDueDateISO: '2026-02-01', accountId: 'acc1', categoryId: 'cat1', reservedCents: 4000
      };
      // Ocurrencias reales de "inc1" en [2026-01-02, 2026-02-01): 01-15 y
      // 01-29 = 2 cobros (verificado contra App.date.occurrencesBetween).
      var result = computeReserveForExpense(expense, today, appState);
      r.check('Caso exacto: occurrencesRemaining === 2', result.occurrencesRemaining, 2);
      r.check('Caso exacto: reserveCentsPerPaycheck === $40.00 (4000)', result.reserveCentsPerPaycheck, 4000);
      r.check('Caso exacto: remainingCents === 8000', result.remainingCents, 8000);
      r.check('Caso exacto: sin advertencia', result.warning, null);
    })();

    // ---- Vencimiento ANTES del proximo cobro -> advertencia --------
    (function () {
      var today = '2026-01-01';
      var appState = {
        incomeSources: [
          { id: 'inc1', name: 'Salario', kind: 'fijo', expectedAmountCents: 100000, frequency: 'mensual', nextDateISO: '2026-01-15', accountId: 'acc1' }
        ]
      };
      var expense = {
        id: 'exp2', name: 'Seguro del carro', amountCents: 15000, frequency: 'mensual',
        nextDueDateISO: '2026-01-05', accountId: 'acc1', categoryId: 'cat1', reservedCents: 5000
      };
      var result = computeReserveForExpense(expense, today, appState);
      r.check('Vence antes del cobro: occurrencesRemaining === 0', result.occurrencesRemaining, 0);
      r.checkTrue('Vence antes del cobro: hay advertencia explicita', typeof result.warning === 'string' && result.warning.length > 0, result.warning);
      r.check('Vence antes del cobro: remainingCents === 10000 (falta cubrir YA)', result.remainingCents, 10000);
      r.check('Vence antes del cobro: reserveCentsPerPaycheck === remainingCents (no se prorratea)', result.reserveCentsPerPaycheck, 10000);
    })();

    // ---- Mes con 5 cobros semanales vs mes con 4 cobros semanales ---
    // Ancla semanal: 2026-01-02 es viernes.
    // Ventana [2026-01-02, 2026-02-02): viernes 02,09,16,23,30 => 5 cobros.
    // Ventana [2026-02-02, 2026-03-02): viernes 06,13,20,27 => 4 cobros.
    (function () {
      var anchor = '2026-01-02';
      var appStateMasCobros = { incomeSources: [{ id: 'inc1', frequency: 'semanal', nextDateISO: anchor, expectedAmountCents: 50000, accountId: 'acc1' }] };
      var expenseMasCobros = {
        id: 'exp3a', name: 'Renta', amountCents: 100000, frequency: 'mensual',
        nextDueDateISO: '2026-02-02', accountId: 'acc1', categoryId: 'cat1', reservedCents: 0
      };
      var resultMasCobros = computeReserveForExpense(expenseMasCobros, '2026-01-02', appStateMasCobros);

      var appStateMenosCobros = { incomeSources: [{ id: 'inc1', frequency: 'semanal', nextDateISO: anchor, expectedAmountCents: 50000, accountId: 'acc1' }] };
      var expenseMenosCobros = {
        id: 'exp3b', name: 'Renta', amountCents: 100000, frequency: 'mensual',
        nextDueDateISO: '2026-03-02', accountId: 'acc1', categoryId: 'cat1', reservedCents: 0
      };
      var resultMenosCobros = computeReserveForExpense(expenseMenosCobros, '2026-02-02', appStateMenosCobros);

      r.check('Mes de 5 cobros: occurrencesRemaining === 5', resultMasCobros.occurrencesRemaining, 5);
      r.check('Mes de 4 cobros: occurrencesRemaining === 4', resultMenosCobros.occurrencesRemaining, 4);
      r.checkTrue(
        'Reserva por cobro es MENOR cuando hay mas cobros disponibles en el mes (5 < 4)',
        resultMasCobros.reserveCentsPerPaycheck < resultMenosCobros.reserveCentsPerPaycheck,
        '5 cobros=' + resultMasCobros.reserveCentsPerPaycheck + ' vs 4 cobros=' + resultMenosCobros.reserveCentsPerPaycheck
      );
      r.check('Mes de 5 cobros: reserveCentsPerPaycheck === 20000 ($200.00)', resultMasCobros.reserveCentsPerPaycheck, 20000);
      r.check('Mes de 4 cobros: reserveCentsPerPaycheck === 25000 ($250.00)', resultMenosCobros.reserveCentsPerPaycheck, 25000);
    })();

    // ---- computeAllReserves: suma correcta sobre varios gastos ------
    (function () {
      var today = '2026-01-01';
      var appState = {
        incomeSources: [
          { id: 'inc1', frequency: 'mensual', nextDateISO: '2026-01-15', expectedAmountCents: 200000, accountId: 'acc1' }
        ],
        recurringExpenses: [
          { id: 'expA', name: 'Internet', amountCents: 6000, frequency: 'mensual', nextDueDateISO: '2026-02-15', accountId: 'acc1', categoryId: 'cat1', reservedCents: 0 },
          { id: 'expB', name: 'Streaming', amountCents: 2000, frequency: 'mensual', nextDueDateISO: '2026-02-15', accountId: 'acc1', categoryId: 'cat1', reservedCents: 2000 }
        ]
      };
      // occurrencesBetween(2026-01-01, 2026-02-15, 'mensual', 2026-01-15) = solo 2026-01-15 = 1
      var all = computeAllReserves(appState, today);
      r.check('computeAllReserves: 2 gastos en perExpense', all.perExpense.length, 2);
      r.check('computeAllReserves: expB ya cubierto -> reserva 0', all.perExpense[1].reserveCentsPerPaycheck, 0);
      r.check('computeAllReserves: expA con 1 cobro -> reserva completa (6000)', all.perExpense[0].reserveCentsPerPaycheck, 6000);
      r.check('computeAllReserves: total = 6000 + 0', all.totalReserveCentsThisPeriod, 6000);
    })();

    return r.results;
  }

  // -----------------------------------------------------------------------
  // 3. computeAvailableToSpend
  // -----------------------------------------------------------------------

  function computeAvailableToSpend(appState, todayISO) {
    var money = window.App.money;

    var liquidBalanceCents = computeLiquidBalance(appState, todayISO);
    var protectedGoalsCents = computeProtectedGoalsCents(appState);

    var reservesResult = computeAllReserves(appState, todayISO);
    var pendingReservesCents = reservesResult.totalReserveCentsThisPeriod;

    var cushionCents = (appState && appState.settings && appState.settings.cushionCents) || 0;

    // Solo deudas: los recurringExpenses que vencen antes del proximo
    // cobro ya quedan 100% reflejados dentro de pendingReservesCents (ver
    // computeUncoveredDebtCommitments para el detalle de por que no se
    // duplican aqui).
    var uncoveredCommitmentsCents = computeUncoveredDebtCommitments(appState, todayISO);

    var totalDeductions = 0;
    totalDeductions = money.add(totalDeductions, protectedGoalsCents);
    totalDeductions = money.add(totalDeductions, pendingReservesCents);
    totalDeductions = money.add(totalDeductions, cushionCents);
    totalDeductions = money.add(totalDeductions, uncoveredCommitmentsCents);

    // No se fuerza a 0: si el resultado es negativo, refleja un deficit
    // real que la UI debe poder mostrar y advertir.
    var availableCents = money.sub(liquidBalanceCents, totalDeductions);

    var breakdown = [
      { label: 'Saldo liquido (bancos + efectivo)', amountCents: liquidBalanceCents },
      { label: 'Protegido para metas', amountCents: money.mul(protectedGoalsCents, -1) },
      { label: 'Reservas pendientes para facturas', amountCents: money.mul(pendingReservesCents, -1) },
      { label: 'Colchon de seguridad', amountCents: money.mul(cushionCents, -1) },
      { label: 'Compromisos de deuda no cubiertos antes del próximo cobro', amountCents: money.mul(uncoveredCommitmentsCents, -1) },
      { label: 'Disponible para gastar', amountCents: availableCents }
    ];

    return {
      liquidBalanceCents: liquidBalanceCents,
      protectedGoalsCents: protectedGoalsCents,
      pendingReservesCents: pendingReservesCents,
      cushionCents: cushionCents,
      uncoveredCommitmentsCents: uncoveredCommitmentsCents,
      availableCents: availableCents,
      breakdown: breakdown
    };
  }

  // -----------------------------------------------------------------------
  // 4. computeProjectedBalance
  // -----------------------------------------------------------------------

  function computeProjectedBalance(appState, futureDateISO) {
    var money = window.App.money;
    var date = window.App.date;
    var todayISO = date.today();

    var projected = computeLiquidBalance(appState, todayISO);

    // El saldo liquido actual ya incluye todo lo confirmado hasta HOY. La
    // proyeccion solo debe sumar/restar movimientos ESPERADOS a partir de
    // manana, para no contar "hoy" dos veces.
    var windowStartISO = date.addDays(todayISO, 1);
    var windowEndExclusiveISO = date.addDays(futureDateISO, 1);

    if (windowEndExclusiveISO <= windowStartISO) {
      // futureDateISO es hoy o anterior: no hay ventana futura que proyectar.
      return { projectedBalanceCents: projected, isProjection: true, asOfISO: futureDateISO };
    }

    var sources = (appState && appState.incomeSources) || [];
    for (var i = 0; i < sources.length; i++) {
      var src = sources[i];
      if (!src || !src.frequency || !src.nextDateISO) {
        continue;
      }
      var incomeOcc = date.occurrencesBetween(windowStartISO, windowEndExclusiveISO, src.frequency, src.nextDateISO);
      if (incomeOcc > 0) {
        projected = money.add(projected, money.mul(src.expectedAmountCents || 0, incomeOcc));
      }
    }

    var expenses = (appState && appState.recurringExpenses) || [];
    for (var j = 0; j < expenses.length; j++) {
      var exp = expenses[j];
      if (!exp || !exp.frequency || !exp.nextDueDateISO) {
        continue;
      }
      var expenseOcc = date.occurrencesBetween(windowStartISO, windowEndExclusiveISO, exp.frequency, exp.nextDueDateISO);
      if (expenseOcc > 0) {
        projected = money.sub(projected, money.mul(exp.amountCents || 0, expenseOcc));
      }
    }

    var debts = (appState && appState.debts) || [];
    for (var k = 0; k < debts.length; k++) {
      var debt = debts[k];
      if (!debt || !debt.dueDay) {
        continue;
      }
      var count = 0;
      var cursorISO = windowStartISO;
      var guard = 0;
      while (guard < 1000) {
        var dueISO = nextDebtDueISO(debt, cursorISO);
        if (!dueISO || dueISO >= windowEndExclusiveISO) {
          break;
        }
        count++;
        cursorISO = date.addDays(dueISO, 1);
        guard++;
      }
      if (count > 0) {
        projected = money.sub(projected, money.mul(debt.minPaymentCents || 0, count));
      }
    }

    return { projectedBalanceCents: projected, isProjection: true, asOfISO: futureDateISO };
  }

  // -----------------------------------------------------------------------
  // Tests de window.App.calc.available
  // -----------------------------------------------------------------------

  function availableRunTests() {
    var r = createRunner();

    // ---- Metas + reservas comprometidas simultaneamente -------------
    // Verifica que ambas se restan UNA sola vez cada una (sin solaparse).
    (function () {
      // today = 2026-01-02 (no 01) para no coincidir exactamente con una
      // ocurrencia del ancla quincenal (2026-01-15 - 14d = 2026-01-01).
      var today = '2026-01-02';
      var appState = {
        settings: { currency: 'USD', locale: 'es-US', weekStartsOn: 0, cushionCents: 0 },
        accounts: [
          { id: 'bank1', name: 'Cuenta principal', kind: 'banco', initialBalanceCents: 500000, creditLimitCents: 0, archived: false }
        ],
        goals: [
          { id: 'g1', name: 'Vacaciones', kind: 'ahorro', targetCents: 200000, savedCents: 100000, targetDateISO: '2026-12-01', contributionFrequency: 'mensual' }
        ],
        incomeSources: [
          { id: 'inc1', name: 'Salario', kind: 'fijo', expectedAmountCents: 150000, frequency: 'quincenal', nextDateISO: '2026-01-15', accountId: 'bank1' }
        ],
        recurringExpenses: [
          { id: 'exp1', name: 'Internet', amountCents: 6000, frequency: 'mensual', nextDueDateISO: '2026-02-15', accountId: 'bank1', categoryId: 'cat1', reservedCents: 0 }
        ],
        debts: [],
        transactions: []
      };
      // Ocurrencias reales de "inc1" en [2026-01-02, 2026-02-15): 01-15,
      // 01-29, 02-12 = 3 cobros -> reserva = 6000/3 = 2000 por cobro.
      var result = computeAvailableToSpend(appState, today);
      r.check('Metas+reservas: liquidBalanceCents === 500000', result.liquidBalanceCents, 500000);
      r.check('Metas+reservas: protectedGoalsCents === 100000 (una sola vez)', result.protectedGoalsCents, 100000);
      r.check('Metas+reservas: pendingReservesCents === 2000 (6000/3, una sola vez)', result.pendingReservesCents, 2000);
      r.checkTrue(
        'Metas+reservas: availableCents = liquido - metas - reservas (sin doble descuento)',
        result.availableCents === 500000 - 100000 - 2000,
        'availableCents=' + result.availableCents + ' esperado=' + (500000 - 100000 - 2000)
      );
    })();

    // ---- Deuda + gasto recurrente antes del proximo cobro -----------
    // Verifica que el gasto recurrente (ya cubierto por completo dentro
    // de pendingReservesCents via la advertencia) NO se vuelve a sumar
    // en uncoveredCommitmentsCents; solo la deuda aparece ahi.
    (function () {
      var today = '2026-01-01';
      var appState = {
        settings: { currency: 'USD', locale: 'es-US', weekStartsOn: 0, cushionCents: 0 },
        accounts: [
          { id: 'bank1', name: 'Cuenta principal', kind: 'banco', initialBalanceCents: 1000000, creditLimitCents: 0, archived: false }
        ],
        goals: [],
        incomeSources: [
          { id: 'inc1', frequency: 'mensual', nextDateISO: '2026-01-30', expectedAmountCents: 200000, accountId: 'bank1' }
        ],
        recurringExpenses: [
          { id: 'exp1', name: 'Servicio urgente', amountCents: 8000, frequency: 'mensual', nextDueDateISO: '2026-01-10', accountId: 'bank1', categoryId: 'cat1', reservedCents: 2000 }
        ],
        debts: [
          { id: 'd1', name: 'Tarjeta de credito', minPaymentCents: 5000, dueDay: 5, accountId: 'bank1', frequency: 'mensual' }
        ],
        transactions: []
      };
      var result = computeAvailableToSpend(appState, today);
      r.check('Sin doble conteo: pendingReservesCents === 6000 (remainingCents completo del gasto)', result.pendingReservesCents, 6000);
      r.check('Sin doble conteo: uncoveredCommitmentsCents === 5000 (solo la deuda, no el gasto)', result.uncoveredCommitmentsCents, 5000);
      r.check('Sin doble conteo: availableCents = 1000000 - 6000 - 5000', result.availableCents, 1000000 - 6000 - 5000);
    })();

    // ---- Disponible NEGATIVO (deficit real, no forzado a 0) ---------
    (function () {
      var today = '2026-01-01';
      var appState = {
        settings: { currency: 'USD', locale: 'es-US', weekStartsOn: 0, cushionCents: 10000 },
        accounts: [
          { id: 'bank1', name: 'Cuenta principal', kind: 'banco', initialBalanceCents: 10000, creditLimitCents: 0, archived: false }
        ],
        goals: [
          { id: 'g1', name: 'Emergencia', kind: 'ahorro', targetCents: 50000, savedCents: 5000, targetDateISO: '2026-12-01', contributionFrequency: 'mensual' }
        ],
        incomeSources: [
          { id: 'inc1', frequency: 'mensual', nextDateISO: '2026-01-15', expectedAmountCents: 100000, accountId: 'bank1' }
        ],
        recurringExpenses: [
          { id: 'exp1', name: 'Renta', amountCents: 20000, frequency: 'mensual', nextDueDateISO: '2026-03-01', accountId: 'bank1', categoryId: 'cat1', reservedCents: 0 }
        ],
        debts: [],
        transactions: []
      };
      // occurrencesBetween(2026-01-01, 2026-03-01, mensual, 2026-01-15) = 2026-01-15, 2026-02-15 = 2
      // reserveCentsPerPaycheck = 20000/2 = 10000
      var result = computeAvailableToSpend(appState, today);
      var esperado = 10000 - 5000 - 10000 - 10000 - 0; // liquido - metas - reservas - colchon - deudas
      r.check('Deficit: availableCents es negativo y exacto (no se fuerza a 0)', result.availableCents, esperado);
      r.checkTrue('Deficit: availableCents < 0', result.availableCents < 0, result.availableCents);
    })();

    // ---- computeProjectedBalance: es una proyeccion, no el disponible actual ----
    (function () {
      var appState = {
        settings: { currency: 'USD', locale: 'es-US', weekStartsOn: 0, cushionCents: 0 },
        accounts: [
          { id: 'bank1', name: 'Cuenta principal', kind: 'banco', initialBalanceCents: 100000, creditLimitCents: 0, archived: false }
        ],
        goals: [],
        incomeSources: [
          { id: 'inc1', frequency: 'mensual', nextDateISO: '2026-01-15', expectedAmountCents: 200000, accountId: 'bank1' }
        ],
        recurringExpenses: [
          { id: 'exp1', name: 'Renta', amountCents: 50000, frequency: 'mensual', nextDueDateISO: '2026-01-20', accountId: 'bank1', categoryId: 'cat1', reservedCents: 0 }
        ],
        debts: [],
        transactions: []
      };
      // Nota: computeProjectedBalance usa date.today() internamente, asi
      // que este test solo verifica la forma del contrato (isProjection,
      // asOfISO) y que el resultado es un numero finito, sin asumir "hoy".
      var futureISO = window.App.date.addDays(window.App.date.today(), 45);
      var result = computeProjectedBalance(appState, futureISO);
      r.checkTrue('Proyeccion: isProjection === true', result.isProjection === true, result.isProjection);
      r.check('Proyeccion: asOfISO === futureDateISO', result.asOfISO, futureISO);
      r.checkTrue('Proyeccion: projectedBalanceCents es un numero finito', typeof result.projectedBalanceCents === 'number' && isFinite(result.projectedBalanceCents), result.projectedBalanceCents);
    })();

    return r.results;
  }

  // -----------------------------------------------------------------------
  // Exports (no se tocan otras claves de window.App.calc).
  // -----------------------------------------------------------------------

  window.App.calc.reserves = {
    computeReserveForExpense: computeReserveForExpense,
    computeAllReserves: computeAllReserves,
    __runTests: reservesRunTests
  };

  window.App.calc.available = {
    computeAvailableToSpend: computeAvailableToSpend,
    computeProjectedBalance: computeProjectedBalance,
    __runTests: availableRunTests
  };
})();

</script>
<script>
/* ===== modules/transacciones.js ===== */
/**
 * REGLAS CONTABLES DE TRANSACCIONES
 * ----------------------------------
 * Módulo JS plano (sin build step, sin import/export ES6). Se carga vía <script>.
 * No toca el DOM ni localStorage. Todas las funciones que "modifican" AppState
 * devuelven SIEMPRE una copia nueva (clon profundo); el AppState recibido nunca
 * se muta.
 *
 * Depende OPCIONALMENTE de window.App.date (solo si ya está cargado, para no
 * acoplar el orden de carga entre agentes). No depende de window.App.money:
 * este módulo trabaja siempre en centavos enteros y no necesita formatear ni
 * parsear moneda.
 *
 * Las 8 reglas contables del producto, y dónde viven en este archivo:
 *
 *  1) Una transferencia (type='transferencia') NUNCA es ingreso ni gasto:
 *     periodTotals() ignora explícitamente 'transferencia'. recomputeAccountBalances()
 *     sí mueve el balance: resta de accountId y suma a toAccountId.
 *
 *  2) Transferir a una cuenta de ahorro no reduce el dinero total del usuario
 *     (solo lo mueve de una cuenta a otra): al restar de accountId y sumar el
 *     mismo monto a toAccountId, la suma de todos los balances no cambia. Queda
 *     distinguible de un gasto real porque su type sigue siendo 'transferencia'
 *     (nunca 'gasto'), así que jamás se cuenta en expenseCents.
 *
 *  3) Asignar dinero a una meta (linkedGoalId) es una reserva lógica, no un
 *     movimiento bancario real: en TODO este módulo, linkedGoalId nunca se lee
 *     para mover balances ni para sumar/restar en periodTotals. Solo el campo
 *     `type` (ingreso/gasto/transferencia/reembolso) dispara movimiento de
 *     dinero. Si se quiere mover dinero real hacia una meta hace falta además
 *     una transacción explícita de type='transferencia'.
 *
 *  4) Comprar con tarjeta de crédito (accountId de kind='tarjeta_credito',
 *     type='gasto') resta del balance de esa cuenta igual que cualquier gasto;
 *     como no hay abono previo, el balance se vuelve negativo, lo cual
 *     representa la deuda (ver recomputeAccountBalances). Pagar la tarjeta se
 *     modela como type='transferencia' desde una cuenta líquida hacia la
 *     tarjeta: resta efectivo de la cuenta origen y SUMA al balance de la
 *     tarjeta (reduce la deuda). Es la misma lógica genérica de transferencia,
 *     por lo que el gasto original nunca se vuelve a registrar ni se duplica.
 *
 *  5) creditLimitCents NUNCA se lee en este archivo: ni recomputeAccountBalances
 *     ni periodTotals lo suman a ningún balance o total disponible.
 *
 *  6) Un reembolso (type='reembolso', reversesTxId -> gasto original) revierte
 *     el efecto de ese gasto en la MISMA cuenta del gasto original: en
 *     recomputeAccountBalances se busca la transacción original y se suma el
 *     monto del reembolso al balance de `original.accountId` (no al accountId
 *     del reembolso, salvo que la original ya no exista, caso en el que se usa
 *     el accountId del propio reembolso como respaldo).
 *
 *  7) initialBalanceCents de las cuentas NUNCA se lee en periodTotals: esa
 *     función solo recorre `transactions`, jamás `accounts`.
 *
 *  8) recomputeAccountBalances() es una función pura y sin caché: siempre
 *     recorre TODAS las transacciones confirmadas desde cero, en orden
 *     cronológico, hasta la fecha pedida. Por eso, tras editTransaction()
 *     (que solo reemplaza el registro editado, sin tocar balances), una
 *     nueva llamada a recomputeAccountBalances recalcula correctamente todos
 *     los balances posteriores a la fecha editada, no solo el balance final.
 */
(function () {
  'use strict';

  var VALID_TYPES = ['ingreso', 'gasto', 'transferencia', 'reembolso'];
  var VALID_STATUS = ['pendiente', 'confirmado'];

  // ---------------------------------------------------------------------
  // Helpers privados (no se exportan)
  // ---------------------------------------------------------------------

  function isPlainObject(v) {
    return v !== null && typeof v === 'object' && !Array.isArray(v);
  }

  function isNonEmptyString(v) {
    return typeof v === 'string' && v.trim().length > 0;
  }

  function isPositiveIntegerCents(v) {
    return typeof v === 'number' && isFinite(v) && Math.floor(v) === v && v > 0;
  }

  function isLeapYear(y) {
    return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
  }

  // Validación de fecha 'YYYY-MM-DD' autocontenida (no depende de window.App.date
  // para no acoplar el orden de carga entre módulos hermanos).
  function isValidISODate(str) {
    if (typeof str !== 'string') return false;
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str);
    if (!m) return false;
    var year = parseInt(m[1], 10);
    var month = parseInt(m[2], 10);
    var day = parseInt(m[3], 10);
    if (month < 1 || month > 12) return false;
    var daysInMonth = [31, isLeapYear(year) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
    if (day < 1 || day > daysInMonth[month - 1]) return false;
    return true;
  }

  function findAccount(appState, accountId) {
    var accounts = (appState && appState.accounts) || [];
    for (var i = 0; i < accounts.length; i++) {
      if (accounts[i].id === accountId) return accounts[i];
    }
    return null;
  }

  function accountExists(appState, accountId) {
    return findAccount(appState, accountId) !== null;
  }

  function findTransactionById(appState, txId) {
    var transactions = (appState && appState.transactions) || [];
    for (var i = 0; i < transactions.length; i++) {
      if (transactions[i].id === txId) return transactions[i];
    }
    return null;
  }

  // Clon profundo seguro: AppState es 100% datos serializables (sin funciones,
  // sin objetos Date, sin referencias circulares), así que JSON round-trip es
  // suficiente y garantiza cero mutación del estado original.
  function cloneState(appState) {
    return JSON.parse(JSON.stringify(appState || {}));
  }

  function shallowCopy(obj) {
    var copy = {};
    for (var key in obj) {
      if (Object.prototype.hasOwnProperty.call(obj, key)) copy[key] = obj[key];
    }
    return copy;
  }

  var __idCounter = 0;
  function generateId(prefix) {
    __idCounter += 1;
    return (
      (prefix || 'tx') +
      '_' +
      Date.now().toString(36) +
      '_' +
      __idCounter.toString(36) +
      '_' +
      Math.random().toString(36).slice(2, 8)
    );
  }

  function nowISOTimestamp() {
    return new Date().toISOString();
  }

  // Orden cronológico estable: fecha, luego createdAt, luego posición original.
  function sortedConfirmedUpTo(transactions, uptoDateISO) {
    return transactions
      .map(function (tx, idx) {
        return { tx: tx, idx: idx };
      })
      .filter(function (item) {
        return item.tx.status === 'confirmado' && isNonEmptyString(item.tx.dateISO) && item.tx.dateISO <= uptoDateISO;
      })
      .sort(function (a, b) {
        if (a.tx.dateISO !== b.tx.dateISO) return a.tx.dateISO < b.tx.dateISO ? -1 : 1;
        var ca = a.tx.createdAt || '';
        var cb = b.tx.createdAt || '';
        if (ca !== cb) return ca < cb ? -1 : 1;
        return a.idx - b.idx;
      })
      .map(function (item) {
        return item.tx;
      });
  }

  // ---------------------------------------------------------------------
  // API pública: window.App.calc.tx
  // ---------------------------------------------------------------------

  var txApi = {};

  /**
   * validateTransaction(appState, tx) -> { valid: boolean, errors: string[] }
   */
  txApi.validateTransaction = function (appState, tx) {
    var errors = [];

    if (!isPlainObject(tx)) {
      return { valid: false, errors: ['La transacción debe ser un objeto.'] };
    }

    if (VALID_TYPES.indexOf(tx.type) === -1) {
      errors.push('type es requerido y debe ser uno de: ' + VALID_TYPES.join(', ') + '.');
    }

    if (!isPositiveIntegerCents(tx.amountCents)) {
      errors.push('amountCents es requerido y debe ser un entero positivo (centavos).');
    }

    if (!isValidISODate(tx.dateISO)) {
      errors.push('dateISO es requerido y debe tener formato YYYY-MM-DD válido.');
    }

    if (!isNonEmptyString(tx.accountId)) {
      errors.push('accountId es requerido.');
    } else if (!accountExists(appState, tx.accountId)) {
      errors.push('accountId no corresponde a ninguna cuenta existente.');
    }

    if (tx.status !== undefined && VALID_STATUS.indexOf(tx.status) === -1) {
      errors.push('status, si se especifica, debe ser "pendiente" o "confirmado".');
    }

    if (tx.type === 'transferencia') {
      if (!isNonEmptyString(tx.toAccountId)) {
