  // -----------------------------------------------------------------------
  // Validacion de esquema (usada por load() e importBackupJSON())
  // -----------------------------------------------------------------------

  var REQUIRED_TOP_LEVEL = [
    'schemaVersion', 'demoMode', 'settings', 'accounts', 'categories',
    'incomeSources', 'recurringExpenses', 'debts', 'goals', 'transactions', 'weeklyPlans'
  ];

  var ARRAY_FIELDS = [
    'accounts', 'categories', 'incomeSources', 'recurringExpenses',
    'debts', 'goals', 'transactions', 'weeklyPlans'
  ];

  function F(field, type) { return { field: field, type: type }; }

  var ITEM_SCHEMAS = {
    accounts: [F('id', 'string'), F('name', 'string'), F('kind', 'string'), F('initialBalanceCents', 'number'), F('archived', 'boolean')],
    categories: [F('id', 'string'), F('name', 'string'), F('color', 'string'), F('isDefault', 'boolean')],
    incomeSources: [F('id', 'string'), F('name', 'string'), F('kind', 'string'), F('expectedAmountCents', 'number'), F('frequency', 'string'), F('nextDateISO', 'string'), F('accountId')],
    recurringExpenses: [F('id', 'string'), F('name', 'string'), F('amountCents', 'number'), F('frequency', 'string'), F('nextDueDateISO', 'string'), F('accountId'), F('categoryId')],
    debts: [F('id', 'string'), F('name', 'string'), F('minPaymentCents', 'number'), F('dueDay', 'number'), F('accountId'), F('frequency', 'string')],
    goals: [F('id', 'string'), F('name', 'string'), F('kind', 'string'), F('targetCents', 'number'), F('savedCents', 'number'), F('targetDateISO', 'string')],
    transactions: [F('id', 'string'), F('type', 'string'), F('amountCents', 'number'), F('dateISO', 'string'), F('accountId'), F('status', 'string')],
    weeklyPlans: [F('weekStartISO', 'string'), F('expectedIncomeCents', 'number'), F('receivedIncomeCents', 'number')]
  };

  function validateItems(arr, fieldDefs, label) {
    for (var i = 0; i < arr.length; i++) {
      var item = arr[i];
      if (!isPlainObject(item)) return 'Elemento invalido en ' + label + '[' + i + '] (se esperaba un objeto).';
      for (var f = 0; f < fieldDefs.length; f++) {
        var def = fieldDefs[f];
        if (!(def.field in item) || item[def.field] === undefined) {
          return 'Falta el campo "' + def.field + '" en ' + label + '[' + i + '].';
        }
        var val = item[def.field];
        if (def.type === 'string' && typeof val !== 'string') {
          return 'El campo "' + def.field + '" en ' + label + '[' + i + '] debe ser texto.';
        }
        if (def.type === 'number' && typeof val !== 'number') {
          return 'El campo "' + def.field + '" en ' + label + '[' + i + '] debe ser numerico.';
        }
        if (def.type === 'boolean' && typeof val !== 'boolean') {
          return 'El campo "' + def.field + '" en ' + label + '[' + i + '] debe ser booleano.';
        }
      }
    }
    return null;
  }

  function validateAppStateShape(obj) {
    if (!isPlainObject(obj)) return 'El backup no es un objeto JSON valido.';
    for (var i = 0; i < REQUIRED_TOP_LEVEL.length; i++) {
      var key = REQUIRED_TOP_LEVEL[i];
      if (!(key in obj)) return 'Falta el campo requerido "' + key + '" en el estado.';
    }
    if (typeof obj.schemaVersion !== 'number') return 'schemaVersion debe ser numerico.';
    if (typeof obj.demoMode !== 'boolean') return 'demoMode debe ser booleano.';
    if (!isPlainObject(obj.settings)) return 'settings debe ser un objeto.';
    for (var j = 0; j < ARRAY_FIELDS.length; j++) {
      if (!Array.isArray(obj[ARRAY_FIELDS[j]])) return ARRAY_FIELDS[j] + ' debe ser un arreglo.';
    }
    for (var k = 0; k < ARRAY_FIELDS.length; k++) {
      var name = ARRAY_FIELDS[k];
      var err = validateItems(obj[name], ITEM_SCHEMAS[name], name);
      if (err) return err;
    }
    return null;
  }

  // -----------------------------------------------------------------------
  // 3 & 4. load() / save()
  // -----------------------------------------------------------------------

  function migrateState(state, fromVersion) {
    // Migraciones futuras documentadas aqui (hoy solo existe schemaVersion 1,
    // por lo que no hay ninguna migracion real que ejecutar todavia):
    //
    // - v1 -> v2 (hipotetico ejemplo): si se agrega un campo nuevo a
    //   `accounts` (p.ej. `currency` por cuenta individual), recorrer
    //   `state.accounts` y asignar un valor por defecto a las cuentas
    //   existentes que no lo tengan.
    // - Si se renombra un campo (p.ej. `dueDay` de `debts` pasa a llamarse
    //   `dueDateISO`), mapear el valor antiguo al nuevo formato en cada
    //   elemento de `state.debts` y eliminar el campo obsoleto.
    // - Si cambia la unidad de una cantidad (p.ej. de dolares-float a
    //   centavos enteros), recorrer todos los objetos afectados
    //   (accounts, transactions, recurringExpenses, goals, debts, ...) y
    //   convertir con `window.App.money.toCents`.
    // - Cada paso de migracion deberia ser una funcion pura
    //   `migrateVxToVx1(state)` encadenada aqui segun `fromVersion`.
    state.schemaVersion = CURRENT_SCHEMA_VERSION;
    return state;
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      if (!isPlainObject(parsed)) return null;
      if (typeof parsed.schemaVersion !== 'number') return null;
      if (parsed.schemaVersion > CURRENT_SCHEMA_VERSION) {
        // Version futura desconocida para esta version del codigo: no
        // intentamos interpretarla para evitar corromper datos.
        return null;
      }
      if (parsed.schemaVersion < CURRENT_SCHEMA_VERSION) {
        parsed = migrateState(parsed, parsed.schemaVersion);
      }
      var shapeError = validateAppStateShape(parsed);
      if (shapeError) return null;
      return parsed;
    } catch (e) {
      return null;
    }
  }

  function save(appState) {
    try {
      var json = JSON.stringify(appState);
      localStorage.setItem(STORAGE_KEY, json);
      return { ok: true };
    } catch (e) {
      return { ok: false, error: (e && e.message) ? e.message : String(e) };
    }
  }

  // -----------------------------------------------------------------------
  // 5. exportCSV()
  // -----------------------------------------------------------------------

  function csvEscape(value) {
    var str = (value === null || value === undefined) ? '' : String(value);
    if (/[",\r\n]/.test(str)) {
      return '"' + str.replace(/"/g, '""') + '"';
    }
    return str;
  }

  // Convierte centavos enteros a un string decimal plano "1234.56",
  // sin depender de division float (evita errores de precision con
  // montos grandes) y preservando el signo para reembolsos/ajustes.
  function centsToPlainDecimal(cents) {
    var n = Math.round(Number(cents) || 0);
    var negative = n < 0;
    var abs = Math.abs(n);
    var dollars = Math.floor(abs / 100);
    var rem = abs % 100;
    var remStr = rem < 10 ? '0' + rem : String(rem);
    return (negative ? '-' : '') + dollars + '.' + remStr;
  }

  function exportCSV(appState) {
    var accountsById = {};
    (appState.accounts || []).forEach(function (a) { accountsById[a.id] = a.name; });
    var categoriesById = {};
    (appState.categories || []).forEach(function (c) { categoriesById[c.id] = c.name; });

    var header = ['Fecha', 'Tipo', 'Cuenta', 'Categoria', 'Comercio/Descripcion', 'Nota', 'Monto', 'Estado'];
    var lines = [header.map(csvEscape).join(',')];

    (appState.transactions || []).forEach(function (tx) {
      var row = [
        tx.dateISO || '',
        tx.type || '',
        accountsById[tx.accountId] || '',
        tx.categoryId ? (categoriesById[tx.categoryId] || '') : '',
        tx.merchant || '',
        tx.note || '',
        centsToPlainDecimal(tx.amountCents),
        tx.status || ''
      ];
      lines.push(row.map(csvEscape).join(','));
    });

    // CRLF por RFC 4180 (compatibilidad maxima con Excel y similares).
    return lines.join('\r\n');
  }

  // -----------------------------------------------------------------------
  // 6. exportBackupJSON()
  // -----------------------------------------------------------------------

  function exportBackupJSON(appState) {
    return JSON.stringify(appState, null, 2);
  }

  // -----------------------------------------------------------------------
  // 7. importBackupJSON()
  // -----------------------------------------------------------------------

  function mergeArrayByKey(mergedState, incomingState, arrayName, idField) {
    var existingIds = {};
    mergedState[arrayName].forEach(function (item) {
      existingIds[item[idField]] = true;
    });
    incomingState[arrayName].forEach(function (item) {
      if (!existingIds[item[idField]]) {
        mergedState[arrayName].push(deepClone(item));
        existingIds[item[idField]] = true;
      }
    });
  }

  function importBackupJSON(jsonString, currentState, mode) {
    if (mode !== 'reemplazar' && mode !== 'fusionar') {
      return { ok: false, error: 'Modo de importacion invalido. Usa "reemplazar" o "fusionar".' };
    }

    var parsed;
    try {
      parsed = JSON.parse(jsonString);
    } catch (e) {
      return { ok: false, error: 'JSON invalido: ' + ((e && e.message) ? e.message : String(e)) };
    }

    var shapeError = validateAppStateShape(parsed);
    if (shapeError) {
      return { ok: false, error: shapeError };
    }

    if (mode === 'reemplazar') {
      return { ok: true, state: deepClone(parsed) };
    }

    // mode === 'fusionar'
    if (!isPlainObject(currentState)) {
      return { ok: false, error: 'El estado actual no es valido; no se puede fusionar.' };
    }
    var currentShapeError = validateAppStateShape(currentState);
    if (currentShapeError) {
      return { ok: false, error: 'El estado actual no es valido; no se puede fusionar: ' + currentShapeError };
    }

    // Salvaguarda: nunca mezclar datos de demostracion con datos reales.
    if (currentState.demoMode !== parsed.demoMode) {
      return { ok: false, error: 'No se puede fusionar: el backup importado y el estado actual no coinciden en demoMode (uno es de demostracion y el otro no).' };
    }

    var merged = deepClone(currentState);
    merged.settings = Object.assign({}, currentState.settings, parsed.settings);

    mergeArrayByKey(merged, parsed, 'accounts', 'id');
    mergeArrayByKey(merged, parsed, 'categories', 'id');
    mergeArrayByKey(merged, parsed, 'incomeSources', 'id');
    mergeArrayByKey(merged, parsed, 'recurringExpenses', 'id');
    mergeArrayByKey(merged, parsed, 'debts', 'id');
    mergeArrayByKey(merged, parsed, 'goals', 'id');
    mergeArrayByKey(merged, parsed, 'transactions', 'id');
    mergeArrayByKey(merged, parsed, 'weeklyPlans', 'weekStartISO');

    return { ok: true, state: merged };
  }

  // -----------------------------------------------------------------------
  // 8. generateUpcomingOccurrences()
  // -----------------------------------------------------------------------

  function generateUpcomingOccurrences(appState, todayISO, daysAhead) {
    var d = window.App.date;
    var result = deepClone(appState);
    var endISO = d.addDays(todayISO, daysAhead);

    var existingKeys = {};
    result.transactions.forEach(function (tx) {
      if (tx.linkedRecurringId) {
        existingKeys[tx.linkedRecurringId + '|' + tx.dateISO] = true;
      }
    });

    var ts = nowISOTimestamp();

    // Genera ocurrencias PENDIENTES para una fuente (gasto recurrente o
    // ingreso) entre hoy y endISO, sin duplicar (clave: sourceId + fecha).
    // No marca nada como pagado/confirmado — status siempre 'pendiente'.
    function processSource(sourceId, frequency, anchorISO, txType, amountCents, accountId, categoryId) {
      var cursor = todayISO;
      var safety = 0;
      var SAFETY_LIMIT = 1000; // evita loops infinitos ante datos invalidos
      while (safety < SAFETY_LIMIT) {
        safety++;
        var occ;
        try {
          occ = d.nextOccurrence(cursor, frequency, anchorISO);
        } catch (e) {
          // Frecuencia no soportada por window.App.date: no generamos nada
          // para esta fuente en lugar de tumbar toda la operacion.
          break;
        }
        if (!occ || occ > endISO) break;
        var key = sourceId + '|' + occ;
        if (!existingKeys[key]) {
          result.transactions.push({
            id: genId('tx'),
            type: txType,
            amountCents: amountCents,
            dateISO: occ,
            accountId: accountId,
            toAccountId: null,
            categoryId: categoryId || null,
            merchant: '',
            note: 'Generado automáticamente',
            status: 'pendiente',
            linkedGoalId: null,
            linkedRecurringId: sourceId,
            linkedDebtId: null,
            reversesTxId: null,
            createdAt: ts,
            updatedAt: ts
          });
          existingKeys[key] = true;
        }
        var next = d.addDays(occ, 1);
        if (next > endISO || next <= cursor) break;
        cursor = next;
      }
    }

    (appState.recurringExpenses || []).forEach(function (exp) {
      processSource(exp.id, exp.frequency, exp.nextDueDateISO, 'gasto', exp.amountCents, exp.accountId, exp.categoryId);
    });

    (appState.incomeSources || []).forEach(function (inc) {
      processSource(inc.id, inc.frequency, inc.nextDateISO, 'ingreso', inc.expectedAmountCents, inc.accountId, null);
    });

    return result;
  }

  // -----------------------------------------------------------------------
  // Mini test runner casero (__runTests)
  // -----------------------------------------------------------------------

  function __runTests() {
    var results = [];

    function test(name, fn) {
      try {
        fn();
        results.push({ name: name, pass: true });
      } catch (e) {
        results.push({ name: name, pass: false, detail: (e && e.message) ? e.message : String(e) });
      }
    }

    function assert(cond, msg) {
      if (!cond) throw new Error(msg || 'Asercion fallo');
    }

    function assertEqual(a, b, msg) {
      var as = JSON.stringify(a);
      var bs = JSON.stringify(b);
      if (as !== bs) throw new Error((msg || 'Valores distintos') + ' -- esperado: ' + bs + ', obtenido: ' + as);
    }

    // Parser RFC 4180 minimo, usado SOLO dentro de los tests para verificar
    // que exportCSV() produce un CSV re-parseable.
    function parseCSVForTest(csvText) {
      var rows = [];
      var row = [];
      var field = '';
      var inQuotes = false;
      var i = 0;
      while (i < csvText.length) {
        var c = csvText[i];
        if (inQuotes) {
          if (c === '"') {
            if (csvText[i + 1] === '"') { field += '"'; i += 2; continue; }
            inQuotes = false; i++; continue;
          }
          field += c; i++; continue;
        } else {
          if (c === '"') { inQuotes = true; i++; continue; }
          if (c === ',') { row.push(field); field = ''; i++; continue; }
          if (c === '\r') { i++; continue; }
          if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
          field += c; i++; continue;
        }
      }
      row.push(field);
      rows.push(row);
      return rows;
    }

    // Respaldar cualquier dato real que ya estuviera en localStorage bajo
    // nuestra clave, para restaurarlo al final y no pisar datos del usuario
    // al correr los tests.
    var hadBackup = false;
    var backupRaw = null;
    try {
      backupRaw = localStorage.getItem(STORAGE_KEY);
      hadBackup = true;
    } catch (e) {
      hadBackup = false;
    }

    try {
      // ---- Test 1: round-trip guardar/cargar ----
      test('save() + load() round-trip mantiene los datos identicos', function () {
        var original = createEmptyState();
        original.accounts.push({ id: 'acc1', name: 'Cuenta Test', kind: 'banco', initialBalanceCents: 10000, creditLimitCents: null, archived: false });
        var saveResult = save(original);
        assert(saveResult.ok === true, 'save() deberia retornar ok:true, obtuvo: ' + JSON.stringify(saveResult));
        var loaded = load();
        assert(loaded !== null, 'load() no deberia retornar null justo despues de guardar');
        assertEqual(loaded, original, 'Los datos cargados deben ser identicos a los guardados');
      });

      // ---- Test 2: importar JSON corrupto (falta campo requerido) ----
      test('importBackupJSON rechaza backup con campo requerido faltante, sin lanzar excepcion', function () {
        var broken = createEmptyState();
        delete broken.settings; // falta un campo requerido a nivel raiz
        var res = importBackupJSON(JSON.stringify(broken), createEmptyState(), 'reemplazar');
        assert(res.ok === false, 'Debe retornar ok:false para un backup sin "settings"');
        assert(typeof res.error === 'string' && res.error.length > 0, 'Debe incluir un mensaje de error legible');
      });

      // ---- Test 2b: JSON sintacticamente invalido tampoco lanza ----
      test('importBackupJSON rechaza JSON sintacticamente invalido sin lanzar excepcion', function () {
        var res = importBackupJSON('{ esto no es json valido', createEmptyState(), 'reemplazar');
        assert(res.ok === false, 'Debe retornar ok:false para JSON malformado');
        assert(typeof res.error === 'string' && res.error.length > 0, 'Debe incluir mensaje de error');
      });

      // ---- Test 3: fusionar sin duplicar transacciones existentes ----
      test('importBackupJSON en modo fusionar no duplica transacciones con id ya existente', function () {
        var current = createEmptyState();
        current.transactions.push({
          id: 'tx1', type: 'gasto', amountCents: 500, dateISO: '2026-01-01',
          accountId: null, toAccountId: null, categoryId: null, merchant: 'X', note: '',
          status: 'confirmado', linkedGoalId: null, linkedRecurringId: null, linkedDebtId: null,
          reversesTxId: null, createdAt: 'a', updatedAt: 'a'
        });
        var incoming = createEmptyState();
        incoming.transactions.push({
          id: 'tx1', type: 'gasto', amountCents: 999999, dateISO: '2026-02-02',
          accountId: null, toAccountId: null, categoryId: null, merchant: 'Y', note: '',
          status: 'confirmado', linkedGoalId: null, linkedRecurringId: null, linkedDebtId: null,
          reversesTxId: null, createdAt: 'b', updatedAt: 'b'
        });
        incoming.transactions.push({
          id: 'tx2', type: 'ingreso', amountCents: 100, dateISO: '2026-02-03',
          accountId: null, toAccountId: null, categoryId: null, merchant: '', note: '',
          status: 'confirmado', linkedGoalId: null, linkedRecurringId: null, linkedDebtId: null,
          reversesTxId: null, createdAt: 'b', updatedAt: 'b'
        });
        var res = importBackupJSON(JSON.stringify(incoming), current, 'fusionar');
        assert(res.ok === true, 'Debe retornar ok:true, error: ' + (res.error || ''));
        var withId1 = res.state.transactions.filter(function (t) { return t.id === 'tx1'; });
        assert(withId1.length === 1, 'No debe duplicar tx1, encontro: ' + withId1.length);
        assert(withId1[0].amountCents === 500, 'Debe conservar el tx1 original (500), no el importado (999999)');
        var withId2 = res.state.transactions.filter(function (t) { return t.id === 'tx2'; });
        assert(withId2.length === 1, 'Debe agregar tx2 (nuevo), encontro: ' + withId2.length);
      });

      // ---- Test 4: generateUpcomingOccurrences no duplica en llamadas repetidas ----
      test('generateUpcomingOccurrences no crea duplicados al llamarse dos veces seguidas', function () {
        var d = window.App.date;
        var state = createEmptyState();
        state.accounts.push({ id: 'accA', name: 'A', kind: 'banco', initialBalanceCents: 0, creditLimitCents: null, archived: false });
        var todayISO = d.today();
        state.recurringExpenses.push({
          id: 'rec1', name: 'Suscripcion', amountCents: 1000, frequency: 'mensual',
          nextDueDateISO: d.addDays(todayISO, 2), accountId: 'accA', categoryId: null, reservedCents: 0
        });
        var afterFirst = generateUpcomingOccurrences(state, todayISO, 35);
        var countFirst = afterFirst.transactions.filter(function (t) { return t.linkedRecurringId === 'rec1'; }).length;
        assert(countFirst >= 1, 'Debe generar al menos una ocurrencia, genero: ' + countFirst);
        afterFirst.transactions.forEach(function (t) {
          assert(t.status === 'pendiente', 'Toda ocurrencia generada debe quedar en estado "pendiente"');
        });
        var afterSecond = generateUpcomingOccurrences(afterFirst, todayISO, 35);
        var countSecond = afterSecond.transactions.filter(function (t) { return t.linkedRecurringId === 'rec1'; }).length;
        assertEqual(countSecond, countFirst, 'La segunda llamada no debe agregar ocurrencias duplicadas');
      });

      // ---- Test 5: exportCSV escapa comas y comillas (RFC 4180) ----
      test('exportCSV escapa comas, comillas y saltos de linea de forma re-parseable', function () {
        var state = createEmptyState();
        state.accounts.push({ id: 'accA', name: 'Cuenta "Principal", Ahorros', kind: 'banco', initialBalanceCents: 0, creditLimitCents: null, archived: false });
        state.transactions.push({
          id: 'tx1', type: 'gasto', amountCents: 150075, dateISO: '2026-03-01', accountId: 'accA',
          toAccountId: null, categoryId: null, merchant: 'Tienda, "La Buena" S.A.', note: 'Linea1\nLinea2, con "comillas"',
          status: 'confirmado', linkedGoalId: null, linkedRecurringId: null, linkedDebtId: null,
          reversesTxId: null, createdAt: 'a', updatedAt: 'a'
        });
        var csv = exportCSV(state);
        var rows = parseCSVForTest(csv);
        assert(rows.length === 2, 'Debe tener fila de cabecera + 1 fila de datos, obtuvo ' + rows.length);
        var dataRow = rows[1];
        assertEqual(dataRow[2], 'Cuenta "Principal", Ahorros', 'El nombre de cuenta con comilla y coma debe re-parsearse igual');
        assertEqual(dataRow[4], 'Tienda, "La Buena" S.A.', 'El comercio con coma y comillas debe re-parsearse igual');
        assertEqual(dataRow[5], 'Linea1\nLinea2, con "comillas"', 'La nota con salto de linea debe re-parsearse igual');
        assertEqual(dataRow[6], '1500.75', 'El monto debe formatearse como "1500.75"');
      });

      // ---- Test 6 (extra): createDemoState siempre trae demoMode:true y no toca datos reales ----
      test('createDemoState() produce un estado marcado demoMode:true con datos de ejemplo', function () {
        var demo = createDemoState();
        assert(demo.demoMode === true, 'createDemoState debe producir demoMode:true');
        assert(demo.accounts.length > 0 && demo.transactions.length > 0, 'El estado demo debe traer cuentas y transacciones de ejemplo');
        var shapeError = validateAppStateShape(demo);
        assert(shapeError === null, 'El estado demo debe cumplir el esquema valido: ' + shapeError);
      });

      // ---- Test 7 (extra): fusionar demo con real debe rechazarse ----
      test('importBackupJSON en modo fusionar rechaza mezclar demo con datos reales', function () {
        var real = createEmptyState();
        var demo = createDemoState();
        var res = importBackupJSON(JSON.stringify(demo), real, 'fusionar');
        assert(res.ok === false, 'No debe permitir fusionar un backup demo dentro de un estado real');
      });
    } finally {
      // Restaurar el localStorage tal como estaba antes de correr los tests.
      try {
        if (hadBackup) {
          if (backupRaw === null) {
            localStorage.removeItem(STORAGE_KEY);
          } else {
            localStorage.setItem(STORAGE_KEY, backupRaw);
          }
        }
      } catch (e) { /* noop */ }
    }

    var passed = results.filter(function (r) { return r.pass; }).length;
    var failed = results.length - passed;
    var summary = { total: results.length, passed: passed, failed: failed, results: results };

    if (typeof console !== 'undefined' && console.log) {
      console.log('[App.state.__runTests] ' + passed + '/' + results.length + ' pruebas OK');
      results.forEach(function (r) {
        if (!r.pass) {
          console.log('  FALLO: ' + r.name + ' -> ' + r.detail);
        }
      });
    }

    return summary;
  }

  // -----------------------------------------------------------------------
  // Export
  // -----------------------------------------------------------------------

  window.App.state = {
    createEmptyState: createEmptyState,
    createDemoState: createDemoState,
    load: load,
    save: save,
    exportCSV: exportCSV,
    exportBackupJSON: exportBackupJSON,
    importBackupJSON: importBackupJSON,
    generateUpcomingOccurrences: generateUpcomingOccurrences,
    __runTests: __runTests
  };
})();

</script>
<script>
/* ===== modules/dbsync.js ===== */
/**
 * dbsync.js
 *
 * Sincroniza el AppState con el capability "db" de Claude: un documento
 * en la nube ligado a este artefacto, para que los datos sobrevivan a
 * recargas, sesiones y dispositivos SIN exportar/importar JSON a mano.
 *
 * REGLA CENTRAL: los datos de DEMOSTRACION nunca se guardan ni se suben,
 * y nunca compiten con datos reales. Un estado demo se trata siempre como
 * "no hay datos locales": cualquier dato real remoto lo reemplaza.
 *
 * En este entorno el almacenamiento del navegador puede no persistir
 * entre sesiones, asi que la NUBE es la fuente de verdad y localStorage
 * es solo un cache rapido. Por eso la app espera la primera respuesta de
 * la nube antes de decidir que mostrar cuando no hay nada local.
 *
 * No toca el DOM. Valida todo dato remoto con
 * window.App.state.importBackupJSON antes de aplicarlo.
 */

window.App = window.App || {};

(function () {
  'use strict';

  var DOC_PATH = 'cuentas/estado';
  var dbApi = null;
  var ready = false;
  var pushTimer = null;
  var pendingState = null;
  var PUSH_DELAY_MS = 700;

  function isAvailable() {
    return typeof window.claude !== 'undefined' && typeof window.claude.use === 'function';
  }

  // Un estado de demostracion no es dato del usuario: jamas se persiste
  // ni se sube ni se compara por fecha contra datos reales.
  function isReal(state) {
    return !!state && state.demoMode !== true;
  }

  function doWrite(appState) {
    if (!ready || !dbApi) return;
    if (!isReal(appState)) return;
    dbApi.doc(DOC_PATH).set({
      appState: appState,
      savedAtISO: new Date().toISOString()
    }).catch(function () {
      // Fallo silencioso: el cache local conserva el dato; solo no se
      // sincronizo esta vez.
    });
  }

  /**
   * opts:
   *   onRemoteState(state)  aplicar datos reales llegados de la nube
   *   getLocalState()       estado actual en memoria (puede ser demo)
   *   onFirstSnapshot(hadRemoteData)  se llama UNA vez, cuando la nube
   *                         responde por primera vez, para que la app
   *                         deje de esperar
   *   onUnavailable()       la nube no esta disponible en esta vista
   */
  function init(opts) {
    opts = opts || {};
    var firstDone = false;
    function resolveFirst(had) {
      if (firstDone) return;
      firstDone = true;
      if (typeof opts.onFirstSnapshot === 'function') opts.onFirstSnapshot(had);
    }

    if (!isAvailable()) {
      if (typeof opts.onUnavailable === 'function') opts.onUnavailable();
      resolveFirst(false);
      return;
    }

    window.claude.use('db').then(function (db) {
      if (!db) {
        if (typeof opts.onUnavailable === 'function') opts.onUnavailable();
        resolveFirst(false);
        return;
      }
      dbApi = db;
      ready = true;

      dbApi.doc(DOC_PATH).onSnapshot(function (snap) {
        var localRaw = (typeof opts.getLocalState === 'function') ? opts.getLocalState() : null;
        var localState = isReal(localRaw) ? localRaw : null; // demo == sin datos

        if (!snap || !snap.exists) {
          // Nada en la nube todavia. Solo subimos si hay datos REALES.
          if (localState) push(localState);
          resolveFirst(false);
          return;
        }

        var data = snap.data();
        if (!data || !data.appState) { resolveFirst(false); return; }

        var result = window.App.state.importBackupJSON(
          JSON.stringify(data.appState), null, 'reemplazar'
        );
        if (!result || !result.ok) { resolveFirst(false); return; }

        var remoteState = result.state;
        if (!isReal(remoteState)) { resolveFirst(false); return; }

        // Sin datos locales reales: lo remoto manda, siempre.
        if (!localState) {
          if (typeof opts.onRemoteState === 'function') opts.onRemoteState(remoteState);
          resolveFirst(true);
          return;
        }

        var remoteTs = remoteState.lastModifiedISO || '';
        var localTs = localState.lastModifiedISO || '';

        if (remoteTs > localTs) {
          if (typeof opts.onRemoteState === 'function') opts.onRemoteState(remoteState);
        } else if (localTs > remoteTs) {
          // La nube quedo atras (p.ej. la app se cerro antes de subir):
          // la ponemos al dia en vez de descartar lo local.
          push(localState);
        }
        resolveFirst(true);
      }, function () {
        ready = false;
        if (typeof opts.onUnavailable === 'function') opts.onUnavailable();
        resolveFirst(false);
      });
    }).catch(function () {
      dbApi = null;
      ready = false;
      if (typeof opts.onUnavailable === 'function') opts.onUnavailable();
      resolveFirst(false);
    });
  }

  // Agrupa ediciones seguidas en un solo guardado.
  function push(appState) {
    if (!isReal(appState)) return;
    pendingState = appState;
    if (!ready || !dbApi) return;
    if (pushTimer) clearTimeout(pushTimer);
    pushTimer = setTimeout(function () {
      var s = pendingState;
      pendingState = null;
      pushTimer = null;
      doWrite(s);
    }, PUSH_DELAY_MS);
  }

  // Guarda de inmediato lo pendiente. Enganchado al cierre/ocultamiento
  // de la pestana para que cerrar justo despues de editar no pierda los
  // ultimos cambios.
  function flush() {
    if (pushTimer) { clearTimeout(pushTimer); pushTimer = null; }
    if (pendingState) {
      var s = pendingState;
      pendingState = null;
      doWrite(s);
    }
  }

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') flush();
  });
  window.addEventListener('pagehide', flush);

  window.App.dbSync = {
    init: init,
    push: push,
    flush: flush,
    isReal: isReal
  };
})();

</script>
<script>
/* ===== app.js ===== */
(function () {
  'use strict';

  // =========================================================================
  // Helpers globales
  // =========================================================================

  var M = null, D = null; // se asignan en init(), ya cargados los modulos
  var STATE = null;
  var currentScreen = 'panel';
  var downloadsApi = null;

  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function fmt(cents) { return M.format(cents || 0); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function escAttr(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;'); }
  function uid(prefix) { return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8); }
  function byId(arr, id) { return (arr || []).find(function (x) { return x.id === id; }) || null; }

  var TYPE_LABELS = { ingreso: 'Ingreso', gasto: 'Gasto', transferencia: 'Transferencia', reembolso: 'Reembolso' };
  var ACCOUNT_KIND_LABELS = { banco: 'Banco', efectivo: 'Efectivo', tarjeta_credito: 'Tarjeta de crédito' };
  var FREQ_LABELS = { semanal: 'Semanal', quincenal: 'Quincenal', mensual: 'Mensual', trimestral: 'Trimestral', anual: 'Anual', irregular: 'Irregular' };
  var GOAL_KIND_LABELS = { emergencia: 'Fondo de emergencia', estudios: 'Estudios', carro: 'Carro', vacaciones: 'Vacaciones', gasto_anual: 'Gasto anual', otro: 'Otro', ahorro: 'Ahorro' };
  var GOAL_STATUS_LABELS = { al_dia: 'Al día', adelantada: 'Adelantada', atrasada: 'Atrasada', vencida: 'Vencida', completada: 'Completada' };
  var GOAL_STATUS_PILL = { al_dia: 'pill-ok', adelantada: 'pill-ok', atrasada: 'pill-warn', vencida: 'pill-bad', completada: 'pill-ok' };
  var STATUS_LABELS = { pendiente: 'Pendiente', confirmado: 'Confirmado' };
  var DAY_LABELS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
  var DEFAULT_PALETTE = ['#2F7A4F', '#A8781F', '#3D6FE0', '#B23B3B', '#7E5AA8', '#2B8C96', '#C97A2B', '#5C6B4A', '#8A5A44', '#4A6B8C'];

  function goalKindLabel(k) {
    if (GOAL_KIND_LABELS[k]) return GOAL_KIND_LABELS[k];
    if (!k) return 'Meta';
    return k.charAt(0).toUpperCase() + k.slice(1);
  }

  function displayDate(iso) {
    if (!iso) return '—';
    var d = D.parseISO(iso);
    return d.toLocaleDateString('es-US', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
  }
  function displayDateShort(iso) {
    if (!iso) return '—';
    var d = D.parseISO(iso);
    return d.toLocaleDateString('es-US', { day: 'numeric', month: 'short', timeZone: 'UTC' });
  }

  function toast(msg) {
    var t = $('#toastEl');
    if (!t) {
      t = document.createElement('div');
      t.id = 'toastEl';
      t.className = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._hideTimer);
    t._hideTimer = setTimeout(function () { t.classList.remove('show'); }, 3200);
  }

  function accountOptions(includeArchived) {
    return (STATE.accounts || [])
      .filter(function (a) { return includeArchived || !a.archived; })
      .map(function (a) { return { value: a.id, label: a.name + ' (' + (ACCOUNT_KIND_LABELS[a.kind] || a.kind) + ')' }; });
  }
  function categoryOptions() {
    var opts = [{ value: '', label: 'Sin categoría' }];
    (STATE.categories || []).forEach(function (c) { opts.push({ value: c.id, label: c.name }); });
    return opts;
  }
  function freqOptions(withIrregular) {
    var keys = ['semanal', 'quincenal', 'mensual', 'trimestral', 'anual'];
    if (withIrregular) keys.push('irregular');
    return keys.map(function (k) { return { value: k, label: FREQ_LABELS[k] }; });
  }

  // =========================================================================
  // Persistencia
  // =========================================================================

  // El indicador de guardado vive en dos sitios (barra lateral en
  // escritorio, cabecera fija en movil): se actualizan los dos a la vez.
  function setSavedLabel(text) {
    $$('[data-saved-label]').forEach(function (el) { el.textContent = text; });
  }

  function persist(newState) {
    STATE = newState;
    document.body.dataset.demo = STATE.demoMode ? 'true' : 'false';

    // Los datos de ejemplo NUNCA se guardan ni se suben: si se
    // persistieran, al abrir de nuevo taparian los datos reales.
    if (STATE.demoMode) {
      setSavedLabel('Ejemplo — no se guarda');
      RENDERERS[currentScreen]();
      return;
    }

    STATE.lastModifiedISO = new Date().toISOString();
    var res = window.App.state.save(STATE);
    setSavedLabel((res && res.ok)
      ? 'Guardado ' + new Date().toLocaleTimeString('es-US', { hour: '2-digit', minute: '2-digit' })
      : 'Error al guardar' + (res && res.error ? (': ' + res.error) : ''));
    if (window.App.dbSync) window.App.dbSync.push(STATE);
    RENDERERS[currentScreen]();
  }

  // Aplica un estado real llegado de la nube (otra sesion u otro
  // dispositivo). A diferencia de persist(), NO lo vuelve a subir (ya
  // esta alli; evita un eco infinito) y no interrumpe un formulario
  // abierto.
  function applyRemoteState(newState) {
    STATE = newState;
    document.body.dataset.demo = STATE.demoMode ? 'true' : 'false';
    window.App.state.save(STATE); // cache local
    setSavedLabel('Sincronizado ' + new Date().toLocaleTimeString('es-US', { hour: '2-digit', minute: '2-digit' }));
    clearSyncingBanner(null);
    var modalOpen = $('#modalBackdrop') && $('#modalBackdrop').classList.contains('open');
    if (!modalOpen) RENDERERS[currentScreen]();
  }

  // Aviso mientras la nube responde: sin esto, ver datos de ejemplo al
  // abrir hace creer que todo se perdio.
  function showSyncingBanner() {
    if ($('#syncBanner')) return;
    var main = document.querySelector('main');
    if (!main) return;
    var div = document.createElement('div');
    div.id = 'syncBanner';
    div.className = 'banner';
    div.innerHTML = '<span><strong>Buscando tus datos guardados…</strong> Lo que ves abajo son datos de ejemplo; se reemplazaran solos si encontramos los tuyos.</span>';
    main.insertBefore(div, main.firstChild);
  }

  function clearSyncingBanner(reason) {
    var el = $('#syncBanner');
    if (!el) return;
    if (!reason) { el.remove(); return; }
    if (reason === 'sin-datos') {
      el.innerHTML = '<span><strong>No hay datos guardados todavia.</strong> Estas viendo el ejemplo. Ve a <em>Copia de seguridad</em> → “Empezar con mis propios datos” para comenzar.</span>';
    } else if (reason === 'sin-nube') {
      el.innerHTML = '<span><strong>Esta copia guarda solo en este dispositivo.</strong> Lo que ves ahora son datos de ejemplo. ' +
        'Importa tu respaldo JSON desde <em>Copia de seguridad</em>, o empieza de cero desde ahí.</span>';
    }
  }

  // =========================================================================
  // Navegación y modal
  // =========================================================================

  function switchScreen(screen) {
    currentScreen = screen;
    $$('.nav-item').forEach(function (b) {
      if (b.dataset.nav === screen) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    $$('.screen').forEach(function (s) { s.classList.toggle('active', s.dataset.screen === screen); });
    RENDERERS[screen]();
    window.scrollTo(0, 0);
  }

  function wireNav() {
    $$('.nav-item').forEach(function (btn) {
      btn.addEventListener('click', function () { switchScreen(btn.dataset.nav); });
    });
  }

  function openModal(titleHtml, bodyHtml) {
    var body = $('#modalBody');
    body.innerHTML = '<h3>' + titleHtml + '</h3>' + bodyHtml;
    $('#modalBackdrop').classList.add('open');
    // Bloquea el scroll del fondo: en movil la hoja se abre desde abajo y
    // sin esto el contenido de atras se arrastra junto con ella.
    document.body.style.overflow = 'hidden';
    $('#modalBackdrop').scrollTop = 0;
    labelTableCells(body);
    // El foco automatico solo en escritorio: en movil abriria el teclado
    // encima de la hoja antes de que el usuario vea su contenido.
    if (window.innerWidth > 860) {
      var first = body.querySelector('input:not([type="hidden"]), select, textarea');
      if (first) { try { first.focus({ preventScroll: true }); } catch (e) { first.focus(); } }
    }
  }
  function closeModal() {
    $('#modalBackdrop').classList.remove('open');
    $('#modalBody').innerHTML = '';
    document.body.style.overflow = '';
  }
  function wireModal() {
    $('#modalBackdrop').addEventListener('click', function (e) {
      if (e.target.id === 'modalBackdrop') closeModal();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeModal();
    });
  }

  // =========================================================================
  // Adaptación a pantalla pequeña
  // =========================================================================

  /**
   * Bajo 720px el CSS apila cada fila de tabla como una tarjeta. Para que
   * cada celda siga diciendo QUÉ dato muestra, se copia el encabezado de
   * su columna a `data-label` (el CSS lo pinta con ::before).
   *
   * Se resuelve aquí, una sola vez tras cada render, en lugar de repetir
   * el atributo en las ~15 tablas que genera la app a mano.
   *
   * Solo se convierten las tablas CON encabezado: las de dos columnas sin
   * <thead> (desgloses, alternativas) ya se leen bien tal cual.
   */
  function labelTableCells(root) {
    $$('.table-wrap', root || document).forEach(function (wrap) {
      var table = wrap.querySelector('table');
      if (!table) return;
      var heads = $$('thead th', table).map(function (th) { return th.textContent.trim(); });
      if (!heads.length) { wrap.classList.remove('cards-wrap'); return; }
      wrap.classList.add('cards-wrap');
      $$('tbody tr', table).forEach(function (tr) {
        Array.prototype.forEach.call(tr.children, function (td, i) {
          if (td.hasAttribute('colspan')) return;
          var label = heads[i] || '';
          td.setAttribute('data-label', label);
          var vacia = !label && td.textContent.trim() === '' && !td.children.length;
          td.classList.toggle('is-empty', vacia);
        });
      });
    });
  }

  // ---------- Tema (claro / auto / oscuro) ----------

  var THEME_KEY = 'cuentas_claras_theme';
  var THEME_ORDER = ['auto', 'light', 'dark'];

  function readTheme() {
    try {
      var t = localStorage.getItem(THEME_KEY);
      return THEME_ORDER.indexOf(t) !== -1 ? t : 'auto';
    } catch (e) { return 'auto'; }
  }

  function applyTheme(theme) {
    if (theme === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', theme);
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) { /* modo privado: solo esta sesión */ }

    $$('[data-theme-set]').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.themeSet === theme));
    });
    var icon = $('#themeCycleIcon');
    if (icon) icon.setAttribute('href', '#i-theme-' + theme);

    // La barra de estado del teléfono debe seguir al tema elegido.
    var oscuro = theme === 'dark' ||
      (theme === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    $$('meta[name="theme-color"]').forEach(function (m) { m.remove(); });
    var meta = document.createElement('meta');
    meta.name = 'theme-color';
    meta.content = oscuro ? '#10150F' : '#F4F6F2';
    document.head.appendChild(meta);
  }

  function wireTheme() {
    applyTheme(readTheme());
    $$('[data-theme-set]').forEach(function (b) {
      b.addEventListener('click', function () { applyTheme(b.dataset.themeSet); });
    });
    var cycle = $('#themeCycleBtn');
    if (cycle) cycle.addEventListener('click', function () {
      var i = THEME_ORDER.indexOf(readTheme());
      applyTheme(THEME_ORDER[(i + 1) % THEME_ORDER.length]);
    });
    if (window.matchMedia) {
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      var onChange = function () { if (readTheme() === 'auto') applyTheme('auto'); };
      if (mq.addEventListener) mq.addEventListener('change', onChange);
      else if (mq.addListener) mq.addListener(onChange);
    }
  }

  // ---------- Acción rápida flotante (móvil) ----------

  function openQuickAddModal() {
    if (!STATE.accounts.length) {
      switchScreen('config');
      toast('Agrega primero una cuenta para registrar movimientos');
      return;
    }
    openModal('Nueva transacción', formHtml(transactionFields(null), { dateISO: D.today(), status: 'confirmado' }));
    var form = $('#modalBody .modal-form');
    form.querySelector('[data-cancel]').addEventListener('click', closeModal);
    var typeSelect = form.elements['type'];
    function syncVisibility() {
      var t = typeSelect.value;
      toggleField(form, 'toAccountId', t === 'transferencia');
      toggleField(form, 'reversesTxId', t === 'reembolso');
      toggleField(form, 'categoryId', t === 'gasto' || t === 'ingreso' || t === 'reembolso');
    }
    typeSelect.addEventListener('change', syncVisibility);
    syncVisibility();
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var data = collectForm(form, transactionFields(null));
      if (!data.toAccountId) delete data.toAccountId;
      if (!data.categoryId) delete data.categoryId;
      if (!data.reversesTxId) delete data.reversesTxId;
      try {
        var newState = window.App.calc.tx.applyTransaction(STATE, data);
        closeModal();
        persist(newState);
        toast('Transacción agregada');

        showFormError(form, err.message || String(err));
      }
    });

  // Reemplaza window.confirm(): los artifacts corren en un iframe con sandbox
  // que bloquea los diálogos nativos (confirm/alert/prompt) sin previo aviso.
  function confirmAction(message, onConfirm, opts) {
    opts = opts || {};
    var body = '<p style="font-size:13.5px;color:var(--ink-soft);line-height:1.6;">' + esc(message) + '</p>' +
      '<div class="modal-actions">' +
      '<button type="button" class="btn btn-ghost" data-cancel>Cancelar</button>' +
      '<button type="button" class="btn ' + (opts.danger === false ? 'btn-primary' : 'btn-danger') + '" data-confirm-action>' + esc(opts.confirmLabel || 'Confirmar') + '</button>' +
      '</div>';
    openModal(esc(opts.title || 'Confirmar'), body);
    var box = $('#modalBody');
    box.querySelector('[data-cancel]').addEventListener('click', closeModal);
    box.querySelector('[data-confirm-action]').addEventListener('click', function () {
      closeModal();
      onConfirm();
    });
  }

  // =========================================================================
  // Formularios genéricos
  // =========================================================================

  function fieldHtml(f, value) {
    var val = (value === undefined || value === null) ? (f.default !== undefined ? f.default : '') : value;
    if (f.type === 'select') {
      var opts = f.options.map(function (o) {
        return '<option value="' + escAttr(o.value) + '"' + (String(o.value) === String(val) ? ' selected' : '') + '>' + esc(o.label) + '</option>';
      }).join('');
      return '<div class="field"><label>' + esc(f.label) + '</label><select name="' + f.name + '">' + opts + '</select></div>';
    }
    if (f.type === 'money') {
      var dollars = val ? (val / 100).toFixed(2) : '';
      return '<div class="field"><label>' + esc(f.label) + '</label><input type="number" step="0.01" name="' + f.name + '" value="' + escAttr(dollars) + '" placeholder="0.00"></div>';
    }
    if (f.type === 'date') {
      return '<div class="field"><label>' + esc(f.label) + '</label><input type="date" name="' + f.name + '" value="' + escAttr(val || '') + '"></div>';
    }
    if (f.type === 'color') {
      return '<div class="field"><label>' + esc(f.label) + '</label><input type="color" name="' + f.name + '" value="' + escAttr(val || '#2F7A4F') + '"></div>';
    }
    if (f.type === 'number') {
      return '<div class="field"><label>' + esc(f.label) + '</label><input type="number" name="' + f.name + '" value="' + escAttr(val || '') + '" placeholder="' + escAttr(f.placeholder || '') + '"></div>';
    }
    return '<div class="field"><label>' + esc(f.label) + '</label><input type="text" name="' + f.name + '" value="' + escAttr(val) + '" placeholder="' + escAttr(f.placeholder || '') + '"></div>';
  }

  function formHtml(fields, values, extraHtml) {
    return '<form class="modal-form">' +
      '<div class="form-row">' + fields.map(function (f) { return fieldHtml(f, values ? values[f.name] : undefined); }).join('') + '</div>' +
      (extraHtml || '') +
      '<div class="form-error" hidden></div>' +
      '<div class="modal-actions">' +
      '<button type="button" class="btn btn-ghost" data-cancel>Cancelar</button>' +
      '<button type="submit" class="btn btn-primary">Guardar</button>' +
      '</div></form>';
  }

  function collectForm(formEl, fields) {
    var out = {};
    fields.forEach(function (f) {
      var el = formEl.elements[f.name];
      if (!el) return;
      if (f.type === 'money') out[f.name] = M.toCents(parseFloat(el.value || '0') || 0);
      else if (f.type === 'number') out[f.name] = el.value === '' ? null : Number(el.value);
      else out[f.name] = el.value;
    });
    return out;
  }

  function showFormError(formEl, msg) {
    var box = formEl.querySelector('.form-error');
    box.textContent = msg;
    box.hidden = false;
  }

      '<button class="btn btn-primary btn-sm" data-new>+ Agregar</button></div>' +

        : '<div class="empty">' + esc(opts.emptyText) + '</div>') +

  function wireCrudCard(container, opts) {
    var card = container.querySelector('[data-crud="' + opts.key + '"]');
    if (!card) return;
    var newBtn = card.querySelector('[data-new]');
    if (newBtn) newBtn.addEventListener('click', function () { openCrudForm(opts, null); });
    card.querySelectorAll('[data-edit]').forEach(function (b) {
      b.addEventListener('click', function () {
        var item = byId(opts.getList(), b.dataset.edit);
        openCrudForm(opts, item);
      });
    });
    card.querySelectorAll('[data-del]').forEach(function (b) {
      b.addEventListener('click', function () {
        confirmAction('¿Eliminar este elemento? Esta acción no se puede deshacer.', function () {
          var list = opts.getList().filter(function (x) { return x.id !== b.dataset.del; });
          var newState = shallowStateWith(opts.stateKey, list);
          persist(newState);
        });
      });
    });
  }

  function shallowStateWith(stateKey, newArray) {
    var copy = Object.assign({}, STATE);
    copy[stateKey] = newArray;
    return copy;
  }

  function openCrudForm(opts, existingItem) {
    var title = (existingItem ? 'Editar ' : 'Agregar ') + opts.entityLabel;
    openModal(esc(title), formHtml(opts.fields(), existingItem));
    var form = $('#modalBody .modal-form');
    form.querySelector('[data-cancel]').addEventListener('click', closeModal);
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var data = collectForm(form, opts.fields());
      var error = opts.validate ? opts.validate(data, existingItem) : null;
      if (error) { showFormError(form, error); return; }
      var list = opts.getList().slice();
      if (existingItem) {
        var idx = list.findIndex(function (x) { return x.id === existingItem.id; });
        list[idx] = Object.assign({}, existingItem, data);
      } else {
        var item = Object.assign({ id: uid(opts.idPrefix) }, opts.defaults ? opts.defaults() : {}, data);
        list.push(item);
      }
      var newState = shallowStateWith(opts.stateKey, list);
      if (opts.afterBuild) newState = opts.afterBuild(newState, data, existingItem);
      closeModal();
      persist(newState);
      toast((existingItem ? 'Actualizado' : 'Agregado') + ': ' + opts.entityLabel);
    });
  }

  // =========================================================================
  // PANEL (dashboard)
  // =========================================================================

  // Ultimo dia real del mes: evita fechas imposibles como "31 de febrero".
  function lastDayOfMonth(y, mo) {
    return new Date(Date.UTC(y, mo, 0)).getUTCDate();
  }

  // Construye la fecha de vencimiento recortando el dia al ultimo valido
  // del mes (dia 31 en un mes de 30 -> 30; en febrero -> 28 o 29).
  function clampedDue(y, mo, day) {
    var last = lastDayOfMonth(y, mo);
    var d = Math.min(Math.max(1, Number(day) || 1), last);
    return y + '-' + String(mo).padStart(2, '0') + '-' + String(d).padStart(2, '0');
  }

  function estimateNextDue(item, todayISO) {
    if (item.nextDueDateISO) {
      if (item.nextDueDateISO >= todayISO) return item.nextDueDateISO;
      // Una frecuencia irregular o desconocida no tiene proxima fecha
      // calculable: se omite de la lista en vez de tumbar toda la
      // pantalla, que es lo que ocurria antes.
      try {
        return D.nextOccurrence(todayISO, item.frequency, item.nextDueDateISO) || null;
      } catch (e) {
        return null;
      }
    }
    if (item.dueDay) {
      var y = Number(todayISO.slice(0, 4)), mo = Number(todayISO.slice(5, 7));
      var iso = clampedDue(y, mo, item.dueDay);
      if (iso < todayISO) {
        var ny = (mo === 12) ? y + 1 : y;
        var nm = (mo === 12) ? 1 : mo + 1;
        iso = clampedDue(ny, nm, item.dueDay);
      }
      return iso;
    }
    return null;
  }

  function donutSvg(segments, size, thickness) {
    size = size || 168; thickness = thickness || 24;
    var total = segments.reduce(function (s, x) { return s + x.value; }, 0);
    var r = (size - thickness) / 2, cx = size / 2, cy = size / 2;
    var circumference = 2 * Math.PI * r;
    var offset = 0;
    var paths = segments.filter(function (s) { return s.value > 0; }).map(function (seg) {
      var frac = total > 0 ? seg.value / total : 0;
      var dash = frac * circumference;
      var gap = circumference - dash;
      var circle = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + seg.color + '" stroke-width="' + thickness +
        '" stroke-dasharray="' + dash.toFixed(2) + ' ' + gap.toFixed(2) + '" stroke-dashoffset="' + (-offset).toFixed(2) + '" transform="rotate(-90 ' + cx + ' ' + cy + ')"></circle>';
      offset += dash;
      return circle;
    }).join('');
    return '<svg viewBox="0 0 ' + size + ' ' + size + '" width="' + size + '" height="' + size + '" role="img" aria-label="Gasto por categoría">' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="var(--surface-sunken)" stroke-width="' + thickness + '"></circle>' + paths + '</svg>';
  }

  function renderPanel() {
    var el = $('#screen-panel');
    var today = D.today();
    var avail = window.App.calc.available.computeAvailableToSpend(STATE, today);
    var weekStartISO = D.startOfWeek(today, STATE.settings.weekStartsOn);
    var weekRow = window.App.planner.computeWeeklyRow(STATE, weekStartISO);
    var reserves = window.App.calc.reserves.computeAllReserves(STATE, today);
    var monthStart = today.slice(0, 7) + '-01';
    var totals = window.App.calc.tx.periodTotals(STATE, monthStart, today);

    var catTotals = {};
    (STATE.transactions || []).forEach(function (tx) {
      if (tx.type === 'gasto' && tx.status === 'confirmado' && tx.dateISO >= monthStart && tx.dateISO <= today) {
        var key = tx.categoryId || '__sin__';
        catTotals[key] = (catTotals[key] || 0) + tx.amountCents;
      }
    });
    var catRows = Object.keys(catTotals).map(function (catId) {
      var cat = byId(STATE.categories, catId);
      return { name: cat ? cat.name : 'Sin categoría', color: cat ? cat.color : '#9AA396', amount: catTotals[catId] };
    }).sort(function (a, b) { return b.amount - a.amount; });

    var horizon = D.addDays(today, 14);
    var upcoming = [];
    (STATE.recurringExpenses || []).forEach(function (exp) {
      var next = estimateNextDue(exp, today);
      if (next && next >= today && next <= horizon) upcoming.push({ name: exp.name, dateISO: next, amountCents: exp.amountCents || 0 });
    });
    (STATE.debts || []).forEach(function (debt) {
      var next = estimateNextDue(debt, today);
      if (next && next >= today && next <= horizon) upcoming.push({ name: debt.name + ' (pago mínimo)', dateISO: next, amountCents: debt.minPaymentCents || 0 });
    });
    // Comparador consistente: devolver 0 en empates evita un orden
    // impredecible cuando dos pagos caen el mismo dia.
    upcoming.sort(function (a, b) {
      if (a.dateISO < b.dateISO) return -1;
      if (a.dateISO > b.dateISO) return 1;
      return a.name < b.name ? -1 : (a.name > b.name ? 1 : 0);
    });

    var unallocatedPreview = window.App.planner.proposeIncomeDistribution(
      STATE, weekRow.receivedIncomeCents || weekRow.expectedIncomeCents || 0, today
    );

    var pendingCount = (STATE.transactions || []).filter(function (t) { return t.status === 'pendiente'; }).length;

    el.innerHTML =
      '<div class="topbar"><div><h1>Panel</h1><div class="topbar-sub">' + displayDate(today) + ' · semana del ' + displayDateShort(weekStartISO) + '</div></div>' +
      '<div class="topbar-actions">' +
      '<button class="btn btn-ghost btn-sm" data-action="reload-occ">Actualizar previsiones</button>' +
      '<button class="btn btn-primary btn-sm" data-action="review">Revisión semanal' + (pendingCount ? ' (' + pendingCount + ')' : '') + '</button>' +
      '</div></div>' +

      (avail.availableCents < 0
        ? '<div class="banner"><span>⚠ Tu disponible para gastar es <strong>' + fmt(avail.availableCents) + '</strong>: hay más comprometido que dinero líquido. Revisa reservas y metas.</span></div>'
        : '') +

      '<div class="card-grid stats-grid">' +
      statCard('Disponible para gastar', avail.availableCents, avail.availableCents >= 0 ? 'positive' : 'negative', 'De ' + fmt(avail.liquidBalanceCents) + ' en cuentas líquidas') +
      statCard('Ingresos este mes', totals.incomeCents, 'positive', 'Desde el ' + displayDateShort(monthStart)) +
      statCard('Gastos este mes', totals.expenseCents, 'negative', 'Neto de reembolsos') +
      statCard('Ahorro esta semana', weekRow.actualSavingsCents, 'positive', 'Plan: ' + fmt(weekRow.plannedSavingsCents)) +
      statCard('Pendiente de asignar', unallocatedPreview.unallocatedCents, '', 'De tu ingreso más reciente de la semana') +
      statCard('Reservado para facturas', reserves.totalReserveCentsThisPeriod, '', reserves.perExpense.length + ' gasto(s) recurrente(s)') +
      '</div>' +

      '<div class="two-col">' +
      '<div class="section"><div class="card">' +
      '<div class="section-head"><div><span class="section-eyebrow">Desglose</span><h2>¿De dónde sale tu disponible?</h2></div></div>' +
      '<div class="table-wrap"><table><tbody>' +
      avail.breakdown.map(function (b) {
        return '<tr><td class="wrap">' + esc(b.label) + '</td><td class="amount" style="text-align:right;">' + fmt(b.amountCents) + '</td></tr>';
      }).join('') +
      '</tbody></table></div></div></div>' +

      '<div class="section"><div class="card">' +
      '<div class="section-head"><div><span class="section-eyebrow">Este mes</span><h2>Gasto por categoría</h2></div></div>' +
      (catRows.length
        ? '<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap;">' +
          donutSvg(catRows.map(function (c) { return { value: c.amount, color: c.color }; })) +
          '<div style="flex:1;min-width:140px;">' + catRows.map(function (c) {
            return '<div class="legend-row"><span><span class="cat-dot" style="background:' + c.color + '"></span>' + esc(c.name) + '</span><span class="num">' + fmt(c.amount) + '</span></div>';
          }).join('') + '</div></div>'
        : '<div class="empty">Sin gastos confirmados este mes todavía.</div>') +
      '</div></div>' +
      '</div>' +

      '<div class="section"><div class="card">' +
      '<div class="section-head"><div><span class="section-eyebrow">Próximos 14 días</span><h2>Pagos por venir</h2></div></div>' +
      (upcoming.length
        ? '<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Concepto</th><th style="text-align:right;">Monto</th></tr></thead><tbody>' +
          upcoming.map(function (u) { return '<tr><td>' + displayDateShort(u.dateISO) + '</td><td class="wrap">' + esc(u.name) + '</td><td class="amount" style="text-align:right;">' + fmt(u.amountCents) + '</td></tr>'; }).join('') +
          '</tbody></table></div>'
        : '<div class="empty">No hay pagos previstos en los próximos 14 días.</div>') +
      '</div></div>';

    el.querySelector('[data-action="review"]').addEventListener('click', openWeeklyReview);
    el.querySelector('[data-action="reload-occ"]').addEventListener('click', function () {

  function statCard(label, cents, tone, detail) {

  function openWeeklyReview() {
    var today = D.today();
    var pending = (STATE.transactions || []).filter(function (t) { return t.status === 'pendiente' && t.dateISO <= D.addDays(today, 1); })
      .sort(function (a, b) { return a.dateISO < b.dateISO ? -1 : 1; });

    var body =
      '<p class="lede" style="font-size:14px;">Semana del ' + displayDateShort(weekStartISO) + ': recibiste <strong>' + fmt(row.receivedIncomeCents) +
      '</strong> de ' + fmt(row.expectedIncomeCents) + ' esperado, gastaste <strong>' + fmt(row.plannedExpensesCents) + '</strong> previsto, y ahorraste ' +
      fmt(row.actualSavingsCents) + ' de ' + fmt(row.plannedSavingsCents) + ' planificado.</p>' +
      '<h3 style="font-size:14px;margin:16px 0 8px;">Movimientos pendientes de confirmar</h3>' +
      (pending.length
        ? '<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Concepto</th><th>Monto</th><th></th></tr></thead><tbody>' + pending.map(function (tx) {
            var acc = byId(STATE.accounts, tx.accountId);
            return '<tr><td>' + displayDateShort(tx.dateISO) + '</td><td class="wrap">' + esc(tx.merchant || TYPE_LABELS[tx.type]) + (acc ? ' · ' + esc(acc.name) : '') + '</td>' +
              '<td class="amount">' + fmt(tx.amountCents) + '</td>' +

          }).join('') + '</tbody></table></div>'
        : '<div class="empty">No hay movimientos pendientes.</div>') +
      '<div class="modal-actions"><button type="button" class="btn btn-primary" data-cancel>Cerrar</button></div>';

    openModal('Revisión semanal', body);
    var box = $('#modalBody');
    box.querySelector('[data-cancel]').addEventListener('click', closeModal);
    box.querySelectorAll('[data-confirm]').forEach(function (b) {
      b.addEventListener('click', function () { confirmPendingTx(b.dataset.confirm); closeModal(); openWeeklyReview(); });
    });
    box.querySelectorAll('[data-discard]').forEach(function (b) {
      b.addEventListener('click', function () { discardPendingTx(b.dataset.discard); closeModal(); openWeeklyReview(); });
    });
  }

  function confirmPendingTx(txId) {
    var tx = byId(STATE.transactions, txId);
    if (!tx) return;
    var newState = window.App.calc.tx.editTransaction(STATE, txId, { status: 'confirmado' });
    if (tx.linkedRecurringId) {
      newState = advanceRecurringFor(newState, tx.linkedRecurringId, tx.dateISO);
    }
    persist(newState);
    toast('Movimiento confirmado');
  }
  function discardPendingTx(txId) {
    var newState = shallowStateWith('transactions', STATE.transactions.filter(function (t) { return t.id !== txId; }));
    persist(newState);
    toast('Previsión descartada');
  }
  function advanceRecurringFor(state, sourceId, occurredISO) {
    var copy = Object.assign({}, state);
    var found = false;
    copy.recurringExpenses = (state.recurringExpenses || []).map(function (exp) {
      if (exp.id === sourceId) {
        found = true;
        return Object.assign({}, exp, { nextDueDateISO: D.nextOccurrence(D.addDays(occurredISO, 1), exp.frequency, exp.nextDueDateISO), reservedCents: 0 });
      }
      return exp;
    });
    if (!found) {
      copy.incomeSources = (state.incomeSources || []).map(function (inc) {
        if (inc.id === sourceId) return Object.assign({}, inc, { nextDateISO: D.nextOccurrence(D.addDays(occurredISO, 1), inc.frequency, inc.nextDateISO) });
        return inc;
      });
    }
    return copy;
  }

  var txFilters = { q: '', type: '', accountId: '', categoryId: '', from: '', to: '' };

  function transactionFields(tx) {
    var type = tx ? tx.type : 'gasto';
    return [
      { name: 'type', label: 'Tipo', type: 'select', options: [{ value: 'gasto', label: 'Gasto' }, { value: 'ingreso', label: 'Ingreso' }, { value: 'transferencia', label: 'Transferencia' }, { value: 'reembolso', label: 'Reembolso' }] },
      { name: 'dateISO', label: 'Fecha', type: 'date', default: D.today() },
      { name: 'amountCents', label: 'Monto', type: 'money' },
      { name: 'accountId', label: type === 'transferencia' ? 'Desde cuenta' : 'Cuenta', type: 'select', options: accountOptions() },
      { name: 'toAccountId', label: 'Hacia cuenta', type: 'select', options: [{ value: '', label: '—' }].concat(accountOptions()) },
      { name: 'categoryId', label: 'Categoría', type: 'select', options: categoryOptions() },
      { name: 'merchant', label: 'Comercio / descripción', type: 'text', placeholder: 'Ej. Supermercado' },
      { name: 'note', label: 'Nota (opcional)', type: 'text' },
      { name: 'reversesTxId', label: 'Revierte el gasto', type: 'select', options: [{ value: '', label: '—' }].concat(recentExpenseOptions()) },
      { name: 'status', label: 'Estado', type: 'select', options: [{ value: 'confirmado', label: 'Confirmado' }, { value: 'pendiente', label: 'Pendiente' }] }
    ];
  }
  function recentExpenseOptions() {
    return (STATE.transactions || []).filter(function (t) { return t.type === 'gasto'; })
      .sort(function (a, b) { return a.dateISO < b.dateISO ? 1 : -1; }).slice(0, 40)
      .map(function (t) { return { value: t.id, label: displayDateShort(t.dateISO) + ' · ' + (t.merchant || 'Gasto') + ' · ' + fmt(t.amountCents) }; });
  }

  function renderTransacciones() {
    var el = $('#screen-transacciones');
    if (!STATE.accounts.length) {
      el.innerHTML = '<div class="topbar"><h1>Transacciones</h1></div><div class="banner"><span>Primero agrega al menos una cuenta en <strong>Configuración</strong> para poder registrar movimientos.</span><button class="btn btn-primary btn-sm" data-goto-config>Ir a Configuración</button></div>';
      el.querySelector('[data-goto-config]').addEventListener('click', function () { switchScreen('config'); });
      return;
    }

    var pending = (STATE.transactions || []).filter(function (t) { return t.status === 'pendiente' && t.linkedRecurringId; })
      .sort(function (a, b) { return a.dateISO < b.dateISO ? -1 : 1; });

    var filtered = (STATE.transactions || []).slice().sort(function (a, b) { return a.dateISO < b.dateISO ? 1 : -1; })
      .filter(function (t) {
        if (txFilters.type && t.type !== txFilters.type) return false;
        if (txFilters.accountId && t.accountId !== txFilters.accountId && t.toAccountId !== txFilters.accountId) return false;
        if (txFilters.categoryId && t.categoryId !== txFilters.categoryId) return false;
        if (txFilters.from && t.dateISO < txFilters.from) return false;
        if (txFilters.to && t.dateISO > txFilters.to) return false;
        if (txFilters.q) {
          var hay = ((t.merchant || '') + ' ' + (t.note || '')).toLowerCase();
          if (hay.indexOf(txFilters.q.toLowerCase()) === -1) return false;
        }
        return true;
      });

    el.innerHTML =
      '<div class="topbar"><div><h1>Transacciones</h1><div class="topbar-sub">Registra y revisa cada movimiento de dinero</div></div>' +
      '<div class="topbar-actions only-mobile"><button class="btn btn-primary" data-quick-add>+ Añadir transacción</button></div></div>' +

      '<div class="card section quick-add-card">' +
      '<div class="section-head"><div><span class="section-eyebrow">Entrada rápida</span><h2>Añadir transacción</h2></div></div>' +
      formHtml(transactionFields(null), { dateISO: D.today(), status: 'confirmado' }) +
      '</div>' +

      (pending.length
        ? '<div class="card section"><div class="section-head"><div><span class="section-eyebrow">Sin confirmar</span><h2>Próximas previsiones (' + pending.length + ')</h2></div></div>' +
          '<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Concepto</th><th style="text-align:right">Monto</th><th></th></tr></thead><tbody>' +
          pending.map(function (tx) {
            return '<tr><td>' + displayDateShort(tx.dateISO) + '</td><td class="wrap">' + esc(recurringNameFor(tx.linkedRecurringId)) + '</td>' +
              '<td class="amount" style="text-align:right">' + fmt(tx.amountCents) + '</td>' +
              '<td><div class="row-actions"><button class="btn btn-sm btn-primary" data-confirm-prev="' + tx.id + '">Confirmar</button>' +
              '<button class="btn btn-sm btn-ghost" data-discard-prev="' + tx.id + '">Descartar</button></div></td></tr>';
          }).join('') + '</tbody></table></div></div>'
        : '') +

      '<div class="card section">' +
      '<div class="section-head"><div><span class="section-eyebrow">Historial</span><h2>Todas las transacciones</h2></div></div>' +
      '<div class="form-row" style="margin-bottom:14px;">' +
      '<div class="field"><label>Buscar</label><input type="text" id="fQ" placeholder="Comercio o nota" value="' + escAttr(txFilters.q) + '"></div>' +
      '<div class="field"><label>Tipo</label><select id="fType"><option value="">Todos</option>' + Object.keys(TYPE_LABELS).map(function (k) { return '<option value="' + k + '"' + (txFilters.type === k ? ' selected' : '') + '>' + TYPE_LABELS[k] + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label>Cuenta</label><select id="fAcc"><option value="">Todas</option>' + accountOptions(true).map(function (o) { return '<option value="' + o.value + '"' + (txFilters.accountId === o.value ? ' selected' : '') + '>' + esc(o.label) + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label>Desde</label><input type="date" id="fFrom" value="' + txFilters.from + '"></div>' +
      '<div class="field"><label>Hasta</label><input type="date" id="fTo" value="' + txFilters.to + '"></div>' +
      '</div>' +
      (filtered.length
        ? '<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Cuenta</th><th>Categoría</th><th>Descripción</th><th style="text-align:right">Monto</th><th>Estado</th><th></th></tr></thead><tbody>' +
          filtered.map(renderTxRow).join('') + '</tbody></table></div>'
        : '<div class="empty">No hay transacciones que coincidan con los filtros.</div>') +
      '</div>';

    wireQuickAddForm(el);
    wireFilters(el);
    wireTxRowActions(el);

    var quickBtn = el.querySelector('[data-quick-add]');
    if (quickBtn) quickBtn.addEventListener('click', openQuickAddModal);

    el.querySelectorAll('[data-confirm-prev]').forEach(function (b) { b.addEventListener('click', function () { confirmPendingTx(b.dataset.confirmPrev); }); });
    el.querySelectorAll('[data-discard-prev]').forEach(function (b) { b.addEventListener('click', function () { discardPendingTx(b.dataset.discardPrev); }); });
  }

  function recurringNameFor(id) {
    var exp = byId(STATE.recurringExpenses, id);
    if (exp) return exp.name;
    var inc = byId(STATE.incomeSources, id);
    if (inc) return inc.name + ' (ingreso)';
    return 'Previsión';
  }

  function renderTxRow(tx) {
    var acc = byId(STATE.accounts, tx.accountId);
    var toAcc = byId(STATE.accounts, tx.toAccountId);
    var cat = byId(STATE.categories, tx.categoryId);
    var amtClass = tx.type === 'ingreso' || tx.type === 'reembolso' ? 'amount-in' : (tx.type === 'gasto' ? 'amount-out' : 'amount');
    var sign = (tx.type === 'ingreso' || tx.type === 'reembolso') ? '+' : (tx.type === 'gasto' ? '-' : '');
    return '<tr>' +
      '<td>' + displayDateShort(tx.dateISO) + '</td>' +
      '<td>' + TYPE_LABELS[tx.type] + '</td>' +
      '<td class="wrap">' + esc(acc ? acc.name : '—') + (toAcc ? ' → ' + esc(toAcc.name) : '') + '</td>' +
      '<td>' + (cat ? '<span class="cat-dot" style="background:' + cat.color + '"></span>' + esc(cat.name) : '—') + '</td>' +
      '<td class="wrap">' + esc(tx.merchant || tx.note || '—') + '</td>' +
      '<td class="' + amtClass + '" style="text-align:right">' + sign + fmt(tx.amountCents) + '</td>' +
      '<td><span class="pill ' + (tx.status === 'confirmado' ? 'pill-ok' : 'pill-warn') + '">' + STATUS_LABELS[tx.status] + '</span></td>' +
      '<td><div class="row-actions">' +
      '<button class="btn btn-sm btn-ghost" data-edit-tx="' + tx.id + '">Editar</button>' +
      '<button class="btn btn-sm btn-danger" data-del-tx="' + tx.id + '">Eliminar</button>' +
      '</div></td></tr>';
  }

  function wireQuickAddForm(container) {
    var form = container.querySelector('.modal-form') || container.querySelector('form');
    if (!form) return;
    var typeSelect = form.elements['type'];
    function syncVisibility() {
      var t = typeSelect.value;
      toggleField(form, 'toAccountId', t === 'transferencia');
      toggleField(form, 'reversesTxId', t === 'reembolso');
      toggleField(form, 'categoryId', t === 'gasto' || t === 'ingreso' || t === 'reembolso');
    }
    typeSelect.addEventListener('change', syncVisibility);
    syncVisibility();

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var data = collectForm(form, transactionFields(null));
      if (!data.toAccountId) delete data.toAccountId;
      if (!data.categoryId) delete data.categoryId;
      if (!data.reversesTxId) delete data.reversesTxId;
      try {
        var newState = window.App.calc.tx.applyTransaction(STATE, data);
        form.reset();
        persist(newState);
        toast('Transacción agregada');
      } catch (err) {
        showFormError(form, err.message || String(err));
      }
    });
  }
  function toggleField(form, name, show) {
    var el = form.elements[name];
    if (!el) return;
    var wrap = el.closest('.field');
    if (wrap) wrap.style.display = show ? '' : 'none';
  }

  function wireFilters(container) {
    container.querySelector('#fQ').addEventListener('input', function (e) { txFilters.q = e.target.value; renderTransacciones(); });
    container.querySelector('#fType').addEventListener('change', function (e) { txFilters.type = e.target.value; renderTransacciones(); });
    container.querySelector('#fAcc').addEventListener('change', function (e) { txFilters.accountId = e.target.value; renderTransacciones(); });
    container.querySelector('#fFrom').addEventListener('change', function (e) { txFilters.from = e.target.value; renderTransacciones(); });
    container.querySelector('#fTo').addEventListener('change', function (e) { txFilters.to = e.target.value; renderTransacciones(); });
  }

  function wireTxRowActions(container) {
    container.querySelectorAll('[data-del-tx]').forEach(function (b) {
      b.addEventListener('click', function () {
        confirmAction('¿Eliminar esta transacción?', function () {
          persist(shallowStateWith('transactions', STATE.transactions.filter(function (t) { return t.id !== b.dataset.delTx; })));
        });
      });
    });
    container.querySelectorAll('[data-edit-tx]').forEach(function (b) {
      b.addEventListener('click', function () { openEditTxModal(byId(STATE.transactions, b.dataset.editTx)); });
    });
  }

  function openEditTxModal(tx) {
    openModal('Editar transacción', formHtml(transactionFields(tx), tx));
    var form = $('#modalBody .modal-form');
    form.querySelector('[data-cancel]').addEventListener('click', closeModal);
    var typeSelect = form.elements['type'];
    function syncVisibility() {
      var t = typeSelect.value;
      toggleField(form, 'toAccountId', t === 'transferencia');
      toggleField(form, 'reversesTxId', t === 'reembolso');
      toggleField(form, 'categoryId', t === 'gasto' || t === 'ingreso' || t === 'reembolso');
    }
    typeSelect.addEventListener('change', syncVisibility);
    syncVisibility();
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var patch = collectForm(form, transactionFields(tx));
      if (!patch.toAccountId) patch.toAccountId = null;
      if (!patch.categoryId) patch.categoryId = null;
      if (!patch.reversesTxId) patch.reversesTxId = null;
      try {
        var newState = window.App.calc.tx.editTransaction(STATE, tx.id, patch);
        closeModal();
        persist(newState);
        toast('Transacción actualizada');
      } catch (err) {
        showFormError(form, err.message || String(err));
      }
    });
  }

  function renderSemana() {
    var el = $('#screen-semana');

    el.innerHTML =
      '<div class="topbar"><div><h1>Plan semanal</h1><div class="topbar-sub">Semanas reales (izquierda) y proyectadas (derecha)</div></div></div>' +

      '<div class="card section">' +
      '<div class="table-wrap"><table><thead><tr>' +

      rows.map(function (r) {
        var tag = r.isHistorical ? '<span class="pill pill-neutral">Real</span>' : (r.isProjection ? '<span class="pill pill-warn">Proyección</span>' : '<span class="pill pill-ok">Esta semana</span>');

          '<td class="amount" style="text-align:right">' + fmt(r.expectedIncomeCents) + '</td>' +
          '<td class="amount-in" style="text-align:right">' + fmt(r.receivedIncomeCents) + '</td>' +
          '<td class="amount-out" style="text-align:right">' + fmt(r.plannedExpensesCents) + '</td>' +
          '<td class="amount" style="text-align:right">' + fmt(r.pendingReservesCents) + '</td>' +
          '<td class="amount" style="text-align:right">' + fmt(r.plannedSavingsCents) + '</td>' +
          '<td class="amount-in" style="text-align:right">' + fmt(r.actualSavingsCents) + '</td>' +
          '<td class="amount' + (r.availableToSpendCents < 0 ? ' amount-out' : '') + '" style="text-align:right">' + fmt(r.availableToSpendCents) + '</td>' +
          '</tr>';
      }).join('') + '</tbody></table></div>' +
      '<p class="hint">"Disponible" aquí es el flujo de la semana (recibido menos comprometido); para tu efectivo disponible en general, mira el Panel.</p>' +
      '</div>' +

      '<div class="card section">' +
      '<div class="section-head"><div><span class="section-eyebrow">Herramienta</span><h2>Distribuir un ingreso</h2></div></div>' +
      '<div class="form-row">' +
      '<div class="field"><label>Monto recibido</label><input type="number" step="0.01" id="distAmount" placeholder="0.00"></div>' +
      '<div class="field"><label>Fecha</label><input type="date" id="distDate" value="' + today + '"></div>' +
      '<div class="field" style="justify-content:flex-end;"><button class="btn btn-primary" id="distBtn">Calcular propuesta</button></div>' +
      '</div>' +
      '<div id="distResult"></div>' +

    $('#distBtn').addEventListener('click', function () {
      var amount = M.toCents(parseFloat($('#distAmount').value || '0') || 0);
      var dateISO = $('#distDate').value || today;
      if (amount <= 0) { toast('Ingresa un monto mayor a cero'); return; }

      renderDistributionResult(proposal, amount, dateISO);
